<!DOCTYPE html>
<html>
<head>
    <title>Katina — Waiter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #f7f5f2;
            color: #1a1a1a;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 24px 24px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(255,107,53,0.35);
        }
        header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
        .bell {
            background: #ff6b35;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            display: none;
        }
        .container { padding: 24px; max-width: 1000px; margin: 0 auto; }

        .open-form {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
        }
        .open-form b { font-size: 15px; }
        .open-form input {
            padding: 12px 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            margin-right: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
        button {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }
        button.danger { background: #e74c3c; }
        button.success { background: #1d7d72; }
        button.secondary { background: #f0f0f0; color: #555; }
        button.primary { background: linear-gradient(135deg, #ff6b35, #f7931e); }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 22px; font-weight: 800;
            margin: 8px 0 18px;
        }
        .section-title .bar {
            width: 5px; height: 22px; border-radius: 3px;
            background: #ff6b35;
        }
        .section-title .count-badge {
            background: #eee; color: #666;
            font-size: 13px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
            cursor: pointer;
            border-top: 5px solid #ddd;
            transition: transform 0.15s;
        }
        .card:hover { transform: translateY(-3px); }
        .card.empty { border-top-color: #1d7d72; }
        .card.has-pending { border-top-color: #ff6b35; }
        .card.called { border-top-color: #f39c12; }
        .card.wants-pay { border-top-color: #7c3aed; }
        .card.needs-release { border-top-color: #999; }
        .card h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .card .meta { font-size: 13px; color: #777; margin: 3px 0; }
        .pill {
            display: inline-block;
            font-size: 11px; font-weight: 800;
            padding: 4px 12px; border-radius: 20px;
            background: #f0f0f0;
            margin-top: 8px; margin-right: 4px;
        }
        .pill.pending { background: #fff4e6; color: #b9770e; }
        .pill.called { background: #fff4e6; color: #f39c12; }
        .pill.pay { background: #f3ecfb; color: #7c3aed; }
        .pill.release { background: #eee; color: #666; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 28px;
            width: 92%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .modal h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .order-line {
            border-bottom: 1px solid #f2f2f2;
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-line .info { font-size: 14px; font-weight: 600; }
        .order-line .actions button { margin-left: 6px; font-size: 12px; padding: 8px 12px; }
        .action-row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .close-modal {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 24px; color: #bbb;
        }
        #modalResult { margin-top: 14px; font-size: 13px; font-weight: 600; color: #555; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo">🍽️</div>
            <h1>Katina — Waiter</h1>
        </div>
        <span class="bell" id="bell">🔔 <span id="bellCount">0</span> new</span>
    </header>

    <div class="container">

        <div class="open-form">
            <b>Register a New Table</b><br>
            <input type="text" id="newTableId" placeholder="table id (e.g. T-1)">
            <input type="text" id="newTableLabel" placeholder="display name (optional)">
            <button class="primary" onclick="registerTable()">Register Table</button>
            <p id="registerResult" style="margin-top:10px; font-size:13px; color:#555;"></p>
        </div>

        <div class="section-title">
            <span class="bar"></span>Tables
            <span class="count-badge" id="tableCount">0</span>
        </div>
        <div class="grid" id="tableGrid"></div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        let currentTableId = null;

        function registerTable() {
            const tableId = document.getElementById("newTableId").value;
            const label = document.getElementById("newTableLabel").value;
            if (!tableId) return alert("Enter a table id");

            fetch(`${BASE}/tables?table_id=${tableId}&display_label=${label || tableId}`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    document.getElementById("registerResult").innerText =
                        data.error || `Table "${tableId}" registered.`;
                    document.getElementById("newTableId").value = "";
                    document.getElementById("newTableLabel").value = "";
                    loadTables();
                });
        }

        function loadTables() {
            Promise.all([
                fetch(`${BASE}/tables`).then(r => r.json()),
                fetch(`${BASE}/orders/pending`).then(r => r.json()),
            ]).then(([tables, pendingOrders]) => {

                document.getElementById("tableCount").innerText = tables.length;

                const pendingCountBySession = {};
                pendingOrders.forEach(o => {
                    pendingCountBySession[o.session_id] = (pendingCountBySession[o.session_id] || 0) + 1;
                });

                const sessionFetches = tables
                    .filter(t => t.active_session_id)
                    .map(t =>
                        fetch(`${BASE}/sessions/${t.active_session_id}`)
                            .then(r => r.json())
                            .then(session => ({ table_id: t.table_id, session }))
                    );

                Promise.all(sessionFetches).then(results => {
                    const sessionByTableId = {};
                    results.forEach(r => {
                        if (!r.session.error) sessionByTableId[r.table_id] = r.session;
                    });

                    const grid = document.getElementById("tableGrid");
                    grid.innerHTML = "";
                    let totalPending = 0;

                    tables.forEach(t => {
                        const session = sessionByTableId[t.table_id];

                        if (!session) {
                            grid.innerHTML += `
                                <div class="card empty" onclick="openTableModal('${t.table_id}')">
                                    <h3>${t.display_label || t.table_id}</h3>
                                    <div class="meta">🟢 Empty</div>
                                </div>
                            `;
                            return;
                        }

                        if (session.status !== "OPEN") {
                            grid.innerHTML += `
                                <div class="card needs-release" onclick="openTableModal('${t.table_id}')">
                                    <h3>${t.display_label || t.table_id}</h3>
                                    <div class="meta">⏹️ Session ${session.status.toLowerCase()}</div>
                                    <span class="pill release">Needs release</span>
                                </div>
                            `;
                            return;
                        }

                        const pending = pendingCountBySession[session.session_id] || 0;
                        totalPending += pending;

                        let cardClass = "";
                        if (pending > 0) cardClass = "has-pending";
                        if (session.waiter_called) cardClass = "called";
                        if (session.payment_requested) cardClass = "wants-pay";

                        let badges = "";
                        if (pending > 0) badges += `<span class="pill pending">${pending} pending</span>`;
                        if (session.waiter_called) badges += `<span class="pill called">🔔 called</span>`;
                        if (session.payment_requested) badges += `<span class="pill pay">💳 wants to pay</span>`;

                        grid.innerHTML += `
                            <div class="card ${cardClass}" onclick="openTableModal('${t.table_id}')">
                                <h3>${t.display_label || t.table_id}</h3>
                                <div class="meta">👥 ${session.party_size} people</div>
                                <div class="meta">${session.is_paid ? "💰 Paid" : "❌ Unpaid"}</div>
                                ${badges}
                            </div>
                        `;
                    });

                    const bell = document.getElementById("bell");
                    bell.style.display = totalPending > 0 ? "inline-block" : "none";
                    document.getElementById("bellCount").innerText = totalPending;

                    if (currentTableId) openTableModal(currentTableId, true);
                });
            });
        }

        function openTableModal(tableId, silent) {
            currentTableId = tableId;
            const content = document.getElementById("modalContent");

            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === tableId);

                    if (!table || !table.active_session_id) {
                        content.innerHTML = `
                            <h2>${tableId}</h2>
                            <p style="color:#1d7d72; font-weight:600; margin:12px 0;">🟢 This table is currently empty.</p>
                            <input type="number" id="quickPartySize" placeholder="party size" value="2" style="padding:12px; border:1.5px solid #eee; border-radius:12px; margin-right:8px;">
                            <button class="success" onclick="openSessionForCurrentTable()">Open Session</button>
                            <p id="modalResult"></p>
                        `;
                        if (!silent) document.getElementById("overlay").style.display = "flex";
                        return;
                    }

                    fetch(`${BASE}/sessions/${table.active_session_id}`)
                        .then(r => r.json())
                        .then(session => {
                            if (session.error || session.status !== "OPEN") {
                                content.innerHTML = `
                                    <h2>${tableId}</h2>
                                    <p style="color:#777; font-weight:600; margin:12px 0;">⏹️ This session has ended (${session.status || "unknown"}), but the table hasn't been released yet.</p>
                                    <button class="secondary" onclick="releaseTable('${tableId}')">Release Table</button>
                                    <p id="modalResult"></p>
                                `;
                                if (!silent) document.getElementById("overlay").style.display = "flex";
                                return;
                            }

                            fetch(`${BASE}/sessions/${session.session_id}/orders`)
                                .then(r => r.json())
                                .then(orders => {
                                    const statusEmoji = { PENDING_REVIEW: "⏳", APPROVED: "✅", REJECTED: "🚫", CANCELLED: "❌" };

                                    let ordersHtml = orders.length
                                        ? orders.map(o => `
                                            <div class="order-line">
                                                <div class="info">${statusEmoji[o.status] || ""} ${o.qty}x ${o.item} — €${(o.price * o.qty).toFixed(2)}</div>
                                                <div class="actions">
                                                    ${o.status === "PENDING_REVIEW" ? `
                                                        <button class="success" onclick="approveOrder('${o.order_id}')">Accept</button>
                                                        <button class="danger" onclick="rejectOrder('${o.order_id}')">Reject</button>
                                                    ` : `<span style="font-size:12px;color:#999;">${o.status}</span>`}
                                                </div>
                                            </div>
                                        `).join("")
                                        : "<p style='color:#999; padding:10px 0;'>No orders yet.</p>";

                                    let alerts = "";
                                    if (session.waiter_called) {
                                        alerts += `<p style="color:#f39c12; font-weight:600; margin:10px 0;">🔔 This table called for a waiter.
                                            <button class="secondary" onclick="acknowledgeCall()" style="margin-left:8px;">Acknowledge</button></p>`;
                                    }
                                    if (session.payment_requested) {
                                        alerts += `<p style="color:#7c3aed; font-weight:600; margin:10px 0;">💳 This table requested the bill.</p>`;
                                    }

                                    content.innerHTML = `
                                        <h2>${tableId}</h2>
                                        <p style="color:#777; margin:6px 0 12px;">👥 ${session.party_size} people &nbsp;|&nbsp; ${session.is_paid ? "💰 Paid" : "❌ Unpaid"}</p>
                                        <p style="font-size:13px;"><a href="customer.html?table=${tableId}" target="_blank" style="color:#ff6b35; font-weight:600;">Customer link ↗</a></p>
                                        ${alerts}
                                        <div class="section-title" style="font-size:16px; margin:20px 0 10px;"><span class="bar" style="height:16px;"></span>Orders</div>
                                        ${ordersHtml}
                                        <div class="action-row">
                                            <button class="secondary" onclick="calculateSplit('${session.session_id}')">Calculate Split</button>
                                            <button class="success" onclick="markPaid('${session.session_id}')">Mark Paid</button>
                                            <button onclick="closeSession('${session.session_id}')">Close Session</button>
                                            <button class="danger" onclick="deleteSession('${session.session_id}')">Delete Session</button>
                                        </div>
                                        <p id="modalResult"></p>
                                    `;

                                    if (!silent) document.getElementById("overlay").style.display = "flex";
                                });
                        });
                });
        }

        function openSessionForCurrentTable() {
            const partySize = document.getElementById("quickPartySize").value;

            fetch(`${BASE}/sessions/open?table_id=${currentTableId}&party_size=${partySize}`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            currentTableId = null;
        }

        function acknowledgeCall() {
            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === currentTableId);
                    if (!table || !table.active_session_id) return;
                    fetch(`${BASE}/sessions/${table.active_session_id}/acknowledge-call`, { method: "POST" })
                        .then(() => { openTableModal(currentTableId); loadTables(); });
                });
        }

        function approveOrder(orderId) {
            fetch(`${BASE}/orders/${orderId}/approve`, { method: "POST" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function rejectOrder(orderId) {
            fetch(`${BASE}/orders/${orderId}/reject`, { method: "POST" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function calculateSplit(sessionId) {
            fetch(`${BASE}/sessions/${sessionId}/split`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    document.getElementById("modalResult").innerText =
                        `Total: €${data.total} — €${data.per_person} per person (${data.party_size} people)`;
                });
        }

        function markPaid(sessionId) {
            fetch(`${BASE}/sessions/${sessionId}/mark-paid`, { method: "POST" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function closeSession(sessionId) {
            fetch(`${BASE}/sessions/${sessionId}/close`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    document.getElementById("modalResult").innerText = data.error || "Session closed. You can release the table now.";
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function deleteSession(sessionId) {
            if (!confirm("Delete this session? This cancels all its orders.")) return;
            fetch(`${BASE}/sessions/${sessionId}`, { method: "DELETE" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function releaseTable(tableId) {
            fetch(`${BASE}/tables/${tableId}/release`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    closeModal();
                    loadTables();
                });
        }

        loadTables();
        setInterval(loadTables, 5000);
    </script>
</body>
</html>
