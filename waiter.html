<!DOCTYPE html>
<html>
<head>
    <title>Katina — Waiter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Commissioner:wght@300..700&family=GFS+Didot&display=swap');

        :root {
            /* light surfaces — the main page */
            --screen: #f7f6f2;
            --surface: #fdfcfa;
            --surface-2: #f1efe9;
            --text: #1a1714;
            --text-2: #453d33;
            --text-3: #6e6558;
            --text-4: #8a8071;
            --accent: #8f6210;
            --accent-hover: #7a5309;
            --on-accent: #ffffff;
            --accent-soft: rgba(143, 98, 16, 0.10);
            --accent-line: rgba(143, 98, 16, 0.34);
            --live: #1f6f63;
            --live-soft: rgba(31, 111, 99, 0.11);
            --warn: #9e3f1f;
            --warn-soft: rgba(158, 63, 31, 0.10);
            --warn-line: rgba(158, 63, 31, 0.32);
            --called: #b9770e;
            --pay: #445566;
            --ready: #1b4d3e;
            --line: rgba(26, 23, 20, 0.13);
            --line-mid: rgba(26, 23, 20, 0.16);
            --hover: rgba(26, 23, 20, 0.04);
            --card-shadow: 0 1px 2px rgba(26, 23, 20, 0.04), 0 8px 22px rgba(26, 23, 20, 0.06);

            /* dark surfaces — header, login screen, drawers, toasts */
            --d-bg: #221e19;
            --d-bg-2: #2d2620;
            --d-surface: #1e1915;
            --d-text: #f6f3ed;
            --d-text-3: #9c9082;
            --d-text-4: rgba(246, 243, 237, 0.55);
            --d-accent: #d9a75b;
            --d-line: rgba(239, 233, 224, 0.09);
            --d-hover: rgba(239, 233, 224, 0.07);
            --d-hover-2: rgba(239, 233, 224, 0.13);

            --display: 'GFS Didot', 'Didot', 'Iowan Old Style', Georgia, serif;
            --ui: 'Commissioner', 'Helvetica Neue', Arial, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 14px;
            --r-sheet: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--ui);
            background: var(--screen);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .spinner {
            width: 22px; height: 22px;
            border: 3px solid rgba(26,23,20,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        .spinner.light { border-color: rgba(246,243,237,0.25); border-top-color: var(--d-text); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-block {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 60px 20px; color: var(--text-4); font-size: 14px;
            grid-column: 1 / -1;
        }

        .toast-container {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: var(--d-bg);
            color: var(--d-text);
            padding: 16px 20px;
            border-radius: var(--r-lg);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            animation: slideDown 0.3s ease, fadeOut 0.3s ease 4.5s forwards;
            border-left: 4px solid var(--d-accent);
        }
        .toast.called { border-left-color: var(--called); }
        .toast.pay { border-left-color: var(--pay); }
        .toast.ready { border-left-color: var(--ready); }
        .toast.stock { border-left-color: var(--warn); }
        .toast.stock_shortage { border-left-color: var(--warn); }
        .toast .toast-icon { font-size: 22px; }
        .toast .toast-text { flex: 1; }
        .toast .toast-title { font-weight: 700; font-size: 14px; }
        .toast .toast-sub { font-size: 12px; color: var(--d-text-4); margin-top: 2px; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        .login-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--d-bg), var(--d-bg-2));
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .login-box {
            background: var(--surface);
            border-radius: var(--r-sheet);
            padding: 36px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        .login-box .logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: var(--r-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        .login-box h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin-bottom: 8px; }
        .login-box p { color: var(--text-3); font-size: 14px; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--line);
            border-radius: var(--r-md);
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px;
            font-family: var(--ui);
        }
        .login-box button {
            width: 100%;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            padding: 14px;
            border-radius: var(--r-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: var(--ui);
        }
        .login-error { color: var(--warn); font-size: 13px; margin-top: 10px; min-height: 18px; }
        .login-lang-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--d-hover); color: var(--d-text); border: none;
            padding: 8px 14px; border-radius: var(--r-md); font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: var(--ui);
        }

        header {
            background: linear-gradient(135deg, var(--d-bg), var(--d-bg-2));
            padding: 20px 24px;
            color: var(--d-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--d-accent), #e5b568);
            border-radius: var(--r-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(217,167,91,0.3);
        }
        header h1 { font-family: var(--display); font-weight: 400; font-size: 21px; }
        header .whoami { font-size: 12px; color: var(--d-accent); margin-top: 2px; font-family: var(--mono); }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .bell-btn, .log-btn, .lang-btn, .logout-btn {
            background: var(--d-hover);
            border: none;
            color: var(--d-text);
            padding: 10px 16px;
            border-radius: var(--r-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            font-family: var(--ui);
        }
        .bell-btn.active { background: var(--d-accent); color: var(--d-bg); }
        .bell-count {
            background: var(--d-accent);
            color: var(--d-bg);
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800;
        }
        .bell-btn.active .bell-count { background: rgba(0,0,0,0.2); color: var(--d-bg); }

        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20,17,14,0.45);
            z-index: 40;
        }
        .drawer-overlay.open { display: block; }

        .notif-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 340px;
            max-width: 88vw;
            background: linear-gradient(180deg, var(--d-bg), var(--d-bg-2));
            box-shadow: -12px 0 32px rgba(0,0,0,0.3);
            z-index: 41;
            transform: translateX(100%);
            transition: transform 0.25s ease;
            padding: 24px;
            overflow-y: auto;
        }
        .notif-drawer.open { transform: translateX(0); }

        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .drawer-header h2 { color: var(--d-text); font-family: var(--display); font-weight: 400; font-size: 20px; }
        .drawer-close {
            color: var(--d-text-3); font-size: 22px; cursor: pointer;
            background: var(--d-hover);
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .notif-empty {
            padding: 40px 10px; text-align: center; color: var(--d-text-3); font-size: 14px;
        }
        .notif-row {
            background: var(--d-hover);
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; border-radius: var(--r-lg); cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.15s;
        }
        .notif-row:hover { background: var(--d-hover-2); }
        .notif-row .info { color: var(--d-text); }
        .notif-row .table-name { font-weight: 700; font-size: 15px; }
        .notif-row .type { font-size: 12.5px; color: var(--d-accent); margin-top: 3px; }
        .notif-row .go { font-size: 18px; color: var(--d-accent); }

        .log-row {
            background: var(--d-hover);
            padding: 14px 16px; border-radius: var(--r-lg);
            margin-bottom: 10px;
        }
        .log-row .waiter { color: var(--d-accent); font-weight: 700; font-size: 13.5px; }
        .log-row .action { color: var(--d-text); font-size: 14px; margin-top: 3px; }
        .log-row .time { color: var(--d-text-3); font-size: 11.5px; margin-top: 4px; }

        .container { padding: 24px; max-width: 1000px; margin: 0 auto; }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--display);
            font-weight: 400;
            font-size: 24px;
            margin: 8px 0 18px;
        }
        .section-title .bar {
            width: 4px; height: 20px; border-radius: 3px;
            background: var(--accent);
        }
        .section-title .count-badge {
            background: var(--surface-2); color: var(--text-3);
            font-family: var(--ui);
            font-size: 13px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }

        .table-list { display: flex; flex-direction: column; gap: 8px; }

        .table-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--line-mid);
            border-radius: var(--r-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: transform 0.1s;
        }
        .table-item:active { transform: scale(0.99); }
        .table-item.called { border-left-color: var(--called); }
        .table-item.pay { border-left-color: var(--pay); }
        .table-item.ready { border-left-color: var(--ready); }
        .table-item.pending { border-left-color: var(--accent); }
        .table-item.release { border-left-color: var(--text-4); }
        .table-item.empty { border-left-color: var(--live); }

        .table-item .ti-main { flex: 1; min-width: 0; }
        .table-item .ti-name { font-weight: 700; font-size: 16px; color: var(--text); }
        .table-item .ti-sub {
            font-size: 12.5px; color: var(--text-3); margin-top: 3px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .table-item .ti-alert-text { font-weight: 700; }
        .table-item .ti-alert-text.called { color: var(--called); }
        .table-item .ti-alert-text.pay { color: var(--pay); }
        .table-item .ti-alert-text.ready { color: var(--ready); }
        .table-item .ti-alert-text.pending { color: var(--accent); }
        .table-item .ti-alert-text.release { color: var(--text-4); }
        .table-item .ti-badge {
            background: var(--surface-2);
            color: var(--text-3);
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 100px;
        }
        .table-item .ti-chevron { color: var(--text-4); font-size: 18px; flex-shrink: 0; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20,17,14,0.5);
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--r-sheet);
            padding: 28px;
            width: 92%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--card-shadow);
        }
        .modal h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin-bottom: 6px; color: var(--text); }
        .modal input {
            padding: 12px 14px;
            border: 1.5px solid var(--line);
            border-radius: var(--r-md);
            margin-top: 10px;
            margin-right: 8px;
            font-size: 14px;
            width: 100%;
            max-width: 220px;
            font-family: var(--ui);
        }
        button {
            background: var(--text);
            color: var(--on-accent);
            border: none;
            padding: 12px 18px;
            border-radius: var(--r-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.1s;
            font-family: var(--ui);
        }
        button:active { transform: scale(0.96); }
        button.danger { background: var(--warn); }
        button.success { background: var(--live); }
        button.secondary { background: var(--surface-2); color: var(--text-2); }
        button.primary { background: var(--accent); }

        .order-line {
            border-bottom: 1px solid var(--line);
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .order-line .info {
            font-size: 14px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }
        .order-line .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .order-line .actions button {
            margin-left: 0;
            font-size: 12px;
            padding: 8px 12px;
        }
        .bulk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .bulk-actions button { font-size: 12px; padding: 8px 12px; }
        .action-row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .close-modal {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 24px; color: var(--text-4);
        }
        #modalResult { margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--text-3); }

        .move-target-btn {
            width: 100%;
            text-align: left;
            background: var(--surface-2);
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .move-target-btn:hover { background: var(--accent-soft); }
        .move-empty-msg { color: var(--text-4); font-size: 14px; padding: 10px 0; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="login-screen" id="loginScreen">
        <button class="login-lang-toggle" onclick="toggleLang()" id="loginLangBtn">EN</button>
        <div class="login-box">
            <div class="logo">🍽️</div>
            <h2 id="loginTitle">Staff Login</h2>
            <p id="loginSub">Enter the staff code and your name once — this device will remember them.</p>
            <input type="text" id="nameInput" placeholder="Your name">
            <input type="password" id="loginInput" placeholder="Staff code" onkeydown="if(event.key==='Enter') doLogin()">
            <button onclick="doLogin()" id="unlockBtn">Unlock</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <header>
        <div class="brand">
            <div class="logo">🍽️</div>
            <div>
                <h1 id="headerTitle">Katina — Waiter</h1>
                <div class="whoami" id="whoamiLabel"></div>
            </div>
        </div>
        <div class="header-actions">
            <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="log-btn" onclick="openActivityLog()">📋</button>
            <button class="bell-btn" id="bellBtn" onclick="toggleNotifPanel()">
                🔔 <span class="bell-count" id="bellCount">0</span>
            </button>
            <button class="logout-btn" onclick="doLogout()">🚪 <span id="logoutLabel">Logout</span></button>
        </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay" onclick="closeAllDrawers()"></div>

    <div class="notif-drawer" id="notifDrawer">
        <div class="drawer-header">
            <h2 id="notifDrawerTitle">🔔 Notifications</h2>
            <span class="drawer-close" onclick="closeAllDrawers()">✕</span>
        </div>
        <div id="notifList"></div>
    </div>

    <div class="notif-drawer" id="logDrawer">
        <div class="drawer-header">
            <h2 id="logDrawerTitle">📋 Activity Log</h2>
            <span class="drawer-close" onclick="closeAllDrawers()">✕</span>
        </div>
        <div id="logList"></div>
    </div>

    <div class="container">
        <div class="section-title">
            <span class="bar"></span><span id="tablesTitle">Tables</span>
            <span class="count-badge" id="tableCount">0</span>
        </div>
        <div class="table-list" id="tableGrid">
            <div class="loading-block"><div class="spinner"></div></div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="overlay" id="moveOverlay">
        <div class="modal">
            <span class="close-modal" onclick="closeMoveModal()">✕</span>
            <div id="moveModalContent"></div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        let currentTableId = null;
        let moveFromTableId = null;
        let currentAlerts = [];
        let previousAlertKeys = new Set();
        let previousPendingCounts = {};
        let previousReadyCounts = {};
        let hasLoadedTablesOnce = false;
        let tableStatusMode = "simple";

        let audioCtx = null;

        function unlockAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }
        document.addEventListener("click", unlockAudio, { once: true });
        document.addEventListener("touchstart", unlockAudio, { once: true });

        let currentLang = localStorage.getItem("katinaLang") || "gr";

        const T = {
            gr: {
                login_title: "Σύνδεση Προσωπικού",
                login_sub: "Εισάγετε τον κωδικό προσωπικού και το όνομά σας μία φορά — αυτή η συσκευή θα τα θυμάται.",
                name_placeholder: "Το όνομά σας",
                code_placeholder: "Κωδικός προσωπικού",
                unlock: "Ξεκλείδωμα",
                enter_name: "Παρακαλώ εισάγετε το όνομά σας.",
                wrong_code: "Λάθος κωδικός, δοκιμάστε ξανά.",
                session_expired: "Η σύνδεσή σας έληξε. Παρακαλώ συνδεθείτε ξανά.",
                waiter_title: "Katina — Σερβιτόρος",
                logged_in_as: (n) => `Συνδεδεμένος ως ${n}`,
                notifications: "🔔 Ειδοποιήσεις",
                activity_log: "📋 Ιστορικό Δραστηριότητας",
                history_for: (l) => `🕘 ${l} — Ιστορικό`,
                no_history: "Δεν υπάρχει ιστορικό για αυτό το τραπέζι ακόμα.",
                no_activity: "Δεν υπάρχει δραστηριότητα ακόμα.",
                no_alerts: "Καμία ενεργή ειδοποίηση 🎉",
                tables: "Τραπέζια",
                empty: "🟢 Άδειο",
                paid: "💰 Πληρωμένο",
                unpaid: "❌ Απλήρωτο",
                occupied: "🔵 Κατειλημμένο",
                people: (n) => `👥 ${n}`,
                pending_short: (n) => `🧾 ${n} εκκρ.`,
                calling_waiter: "🔔 ΚΑΛΕΙ ΣΕΡΒΙΤΟΡΟ",
                wants_to_pay: (m) => `💳 ΘΕΛΕΙ ΝΑ ΠΛΗΡΩΣΕΙ${m ? " — " + m : ""}`,
                new_orders: (n) => `🧾 ${n} ${n > 1 ? "ΝΕΕΣ ΠΑΡΑΓΓΕΛΕΙΕΣ" : "ΝΕΑ ΠΑΡΑΓΓΕΛΙΑ"}`,
                order_ready_banner: "✅ ΕΤΟΙΜΟ ΠΡΟΣ ΠΑΡΑΛΑΒΗ",
                order_ready_alert: (n) => `${n} παραγγελία(ες) έτοιμες προς παραλαβή`,
                out_of_stock_alert: (n) => `📦 Τελείωσε το απόθεμα (${n})`,
                stock_shortage_alert: (item, req, avail) => `📦 ${item}: χρειάζεται ${req}, απομένουν ${avail}`,
                ready_tag: "✅ Έτοιμο",

        function t(key, ...args) {
            const val = T[currentLang][key];
            return typeof val === "function" ? val(...args) : val;
        }

        function toggleLang() {
            currentLang = currentLang === "gr" ? "en" : "gr";
            localStorage.setItem("katinaLang", currentLang);
            applyStaticText();
            if (getToken()) {
                loadTables();
                if (currentTableId) openTableModal(currentTableId, true);
            }
        }

        function applyStaticText() {
            const langLabel = currentLang === "gr" ? "EN" : "GR";
            document.getElementById("loginLangBtn").innerText = langLabel;
            document.getElementById("langBtn").innerText = langLabel;
            document.getElementById("loginTitle").innerText = t("login_title");
            document.getElementById("loginSub").innerText = t("login_sub");
            document.getElementById("nameInput").placeholder = t("name_placeholder");
            document.getElementById("loginInput").placeholder = t("code_placeholder");
            document.getElementById("unlockBtn").innerText = t("unlock");
            document.getElementById("headerTitle").innerText = t("waiter_title");
            document.getElementById("tablesTitle").innerText = t("tables");
            document.getElementById("logoutLabel").innerText = t("logout");
            if (getWaiterName() !== "Unknown" || getToken()) {
                document.getElementById("whoamiLabel").innerText = t("logged_in_as", getWaiterName());
            }
        }

        function playNotificationSound() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === "suspended") audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Could not play notification sound", e);
            }
        }

        function showToast(alert) {
            const container = document.getElementById("toastContainer");
            const toastClass = alert.type === "called" ? "called" : alert.type === "pay" ? "pay" : alert.type === "ready" ? "ready" : (alert.type === "stock" || alert.type === "stock_shortage") ? "stock" : "";
            const icon = toastClass === "called" ? "🔔" : toastClass === "pay" ? "💳" : toastClass === "ready" ? "✅" : toastClass === "stock" ? "📦" : "🧾";

            const toast = document.createElement("div");
            toast.className = `toast ${toastClass}`;
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <div class="toast-text">
                    <div class="toast-title">${escapeHtml(alert.label)}</div>
                    <div class="toast-sub">${escapeHtml(alert.text)}</div>
                </div>
            `;
            toast.onclick = () => {
                toast.remove();
                jumpToTable(alert.tableId);
            };
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 5000);
        }

        function getToken() {
            return localStorage.getItem("waiterToken");
        }
        function getWaiterName() {
            return localStorage.getItem("waiterName") || "Unknown";
        }

        function doLogin() {
            const name = document.getElementById("nameInput").value.trim();
            const code = document.getElementById("loginInput").value;
            if (!name) {
                document.getElementById("loginError").innerText = t("enter_name");
                return;
            }
            if (!code) return;

            fetch(`${BASE}/verify-token`, {
                headers: { "X-Waiter-Token": code }
            }).then(r => {
                if (r.status === 401) {
                    document.getElementById("loginError").innerText = t("wrong_code");
                    return null;
                }
                return r.json();
            }).then(data => {
                if (!data) return;
                localStorage.setItem("waiterToken", code);
                localStorage.setItem("waiterName", name);
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("loginError").innerText = "";
                document.getElementById("whoamiLabel").innerText = t("logged_in_as", name);
                loadTables();
            }).catch(() => {
                document.getElementById("loginError").innerText = t("wrong_code");
            });
        }

        function doLogout() {
            if (!confirm(t("logout_confirm"))) return;
            localStorage.removeItem("waiterToken");
            localStorage.removeItem("waiterName");
            currentTableId = null;
            moveFromTableId = null;
            document.getElementById("overlay").style.display = "none";
            document.getElementById("moveOverlay").style.display = "none";
            closeAllDrawers();
            document.getElementById("nameInput").value = "";
            document.getElementById("loginInput").value = "";
            document.getElementById("loginError").innerText = "";
            document.getElementById("loginScreen").style.display = "flex";
        }

        function authHeaders() {
            return {
                "X-Waiter-Token": getToken(),
                "X-Waiter-Name": encodeURIComponent(getWaiterName())
            };
        }

        function handleAuthFailure() {
            localStorage.removeItem("waiterToken");
            localStorage.removeItem("waiterName");
            document.getElementById("overlay").style.display = "none";
            document.getElementById("moveOverlay").style.display = "none";
            closeAllDrawers();
            currentTableId = null;
            moveFromTableId = null;
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("loginError").innerText = t("session_expired");
        }

        function authFetch(url, options) {
            const opts = options || {};
            opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
            return fetch(url, opts).then(r => {
                if (r.status === 401) {
                    handleAuthFailure();
                    return null;
                }
                return r;
            });
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function paymentMethodLabel(method) {
            if (method === "cash") return t("cash");
            if (method === "card") return t("card");
            return "";
        }

        function translateAction(action) {
            return T[currentLang].action_labels[action] || action;
        }

        function getStatusStat(session) {
            if (tableStatusMode === "detailed") {
                const balance = session.unpaid_balance || 0;
                if (balance > 0) return { cls: "unpaid", label: t("unpaid") };
                return { cls: "occupied-stat", label: t("occupied") };
            }
            return session.is_paid ? { cls: "paid", label: t("paid") } : { cls: "unpaid", label: t("unpaid") };
        }

        function openActivityLog() {
            document.getElementById("logDrawerTitle").innerText = t("activity_log");
            document.getElementById("drawerOverlay").classList.add("open");
            document.getElementById("logDrawer").classList.add("open");
            document.getElementById("logList").innerHTML = `<div class="loading-block"><div class="spinner light"></div></div>`;

            authFetch(`${BASE}/activity-log`)
                .then(r => r ? r.json() : null)
                .then(logs => { if (logs) renderLogList(logs); });
        }

        function openTableHistory(tableId, label) {
            document.getElementById("logDrawerTitle").innerText = t("history_for", label);
            document.getElementById("drawerOverlay").classList.add("open");
            document.getElementById("logDrawer").classList.add("open");
            document.getElementById("logList").innerHTML = `<div class="loading-block"><div class="spinner light"></div></div>`;

            authFetch(`${BASE}/tables/${tableId}/history`)
                .then(r => r ? r.json() : null)
                .then(logs => { if (logs) renderLogList(logs, t("no_history")); });
        }

        function renderLogList(logs, emptyMessage) {
            const list = document.getElementById("logList");
            if (!Array.isArray(logs) || logs.length === 0) {
                list.innerHTML = `<div class="notif-empty">${emptyMessage || t("no_activity")}</div>`;
                return;
            }
            list.innerHTML = logs.map(l => {
                const time = new Date(l.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                return `
                    <div class="log-row">
                        <div class="waiter">${escapeHtml(l.waiter_name)}</div>
                        <div class="action">${escapeHtml(translateAction(l.action))} — ${escapeHtml(l.target_id)}</div>
                        <div class="time">${time}</div>
                    </div>
                `;
            }).join("");
        }

        function closeAllDrawers() {
            document.getElementById("notifDrawer").classList.remove("open");
            document.getElementById("logDrawer").classList.remove("open");
            document.getElementById("drawerOverlay").classList.remove("open");
            document.getElementById("bellBtn").classList.remove("active");
        }

        function toggleNotifPanel() {
            const drawer = document.getElementById("notifDrawer");
            const overlay = document.getElementById("drawerOverlay");
            const btn = document.getElementById("bellBtn");
            const isOpen = drawer.classList.contains("open");

            document.getElementById("notifDrawerTitle").innerText = t("notifications");
            document.getElementById("logDrawer").classList.remove("open");
            drawer.classList.toggle("open", !isOpen);
            overlay.classList.toggle("open", !isOpen);
            btn.classList.toggle("active", !isOpen);
            if (!isOpen) renderNotifPanel();
        }

        function renderNotifPanel() {
            const list = document.getElementById("notifList");
            if (currentAlerts.length === 0) {
                list.innerHTML = `<div class="notif-empty">${t("no_alerts")}</div>`;
                return;
            }
            list.innerHTML = currentAlerts.map(a => {
                const clickAttr = a.tableId ? `onclick="jumpToTable('${a.tableId}')"` : `onclick="closeAllDrawers()"`;
                return `
                <div class="notif-row" ${clickAttr}>
                    <div class="info">
                        <div class="table-name">${escapeHtml(a.label)}</div>
                        <div class="type">${escapeHtml(a.text)}</div>
                    </div>
                    <div class="go">→</div>
                </div>
            `;
            }).join("");
        }

        function jumpToTable(tableId) {
            closeAllDrawers();
            if (!tableId) return;
            openTableModal(tableId);
        }

        function loadTables() {
            Promise.all([
                fetch(`${BASE}/tables`).then(r => r.json()),
                fetch(`${BASE}/orders/pending`).then(r => r.json()),
                fetch(`${BASE}/orders/ready`).then(r => r.json()),
                fetch(`${BASE}/settings`).then(r => r.json()).catch(() => ({})),
                fetch(`${BASE}/menu-items`).then(r => r.json()).catch(() => []),
            ]).then(([tables, pendingOrders, readyOrders, settings, menuItems]) => {

                tableStatusMode = (settings && settings.table_status_mode) || "simple";

                window._tablesCache = tables;
                document.getElementById("tableCount").innerText = tables.length;

                const pendingCountBySession = {};
                pendingOrders.forEach(o => {
                    pendingCountBySession[o.session_id] = (pendingCountBySession[o.session_id] || 0) + 1;
                });

                const readyCountBySession = {};
                readyOrders.forEach(o => {
                    readyCountBySession[o.session_id] = (readyCountBySession[o.session_id] || 0) + 1;
                });

                const menuItemsById = {};
                (menuItems || []).forEach(m => { menuItemsById[m.item_id] = m; });

                const sessionFetches = tables
                    .filter(t => t.active_session_id)
                    .map(t =>
                        fetch(`${BASE}/sessions/${t.active_session_id}`)
                            .then(r => r.json())
                            .then(session => ({ table_id: t.table_id, session }))
                    );

                Promise.all(sessionFetches).then(results => {
                    const sessionByTableId = {};
                    results.forEach(r => {
                        if (!r.session.error) sessionByTableId[r.table_id] = r.session;
                    });

                    const sessionIdToTableId = {};
                    Object.keys(sessionByTableId).forEach(tid => {
                        sessionIdToTableId[sessionByTableId[tid].session_id] = tid;
                    });

                    currentAlerts = [];
                    const newOrderEvents = [];
                    const newPendingCounts = {};
                    const newReadyCounts = {};
                    const grid = document.getElementById("tableGrid");
                    grid.innerHTML = "";

                    if (tables.length === 0) {
                        grid.innerHTML = `<div class="loading-block">—</div>`;
                    }

                    const rowEntries = [];

                    tables.forEach(tbl => {
                        const label = tbl.display_label || tbl.table_id;
                        const safeLabel = escapeHtml(label);
                        const session = sessionByTableId[tbl.table_id];

                        if (!session) {
                            rowEntries.push({
                                priority: 6,
                                html: `
                                    <div class="table-item empty" onclick="openTableModal('${tbl.table_id}')">
                                        <div class="ti-main">
                                            <div class="ti-name">${safeLabel}</div>
                                            <div class="ti-sub">${t("empty")}</div>
                                        </div>
                                        <span class="ti-chevron">›</span>
                                    </div>
                                `,
                            });
                            return;
                        }

                        if (session.status !== "OPEN") {
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("needs_release_short"), type: "release" });
                            rowEntries.push({
                                priority: 3,
                                html: `
                                    <div class="table-item release" onclick="openTableModal('${tbl.table_id}')">
                                        <div class="ti-main">
                                            <div class="ti-name">${safeLabel}</div>
                                            <div class="ti-sub"><span class="ti-alert-text release">${t("needs_release")}</span></div>
                                        </div>
                                        <span class="ti-chevron">›</span>
                                    </div>
                                `,
                            });
                            return;
                        }

                        const pending = pendingCountBySession[session.session_id] || 0;
                        const ready = readyCountBySession[session.session_id] || 0;

                        const prevPending = previousPendingCounts[session.session_id] || 0;
                        newPendingCounts[session.session_id] = pending;
                        if (pending > prevPending && hasLoadedTablesOnce) {
                            newOrderEvents.push({ tableId: tbl.table_id, label, text: t("orders_awaiting", pending), type: "orders" });
                        }

                        const prevReady = previousReadyCounts[session.session_id] || 0;
                        newReadyCounts[session.session_id] = ready;
                        if (ready > prevReady && hasLoadedTablesOnce) {
                            newOrderEvents.push({ tableId: tbl.table_id, label, text: t("order_ready_alert", ready), type: "ready" });
                        }

                        let bannerClass = "";
                        let bannerText = "";
                        let priority = 5;
                        if (session.waiter_called) {
                            bannerClass = "called"; bannerText = t("calling_waiter"); priority = 0;
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("called_for_waiter"), type: "called" });
                        } else if (session.payment_requested) {
                            const methodLabel = paymentMethodLabel(session.payment_method);
                            bannerClass = "pay"; bannerText = t("wants_to_pay", methodLabel); priority = 1;
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("requested_bill", methodLabel), type: "pay" });
                        } else if (ready > 0) {
                            bannerClass = "ready"; bannerText = t("order_ready_banner"); priority = 2;
                        } else if (pending > 0) {
                            bannerClass = "pending"; bannerText = t("new_orders", pending); priority = 4;
                        }
                        if (ready > 0) {
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("order_ready_alert", ready), type: "ready" });
                        }
                        if (pending > 0) {
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("orders_awaiting", pending), type: "orders" });
                        }

                        const statusStat = getStatusStat(session);
                        const alertHtml = bannerClass
                            ? `<span class="ti-alert-text ${bannerClass}">${bannerText}</span>`
                            : `<span>${t("people", session.party_size)} · ${statusStat.label}</span>`;
                        const pendingBadge = pending > 0 ? `<span class="ti-badge">${t("pending_short", pending)}</span>` : "";

                        rowEntries.push({
                            priority,
                            html: `
                                <div class="table-item ${bannerClass}" onclick="openTableModal('${tbl.table_id}')">
                                    <div class="ti-main">
                                        <div class="ti-name">${safeLabel}</div>
                                        <div class="ti-sub">${alertHtml}${pendingBadge}</div>
                                    </div>
                                    <span class="ti-chevron">›</span>
                                </div>
                            `,
                        });
                    });

                    rowEntries.sort((a, b) => a.priority - b.priority);
                    grid.innerHTML += rowEntries.map(r => r.html).join("");

                    const outOfStockItems = (menuItems || []).filter(i => i.stock !== null && i.stock !== undefined && i.stock <= 0);
                    outOfStockItems.forEach(item => {
                        currentAlerts.push({ tableId: null, label: item.name, text: t("out_of_stock_alert", item.stock), key: item.item_id, type: "stock" });
                    });

                    pendingOrders.forEach(o => {
                        const tableId = sessionIdToTableId[o.session_id];
                        if (!tableId) return;
                        const menuItem = menuItemsById[o.item];
                        if (menuItem && menuItem.stock !== null && menuItem.stock !== undefined && o.qty > menuItem.stock) {
                            const tbl = tables.find(tb => tb.table_id === tableId);
                            const label = tbl ? (tbl.display_label || tbl.table_id) : tableId;
                            currentAlerts.push({
                                tableId,
                                label,
                                text: t("stock_shortage_alert", menuItem.name, o.qty, menuItem.stock),
                                key: o.order_id,
                                type: "stock_shortage"
                            });
                        }
                    });

                    previousPendingCounts = newPendingCounts;
                    previousReadyCounts = newReadyCounts;

                    const currentAlertKeys = new Set(currentAlerts.map(a => `${a.tableId}-${a.type}-${a.label}-${a.key || ''}`));
                    const newStatusAlerts = currentAlerts.filter(a => a.type !== "orders" && a.type !== "ready" && !previousAlertKeys.has(`${a.tableId}-${a.type}-${a.label}-${a.key || ''}`));
                    const allTriggerEvents = newStatusAlerts.concat(newOrderEvents);

                    if (allTriggerEvents.length > 0 && hasLoadedTablesOnce) {
                        playNotificationSound();
                        allTriggerEvents.forEach(a => showToast(a));
                    }
                    previousAlertKeys = currentAlertKeys;
                    hasLoadedTablesOnce = true;

                    document.getElementById("bellCount").innerText = currentAlerts.length;
                    if (document.getElementById("notifDrawer").classList.contains("open")) renderNotifPanel();

                    if (currentTableId) openTableModal(currentTableId, true);
                });
            });
        }

        function openMovePicker(fromTableId, fromLabel) {
            moveFromTableId = fromTableId;
            const content = document.getElementById("moveModalContent");
            content.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
            document.getElementById("moveOverlay").style.display = "flex";

            const tables = window._tablesCache || [];
            const emptyTables = tables.filter(t => !t.active_session_id && t.table_id !== fromTableId);

            const listHtml = emptyTables.length
                ? emptyTables.map(t => {
                    const label = escapeHtml(t.display_label || t.table_id);
                    return `<button class="move-target-btn" onclick="confirmMove('${t.table_id}')">${label} <span>→</span></button>`;
                }).join("")
                : `<p class="move-empty-msg">${t("move_no_empty")}</p>`;

            content.innerHTML = `
                <h2>${t("move_title", fromLabel)}</h2>
                <div style="margin-top:16px;">${listHtml}</div>
                <p id="moveModalResult" style="margin-top:10px; font-size:13px; font-weight:600; color:var(--warn);"></p>
            `;
        }

        function closeMoveModal() {
            document.getElementById("moveOverlay").style.display = "none";
            moveFromTableId = null;
        }

        function confirmMove(toTableId) {
            const tables = window._tablesCache || [];
            const fromTable = tables.find(t => t.table_id === moveFromTableId);
            if (!fromTable || !fromTable.active_session_id) return;

            authFetch(`${BASE}/sessions/${fromTable.active_session_id}/move?to_table_id=${encodeURIComponent(toTableId)}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("moveModalResult").innerText = data.error;
                        return;
                    }
                    closeMoveModal();
                    loadTables();
                });
        }

        function openTableModal(tableId, silent) {
            currentTableId = tableId;
            const content = document.getElementById("modalContent");

            if (!silent) {
                content.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
                document.getElementById("overlay").style.display = "flex";
            }

            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === tableId);
                    const label = table ? (table.display_label || table.table_id) : tableId;
                    const safeLabel = escapeHtml(label);
                    const renameIcon = `<span onclick="renameTable('${tableId}', '${safeLabel}')" style="cursor:pointer; font-size:16px; color:var(--accent); margin-left:8px;">✏️</span>
                        <span onclick="openTableHistory('${tableId}', '${safeLabel}')" style="cursor:pointer; font-size:16px; color:var(--text-4); margin-left:8px;">🕘</span>`;

                    if (!table || !table.active_session_id) {
                        content.innerHTML = `
                            <h2>${safeLabel}${renameIcon}</h2>
                            <p style="color:var(--live); font-weight:600; margin:12px 0;">${t("table_empty_msg")}</p>
                            <div style="margin-top:12px;">
                                <button class="success" onclick="openSessionForCurrentTable()">${t("open_session")}</button>
                            </div>
                            <p id="modalResult"></p>
                        `;
                        return;
                    }

                    fetch(`${BASE}/sessions/${table.active_session_id}`)
                        .then(r => r.json())
                        .then(session => {
                            if (session.error || session.status !== "OPEN") {
                                content.innerHTML = `
                                    <h2>${safeLabel}${renameIcon}</h2>
                                    <p style="color:var(--text-3); font-weight:600; margin:12px 0;">${t("session_ended_msg", session.status || "unknown")}</p>
                                    <button class="secondary" onclick="releaseTable('${tableId}')">${t("release_table")}</button>
                                    <p id="modalResult"></p>
                                `;
                                return;
                            }

                            fetch(`${BASE}/sessions/${session.session_id}/orders`)
                                .then(r => r.json())
                                .then(orders => {
                                    const statusEmoji = { PENDING_REVIEW: "⏳", APPROVED: "✅", REJECTED: "🚫", CANCELLED: "❌", VOIDED: "⛔" };

                                    const billTotal = orders
                                        .filter(o => o.status === "APPROVED")
                                        .reduce((sum, o) => sum + (o.price * o.qty), 0);

                                    const pendingCount = orders.filter(o => o.status === "PENDING_REVIEW").length;
                                    const readyCount = orders.filter(o => o.status === "APPROVED" && o.ready).length;

                                    let ordersHtml = orders.length
                                        ? orders.map(o => {
                                            const extrasList = (o.extras || []).map(e => escapeHtml(e.name)).join(", ");

                                            let actionsHtml;
                                            if (o.status === "PENDING_REVIEW") {
                                                actionsHtml = `
                                                    <button class="success" onclick="approveOrder('${o.order_id}')">${t("accept")}</button>
                                                    <button class="danger" onclick="rejectOrder('${o.order_id}')">${t("reject")}</button>
                                                `;
                                            } else if (o.status === "APPROVED" && o.ready) {
                                                actionsHtml = `<button class="success" onclick="pickedUp('${o.order_id}')">${t("picked_up")}</button>`;
                                            } else {
                                                actionsHtml = `<span style="font-size:12px;color:var(--text-4);">${t("status_labels")[o.status] || o.status}${o.handled_by ? ' ' + t("by", escapeHtml(o.handled_by)) : ''}</span>`;
                                            }

                                            const readyTag = (o.status === "APPROVED" && o.ready)
                                                ? `<div style="font-size:11.5px; color:var(--ready); font-weight:700; margin-top:2px;">${t("ready_tag")}</div>`
                                                : "";

                                            return `
                                            <div class="order-line">
                                                <div class="info">
                                                    ${statusEmoji[o.status] || ""} ${o.qty}x ${escapeHtml(o.item)} — €${(o.price * o.qty).toFixed(2)}
                                                    ${readyTag}
                                                    ${extrasList ? `<div style="font-size:11.5px; color:var(--accent); margin-top:2px; white-space:normal;">+ ${extrasList}</div>` : ""}
                                                    ${o.note ? `<div style="font-size:14px; color:var(--warn); font-weight:700; font-style:italic; margin-top:4px; white-space:normal;">💬 ${escapeHtml(o.note)}</div>` : ""}
                                                </div>
                                                <div class="actions">${actionsHtml}</div>
                                            </div>
                                        `;
                                        }).join("")
                                        : `<p style='color:var(--text-4); padding:10px 0;'>${t("no_orders")}</p>`;

                                    let alerts = "";
                                    if (session.waiter_called) {
                                        alerts += `<p style="color:var(--called); font-weight:700; margin:10px 0;">${t("table_called_msg")}
                                            <button class="secondary" onclick="acknowledgeCall()" style="margin-left:8px;">${t("acknowledge")}</button></p>`;
                                    }
                                    if (session.payment_requested) {
                                        const methodLabel = paymentMethodLabel(session.payment_method);
                                        alerts += `<p style="color:var(--pay); font-weight:700; margin:10px 0;">${t("table_requested_bill_msg", methodLabel)}</p>`;
                                    }

                                    const bulkButtons = `
                                        ${pendingCount > 0 ? `<button class="success" onclick="approveAll('${session.session_id}')">${t("accept_all")}</button>` : ""}
                                        ${readyCount > 0 ? `<button class="success" onclick="pickupAll('${session.session_id}')">${t("pickup_all")}</button>` : ""}
                                    `;

                                    const modalStatusStat = getStatusStat(session);
                                    const displayAmount = tableStatusMode === "detailed" ? (session.unpaid_balance || 0) : billTotal;
                                    const releaseButtonHtml = tableStatusMode === "detailed"
                                        ? `<button class="secondary" onclick="releaseTable('${tableId}')">${t("release_table")}</button>`
                                        : "";

                                    content.innerHTML = `
                                        <h2>${safeLabel}${renameIcon}</h2>
                                        <p style="color:var(--text-3); margin:6px 0 12px;">
                                            ${t("people", session.party_size)}
                                            <span onclick="editPartySize('${session.session_id}', ${session.party_size})" style="cursor:pointer; color:var(--accent); font-weight:700; margin-left:6px;">${t("edit_party_size")}</span>
                                            &nbsp;|&nbsp; ${modalStatusStat.label}
                                        </p>
                                        <p style="font-family: var(--display); font-size:22px; font-weight:400; color:var(--accent); margin:10px 0;">${t("bill_so_far", displayAmount.toFixed(2))}</p>
                                        <p style="font-size:13px;"><a href="customer.html?table=${tableId}" target="_blank" style="color:var(--accent); font-weight:700;">${t("customer_link")}</a></p>
                                        ${alerts}
                                        <h3 style="font-size:15px; margin:20px 0 10px; color:var(--text);">${t("orders_heading")}</h3>
                                        ${ordersHtml}
                                        <div class="bulk-actions" style="margin-top:12px;">${bulkButtons}</div>
                                        <div class="action-row">
                                            <button class="success" onclick="markPaid('${session.session_id}')">${t("mark_paid")}</button>
                                            ${releaseButtonHtml}
                                            <button class="secondary" onclick="openMovePicker('${tableId}', '${safeLabel}')">⇄ ${t("move_table")}</button>
                                            <button class="danger" onclick="deleteSession('${session.session_id}')">${t("delete_session")}</button>
                                        </div>
                                        <p id="modalResult"></p>
                                    `;
                                });
                        });
                });
        }

        function renameTable(tableId, currentLabel) {
            const newLabel = prompt(t("rename_prompt"), currentLabel);
            if (newLabel === null || !newLabel.trim()) return;

            authFetch(`${BASE}/tables/${tableId}/rename?display_label=${encodeURIComponent(newLabel)}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function editPartySize(sessionId, currentSize) {
            const newSize = prompt(t("party_size_prompt"), currentSize);
            if (newSize === null) return;

            authFetch(`${BASE}/sessions/${sessionId}/update-party-size?party_size=${newSize}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function openSessionForCurrentTable() {
            const partySize = 2;

            authFetch(`${BASE}/sessions/open?table_id=${currentTableId}&party_size=${partySize}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            currentTableId = null;
        }

        function acknowledgeCall() {
            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === currentTableId);
                    if (!table || !table.active_session_id) return;
                    authFetch(`${BASE}/sessions/${table.active_session_id}/acknowledge-call`, {
                        method: "POST"
                    })
                        .then(r => r ? r.json() : null)
                        .then(data => { if (data) { openTableModal(currentTableId); loadTables(); } });
                });
        }

        function approveOrder(orderId) {
            authFetch(`${BASE}/orders/${orderId}/approve`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        alert(data.error);
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function approveAll(sessionId) {
            authFetch(`${BASE}/sessions/${sessionId}/approve-all`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        alert(data.error);
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                    if (data.skipped && data.skipped.length > 0) {
                        alert(t("skipped_stock_msg", data.skipped.length));
                    }
                });
        }

        function rejectOrder(orderId) {
            authFetch(`${BASE}/orders/${orderId}/reject`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function pickedUp(orderId) {
            authFetch(`${BASE}/orders/${orderId}/picked-up`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function pickupAll(sessionId) {
            authFetch(`${BASE}/sessions/${sessionId}/pickup-all`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function markPaid(sessionId) {
            authFetch(`${BASE}/sessions/${sessionId}/mark-paid`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    if (tableStatusMode === "detailed") {
                        openTableModal(currentTableId);
                    } else {
                        closeModal();
                    }
                    loadTables();
                });
        }

        function deleteSession(sessionId) {
            if (!confirm(t("delete_session_confirm"))) return;
            authFetch(`${BASE}/sessions/${sessionId}`, {
                method: "DELETE"
            })
                .then(r => r ? r.json() : null)
                .then(data => { if (data) { openTableModal(currentTableId); loadTables(); } });
        }

        function releaseTable(tableId) {
            authFetch(`${BASE}/tables/${tableId}/release`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    closeModal();
                    loadTables();
                });
        }

        applyStaticText();

        if (getToken()) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("whoamiLabel").innerText = t("logged_in_as", getWaiterName());
            loadTables();
        }
        setInterval(loadTables, 5000);
    </script>
</body>
</html>
