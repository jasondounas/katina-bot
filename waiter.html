<!DOCTYPE html>
<html>
<head>
    <title>Katina — Waiter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #f7f5f2;
            color: #1a1a1a;
        }

        .spinner {
            width: 22px; height: 22px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        .spinner.light { border-color: rgba(255,255,255,0.25); border-top-color: white; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-block {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 60px 20px; color: #999; font-size: 14px;
            grid-column: 1 / -1;
        }

        .toast-container {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: #1a1a1a;
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            animation: slideDown 0.3s ease, fadeOut 0.3s ease 4.5s forwards;
            border-left: 5px solid #ff6b35;
        }
        .toast.called { border-left-color: #f39c12; }
        .toast.pay { border-left-color: #7c3aed; }
        .toast.ready { border-left-color: #1d7d72; }
        .toast .toast-icon { font-size: 22px; }
        .toast .toast-text { flex: 1; }
        .toast .toast-title { font-weight: 800; font-size: 14px; }
        .toast .toast-sub { font-size: 12px; color: #ccc; margin-top: 2px; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        .login-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .login-box {
            background: white;
            border-radius: 24px;
            padding: 36px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        .login-box .logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        .login-box h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .login-box p { color: #777; font-size: 14px; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .login-box button {
            width: 100%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .login-error { color: #e74c3c; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .login-lang-toggle {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.1); color: white; border: none;
            padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 20px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(255,107,53,0.35);
        }
        header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
        header .whoami { font-size: 12px; color: #ffb088; margin-top: 2px; }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .bell-btn, .log-btn, .lang-btn, .logout-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        .bell-btn.active { background: #ff6b35; }
        .bell-count {
            background: #ff6b35;
            color: white;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800;
        }
        .bell-btn.active .bell-count { background: rgba(255,255,255,0.3); }

        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 40;
        }
        .drawer-overlay.open { display: block; }

        .notif-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 340px;
            max-width: 88vw;
            background: linear-gradient(180deg, #1a1a1a, #2d2d2d);
            box-shadow: -12px 0 32px rgba(0,0,0,0.3);
            z-index: 41;
            transform: translateX(100%);
            transition: transform 0.25s ease;
            padding: 24px;
            overflow-y: auto;
        }
        .notif-drawer.open { transform: translateX(0); }

        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .drawer-header h2 { color: white; font-size: 20px; font-weight: 800; }
        .drawer-close {
            color: #999; font-size: 24px; cursor: pointer;
            background: rgba(255,255,255,0.08);
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .notif-empty {
            padding: 40px 10px; text-align: center; color: #666; font-size: 14px;
        }
        .notif-row {
            background: rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; border-radius: 14px; cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.15s;
        }
        .notif-row:hover { background: rgba(255,255,255,0.12); }
        .notif-row .info { color: white; }
        .notif-row .table-name { font-weight: 800; font-size: 15px; }
        .notif-row .type { font-size: 12.5px; color: #ff9d70; margin-top: 3px; }
        .notif-row .go { font-size: 18px; color: #ff6b35; }

        .log-row {
            background: rgba(255,255,255,0.06);
            padding: 14px 16px; border-radius: 14px;
            margin-bottom: 10px;
        }
        .log-row .waiter { color: #ff9d70; font-weight: 800; font-size: 13.5px; }
        .log-row .action { color: white; font-size: 14px; margin-top: 3px; }
        .log-row .time { color: #888; font-size: 11.5px; margin-top: 4px; }

        .container { padding: 24px; max-width: 1000px; margin: 0 auto; }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 22px; font-weight: 800;
            margin: 8px 0 18px;
        }
        .section-title .bar {
            width: 5px; height: 22px; border-radius: 3px;
            background: #ff6b35;
        }
        .section-title .count-badge {
            background: #eee; color: #666;
            font-size: 13px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.15s;
            position: relative;
        }
        .card:hover { transform: translateY(-3px); }
        .icon-row {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 2;
            display: flex;
            gap: 8px;
        }
        .card-icon-btn {
            font-size: 15px;
            opacity: 0.55;
            cursor: pointer;
        }
        .card-icon-btn:hover { opacity: 1; }

        .card-alert {
            padding: 10px 16px;
            font-size: 12.5px;
            font-weight: 800;
            color: white;
        }
        .card-alert.called { background: #f39c12; }
        .card-alert.pay { background: #7c3aed; }
        .card-alert.pending { background: #ff6b35; }
        .card-alert.ready { background: #1d7d72; }
        .card-alert.release { background: #999; }

        .card-body { padding: 18px; border-top: 5px solid #eee; }
        .card.empty .card-body { border-top-color: #1d7d72; }
        .card.has-alert .card-body { border-top: none; padding-top: 14px; }

        .card h3 { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
        .card-stats { display: flex; flex-wrap: wrap; gap: 8px; }
        .stat {
            font-size: 13px; font-weight: 700;
            background: #f7f5f2; color: #555;
            padding: 6px 12px; border-radius: 10px;
            display: flex; align-items: center; gap: 5px;
        }
        .stat.paid { background: #e6f5f3; color: #1d7d72; }
        .stat.unpaid { background: #fce8e6; color: #c0392b; }
        .stat.empty-stat { background: #e6f5f3; color: #1d7d72; }
        .stat.occupied-stat { background: #e6f0fc; color: #1d5fd7; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 28px;
            width: 92%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .modal h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .modal input {
            padding: 12px 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            margin-top: 10px;
            margin-right: 8px;
            font-size: 14px;
            width: 100%;
            max-width: 220px;
        }
        button {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }
        button.danger { background: #e74c3c; }
        button.success { background: #1d7d72; }
        button.secondary { background: #f0f0f0; color: #555; }
        button.primary { background: linear-gradient(135deg, #ff6b35, #f7931e); }

        .order-line {
            border-bottom: 1px solid #f2f2f2;
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .order-line .info {
            font-size: 14px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .order-line .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .order-line .actions button {
            margin-left: 0;
            font-size: 12px;
            padding: 8px 12px;
        }
        .bulk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .bulk-actions button { font-size: 12px; padding: 8px 12px; }
        .action-row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .close-modal {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 24px; color: #bbb;
        }
        #modalResult { margin-top: 14px; font-size: 13px; font-weight: 600; color: #555; }

        .move-target-btn {
            width: 100%;
            text-align: left;
            background: #f7f5f2;
            color: #1a1a1a;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .move-target-btn:hover { background: #ffe4cc; }
        .move-empty-msg { color: #999; font-size: 14px; padding: 10px 0; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="login-screen" id="loginScreen">
        <button class="login-lang-toggle" onclick="toggleLang()" id="loginLangBtn">EN</button>
        <div class="login-box">
            <div class="logo">🍽️</div>
            <h2 id="loginTitle">Staff Login</h2>
            <p id="loginSub">Enter the staff code and your name once — this device will remember them.</p>
            <input type="text" id="nameInput" placeholder="Your name">
            <input type="password" id="loginInput" placeholder="Staff code" onkeydown="if(event.key==='Enter') doLogin()">
            <button onclick="doLogin()" id="unlockBtn">Unlock</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <header>
        <div class="brand">
            <div class="logo">🍽️</div>
            <div>
                <h1 id="headerTitle">Katina — Waiter</h1>
                <div class="whoami" id="whoamiLabel"></div>
            </div>
        </div>
        <div class="header-actions">
            <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="log-btn" onclick="openActivityLog()">📋</button>
            <button class="bell-btn" id="bellBtn" onclick="toggleNotifPanel()">
                🔔 <span class="bell-count" id="bellCount">0</span>
            </button>
            <button class="logout-btn" onclick="doLogout()">🚪 <span id="logoutLabel">Logout</span></button>
        </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay" onclick="closeAllDrawers()"></div>

    <div class="notif-drawer" id="notifDrawer">
        <div class="drawer-header">
            <h2 id="notifDrawerTitle">🔔 Notifications</h2>
            <span class="drawer-close" onclick="closeAllDrawers()">✕</span>
        </div>
        <div id="notifList"></div>
    </div>

    <div class="notif-drawer" id="logDrawer">
        <div class="drawer-header">
            <h2 id="logDrawerTitle">📋 Activity Log</h2>
            <span class="drawer-close" onclick="closeAllDrawers()">✕</span>
        </div>
        <div id="logList"></div>
    </div>

    <div class="container">
        <div class="section-title">
            <span class="bar"></span><span id="tablesTitle">Tables</span>
            <span class="count-badge" id="tableCount">0</span>
        </div>
        <div class="grid" id="tableGrid">
            <div class="loading-block"><div class="spinner"></div></div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="overlay" id="moveOverlay">
        <div class="modal">
            <span class="close-modal" onclick="closeMoveModal()">✕</span>
            <div id="moveModalContent"></div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        let currentTableId = null;
        let moveFromTableId = null;
        let currentAlerts = [];
        let previousAlertKeys = new Set();
        let previousPendingCounts = {};
        let previousReadyCounts = {};
        let hasLoadedTablesOnce = false;
        let tableStatusMode = "simple";

        let audioCtx = null;

        function unlockAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }
        document.addEventListener("click", unlockAudio, { once: true });
        document.addEventListener("touchstart", unlockAudio, { once: true });

        let currentLang = localStorage.getItem("katinaLang") || "gr";

        const T = {
            gr: {
                login_title: "Σύνδεση Προσωπικού",
                login_sub: "Εισάγετε τον κωδικό προσωπικού και το όνομά σας μία φορά — αυτή η συσκευή θα τα θυμάται.",
                name_placeholder: "Το όνομά σας",
                code_placeholder: "Κωδικός προσωπικού",
                unlock: "Ξεκλείδωμα",
                enter_name: "Παρακαλώ εισάγετε το όνομά σας.",
                wrong_code: "Λάθος κωδικός, δοκιμάστε ξανά.",
                session_expired: "Η σύνδεσή σας έληξε. Παρακαλώ συνδεθείτε ξανά.",
                waiter_title: "Katina — Σερβιτόρος",
                logged_in_as: (n) => `Συνδεδεμένος ως ${n}`,
                notifications: "🔔 Ειδοποιήσεις",
                activity_log: "📋 Ιστορικό Δραστηριότητας",
                history_for: (l) => `🕘 ${l} — Ιστορικό`,
                no_history: "Δεν υπάρχει ιστορικό για αυτό το τραπέζι ακόμα.",
                no_activity: "Δεν υπάρχει δραστηριότητα ακόμα.",
                no_alerts: "Καμία ενεργή ειδοποίηση 🎉",
                tables: "Τραπέζια",
                empty: "🟢 Άδειο",
                paid: "💰 Πληρωμένο",
                unpaid: "❌ Απλήρωτο",
                occupied: "🔵 Κατειλημμένο",
                people: (n) => `👥 ${n}`,
                pending_short: (n) => `🧾 ${n} εκκρ.`,
                calling_waiter: "🔔 ΚΑΛΕΙ ΣΕΡΒΙΤΟΡΟ",
                wants_to_pay: (m) => `💳 ΘΕΛΕΙ ΝΑ ΠΛΗΡΩΣΕΙ${m ? " — " + m : ""}`,
                new_orders: (n) => `🧾 ${n} ${n > 1 ? "ΝΕΕΣ ΠΑΡΑΓΓΕΛΕΙΕΣ" : "ΝΕΑ ΠΑΡΑΓΓΕΛΙΑ"}`,
                order_ready_banner: "✅ ΕΤΟΙΜΟ ΠΡΟΣ ΠΑΡΑΛΑΒΗ",
                order_ready_alert: (n) => `${n} παραγγελία(ες) έτοιμες προς παραλαβή`,
                ready_tag: "✅ Έτοιμο",
                picked_up: "Παρέλαβα",
                accept_all: "Αποδοχή Όλων",
                pickup_all: "Παρέλαβα Όλα",
                needs_release: "⏹️ ΧΡΕΙΑΖΕΤΑΙ ΑΠΕΛΕΥΘΕΡΩΣΗ",
                session_status: (s) => `Συνεδρία: ${s}`,
                cash: "💵 Μετρητά",
                card: "💳 Κάρτα",
                called_for_waiter: "Κάλεσε σερβιτόρο",
                requested_bill: (m) => `Ζήτησε τον λογαριασμό${m ? " (" + m + ")" : ""}`,
                orders_awaiting: (n) => `${n} παραγγελία(ες) προς έλεγχο`,
                needs_release_short: "Χρειάζεται απελευθέρωση",
                table_empty_msg: "🟢 Αυτό το τραπέζι είναι άδειο αυτή τη στιγμή.",
                open_session: "Άνοιγμα Τραπεζιού",
                session_ended_msg: (s) => `⏹️ Αυτή η συνεδρία έχει τελειώσει (${s}), αλλά το τραπέζι δεν έχει απελευθερωθεί ακόμα.`,
                release_table: "Απελευθέρωση Τραπεζιού",
                edit: "✏️ Επεξεργασία",
                edit_party_size: "✏️ Αλλαγή Ατόμων",
                bill_so_far: (a) => `💶 Λογαριασμός: €${a}`,
                customer_link: "Σύνδεσμος πελάτη ↗",
                table_called_msg: "🔔 Αυτό το τραπέζι κάλεσε σερβιτόρο.",
                acknowledge: "Επιβεβαίωση",
                table_requested_bill_msg: (m) => `💳 Αυτό το τραπέζι ζήτησε τον λογαριασμό${m ? " — " + m : ""}.`,
                orders_heading: "Παραγγελίες",
                no_orders: "Δεν υπάρχουν παραγγελίες ακόμα.",
                accept: "Αποδοχή",
                reject: "Απόρριψη",
                by: (n) => `από ${n}`,
                mark_paid: "Πληρωμένο",
                delete_session: "Διαγραφή",
                move_table: "Μετακίνηση",
                move_title: (l) => `Μετακίνηση από ${l} σε:`,
                move_no_empty: "Δεν υπάρχουν άδεια τραπέζια αυτή τη στιγμή.",
                logout: "Αποσύνδεση",
                logout_confirm: "Αποσύνδεση από αυτή τη συσκευή;",
                status_labels: { PENDING_REVIEW: "Εκκρεμεί", APPROVED: "Εγκρίθηκε", REJECTED: "Απορρίφθηκε", CANCELLED: "Ακυρώθηκε", VOIDED: "Διαγράφηκε" },
                rename_prompt: "Μετονομασία τραπεζιού:",
                party_size_prompt: "Ενημέρωση αριθμού ατόμων:",
                delete_session_confirm: "Διαγραφή αυτής της συνεδρίας; Αυτό ακυρώνει όλες τις παραγγελίες της.",
                action_labels: {
                    "registered table": "καταχώρησε τραπέζι",
                    "deleted table": "διέγραψε τραπέζι",
                    "released table": "απελευθέρωσε τραπέζι",

        function t(key, ...args) {
            const val = T[currentLang][key];
            return typeof val === "function" ? val(...args) : val;
        }

        function toggleLang() {
            currentLang = currentLang === "gr" ? "en" : "gr";
            localStorage.setItem("katinaLang", currentLang);
            applyStaticText();
            if (getToken()) {
                loadTables();
                if (currentTableId) openTableModal(currentTableId, true);
            }
        }

        function applyStaticText() {
            const langLabel = currentLang === "gr" ? "EN" : "GR";
            document.getElementById("loginLangBtn").innerText = langLabel;
            document.getElementById("langBtn").innerText = langLabel;
            document.getElementById("loginTitle").innerText = t("login_title");
            document.getElementById("loginSub").innerText = t("login_sub");
            document.getElementById("nameInput").placeholder = t("name_placeholder");
            document.getElementById("loginInput").placeholder = t("code_placeholder");
            document.getElementById("unlockBtn").innerText = t("unlock");
            document.getElementById("headerTitle").innerText = t("waiter_title");
            document.getElementById("tablesTitle").innerText = t("tables");
            document.getElementById("logoutLabel").innerText = t("logout");
            if (getWaiterName() !== "Unknown" || getToken()) {
                document.getElementById("whoamiLabel").innerText = t("logged_in_as", getWaiterName());
            }
        }

        function playNotificationSound() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === "suspended") audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Could not play notification sound", e);
            }
        }

        function showToast(alert) {
            const container = document.getElementById("toastContainer");
            const toastClass = alert.type === "called" ? "called" : alert.type === "pay" ? "pay" : alert.type === "ready" ? "ready" : "";
            const icon = toastClass === "called" ? "🔔" : toastClass === "pay" ? "💳" : toastClass === "ready" ? "✅" : "🧾";

            const toast = document.createElement("div");
            toast.className = `toast ${toastClass}`;
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <div class="toast-text">
                    <div class="toast-title">${escapeHtml(alert.label)}</div>
                    <div class="toast-sub">${escapeHtml(alert.text)}</div>
                </div>
            `;
            toast.onclick = () => {
                toast.remove();
                jumpToTable(alert.tableId);
            };
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 5000);
        }

        function getToken() {
            return localStorage.getItem("waiterToken");
        }
        function getWaiterName() {
            return localStorage.getItem("waiterName") || "Unknown";
        }

        function doLogin() {
            const name = document.getElementById("nameInput").value.trim();
            const code = document.getElementById("loginInput").value;
            if (!name) {
                document.getElementById("loginError").innerText = t("enter_name");
                return;
            }
            if (!code) return;

            fetch(`${BASE}/verify-token`, {
                headers: { "X-Waiter-Token": code }
            }).then(r => {
                if (r.status === 401) {
                    document.getElementById("loginError").innerText = t("wrong_code");
                    return null;
                }
                return r.json();
            }).then(data => {
                if (!data) return;
                localStorage.setItem("waiterToken", code);
                localStorage.setItem("waiterName", name);
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("loginError").innerText = "";
                document.getElementById("whoamiLabel").innerText = t("logged_in_as", name);
                loadTables();
            }).catch(() => {
                document.getElementById("loginError").innerText = t("wrong_code");
            });
        }

        function doLogout() {
            if (!confirm(t("logout_confirm"))) return;
            localStorage.removeItem("waiterToken");
            localStorage.removeItem("waiterName");
            currentTableId = null;
            moveFromTableId = null;
            document.getElementById("overlay").style.display = "none";
            document.getElementById("moveOverlay").style.display = "none";
            closeAllDrawers();
            document.getElementById("nameInput").value = "";
            document.getElementById("loginInput").value = "";
            document.getElementById("loginError").innerText = "";
            document.getElementById("loginScreen").style.display = "flex";
        }

        function authHeaders() {
            return {
                "X-Waiter-Token": getToken(),
                "X-Waiter-Name": encodeURIComponent(getWaiterName())
            };
        }

        function handleAuthFailure() {
            localStorage.removeItem("waiterToken");
            localStorage.removeItem("waiterName");
            document.getElementById("overlay").style.display = "none";
            document.getElementById("moveOverlay").style.display = "none";
            closeAllDrawers();
            currentTableId = null;
            moveFromTableId = null;
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("loginError").innerText = t("session_expired");
        }

        function authFetch(url, options) {
            const opts = options || {};
            opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
            return fetch(url, opts).then(r => {
                if (r.status === 401) {
                    handleAuthFailure();
                    return null;
                }
                return r;
            });
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function paymentMethodLabel(method) {
            if (method === "cash") return t("cash");
            if (method === "card") return t("card");
            return "";
        }

        function translateAction(action) {
            return T[currentLang].action_labels[action] || action;
        }

        function getStatusStat(session) {
            if (session.is_paid) return { cls: "paid", label: t("paid") };
            if (tableStatusMode === "detailed" && (session.bill_total || 0) === 0) {
                return { cls: "occupied-stat", label: t("occupied") };
            }
            return { cls: "unpaid", label: t("unpaid") };
        }

        function openActivityLog() {
            document.getElementById("logDrawerTitle").innerText = t("activity_log");
            document.getElementById("drawerOverlay").classList.add("open");
            document.getElementById("logDrawer").classList.add("open");
            document.getElementById("logList").innerHTML = `<div class="loading-block"><div class="spinner light"></div></div>`;

            authFetch(`${BASE}/activity-log`)
                .then(r => r ? r.json() : null)
                .then(logs => { if (logs) renderLogList(logs); });
        }

        function openTableHistory(tableId, label) {
            document.getElementById("logDrawerTitle").innerText = t("history_for", label);
            document.getElementById("drawerOverlay").classList.add("open");
            document.getElementById("logDrawer").classList.add("open");
            document.getElementById("logList").innerHTML = `<div class="loading-block"><div class="spinner light"></div></div>`;

            authFetch(`${BASE}/tables/${tableId}/history`)
                .then(r => r ? r.json() : null)
                .then(logs => { if (logs) renderLogList(logs, t("no_history")); });
        }

        function renderLogList(logs, emptyMessage) {
            const list = document.getElementById("logList");
            if (!Array.isArray(logs) || logs.length === 0) {
                list.innerHTML = `<div class="notif-empty">${emptyMessage || t("no_activity")}</div>`;
                return;
            }
            list.innerHTML = logs.map(l => {
                const time = new Date(l.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                return `
                    <div class="log-row">
                        <div class="waiter">${escapeHtml(l.waiter_name)}</div>
                        <div class="action">${escapeHtml(translateAction(l.action))} — ${escapeHtml(l.target_id)}</div>
                        <div class="time">${time}</div>
                    </div>
                `;
            }).join("");
        }

        function closeAllDrawers() {
            document.getElementById("notifDrawer").classList.remove("open");
            document.getElementById("logDrawer").classList.remove("open");
            document.getElementById("drawerOverlay").classList.remove("open");
            document.getElementById("bellBtn").classList.remove("active");
        }

        function toggleNotifPanel() {
            const drawer = document.getElementById("notifDrawer");
            const overlay = document.getElementById("drawerOverlay");
            const btn = document.getElementById("bellBtn");
            const isOpen = drawer.classList.contains("open");

            document.getElementById("notifDrawerTitle").innerText = t("notifications");
            document.getElementById("logDrawer").classList.remove("open");
            drawer.classList.toggle("open", !isOpen);
            overlay.classList.toggle("open", !isOpen);
            btn.classList.toggle("active", !isOpen);
            if (!isOpen) renderNotifPanel();
        }

        function renderNotifPanel() {
            const list = document.getElementById("notifList");
            if (currentAlerts.length === 0) {
                list.innerHTML = `<div class="notif-empty">${t("no_alerts")}</div>`;
                return;
            }
            list.innerHTML = currentAlerts.map(a => `
                <div class="notif-row" onclick="jumpToTable('${a.tableId}')">
                    <div class="info">
                        <div class="table-name">${escapeHtml(a.label)}</div>
                        <div class="type">${escapeHtml(a.text)}</div>
                    </div>
                    <div class="go">→</div>
                </div>
            `).join("");
        }

        function jumpToTable(tableId) {
            closeAllDrawers();
            openTableModal(tableId);
        }

        function loadTables() {
            Promise.all([
                fetch(`${BASE}/tables`).then(r => r.json()),
                fetch(`${BASE}/orders/pending`).then(r => r.json()),
                fetch(`${BASE}/orders/ready`).then(r => r.json()),
                fetch(`${BASE}/settings`).then(r => r.json()).catch(() => ({})),
            ]).then(([tables, pendingOrders, readyOrders, settings]) => {

                tableStatusMode = (settings && settings.table_status_mode) || "simple";

                window._tablesCache = tables;
                document.getElementById("tableCount").innerText = tables.length;

                const pendingCountBySession = {};
                pendingOrders.forEach(o => {
                    pendingCountBySession[o.session_id] = (pendingCountBySession[o.session_id] || 0) + 1;
                });

                const readyCountBySession = {};
                readyOrders.forEach(o => {
                    readyCountBySession[o.session_id] = (readyCountBySession[o.session_id] || 0) + 1;
                });

                const sessionFetches = tables
                    .filter(t => t.active_session_id)
                    .map(t =>
                        fetch(`${BASE}/sessions/${t.active_session_id}`)
                            .then(r => r.json())
                            .then(session => ({ table_id: t.table_id, session }))
                    );

                Promise.all(sessionFetches).then(results => {
                    const sessionByTableId = {};
                    results.forEach(r => {
                        if (!r.session.error) sessionByTableId[r.table_id] = r.session;
                    });

                    currentAlerts = [];
                    const newOrderEvents = [];
                    const newPendingCounts = {};
                    const newReadyCounts = {};
                    const grid = document.getElementById("tableGrid");
                    grid.innerHTML = "";

                    if (tables.length === 0) {
                        grid.innerHTML = `<div class="loading-block">—</div>`;
                    }

                    tables.forEach(tbl => {
                        const label = tbl.display_label || tbl.table_id;
                        const safeLabel = escapeHtml(label);
                        const session = sessionByTableId[tbl.table_id];
                        const historyIcon = `<span class="card-icon-btn" onclick="event.stopPropagation(); openTableHistory('${tbl.table_id}', '${safeLabel}')">🕘</span>`;

                        if (!session) {
                            grid.innerHTML += `
                                <div class="card empty" onclick="openTableModal('${tbl.table_id}')">
                                    <div class="icon-row">${historyIcon}</div>
                                    <div class="card-body">
                                        <h3>${safeLabel}</h3>
                                        <div class="card-stats"><span class="stat empty-stat">${t("empty")}</span></div>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        if (session.status !== "OPEN") {
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("needs_release_short"), type: "release" });
                            grid.innerHTML += `
                                <div class="card has-alert" onclick="openTableModal('${tbl.table_id}')">
                                    <div class="icon-row">${historyIcon}</div>
                                    <div class="card-alert release">${t("needs_release")}</div>
                                    <div class="card-body">
                                        <h3>${safeLabel}</h3>
                                        <div class="card-stats"><span class="stat">${t("session_status", session.status)}</span></div>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        const pending = pendingCountBySession[session.session_id] || 0;
                        const ready = readyCountBySession[session.session_id] || 0;

                        const prevPending = previousPendingCounts[session.session_id] || 0;
                        newPendingCounts[session.session_id] = pending;
                        if (pending > prevPending && hasLoadedTablesOnce) {
                            newOrderEvents.push({ tableId: tbl.table_id, label, text: t("orders_awaiting", pending), type: "orders" });
                        }

                        const prevReady = previousReadyCounts[session.session_id] || 0;
                        newReadyCounts[session.session_id] = ready;
                        if (ready > prevReady && hasLoadedTablesOnce) {
                            newOrderEvents.push({ tableId: tbl.table_id, label, text: t("order_ready_alert", ready), type: "ready" });
                        }

                        let bannerClass = "";
                        let bannerText = "";
                        if (session.waiter_called) {
                            bannerClass = "called"; bannerText = t("calling_waiter");
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("called_for_waiter"), type: "called" });
                        } else if (session.payment_requested) {
                            const methodLabel = paymentMethodLabel(session.payment_method);
                            bannerClass = "pay"; bannerText = t("wants_to_pay", methodLabel);
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("requested_bill", methodLabel), type: "pay" });
                        } else if (ready > 0) {
                            bannerClass = "ready"; bannerText = t("order_ready_banner");
                        } else if (pending > 0) {
                            bannerClass = "pending"; bannerText = t("new_orders", pending);
                        }
                        if (ready > 0) {
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("order_ready_alert", ready), type: "ready" });
                        }
                        if (pending > 0) {
                            currentAlerts.push({ tableId: tbl.table_id, label, text: t("orders_awaiting", pending), type: "orders" });
                        }

                        const bannerHtml = bannerClass
                            ? `<div class="card-alert ${bannerClass}">${bannerText}</div>`
                            : "";

                        const moveIcon = `<span class="card-icon-btn" onclick="event.stopPropagation(); openMovePicker('${tbl.table_id}', '${safeLabel}')">⇄</span>`;

                        const statusStat = getStatusStat(session);

                        grid.innerHTML += `
                            <div class="card ${bannerClass ? 'has-alert' : ''}" onclick="openTableModal('${tbl.table_id}')">
                                <div class="icon-row">${moveIcon}${historyIcon}</div>
                                ${bannerHtml}
                                <div class="card-body">
                                    <h3>${safeLabel}</h3>
                                    <div class="card-stats">
                                        <span class="stat">${t("people", session.party_size)}</span>
                                        <span class="stat ${statusStat.cls}">${statusStat.label}</span>
                                        ${pending > 0 ? `<span class="stat">${t("pending_short", pending)}</span>` : ""}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    previousPendingCounts = newPendingCounts;
                    previousReadyCounts = newReadyCounts;

                    const currentAlertKeys = new Set(currentAlerts.map(a => `${a.tableId}-${a.type}`));
                    const newStatusAlerts = currentAlerts.filter(a => a.type !== "orders" && a.type !== "ready" && !previousAlertKeys.has(`${a.tableId}-${a.type}`));
                    const allTriggerEvents = newStatusAlerts.concat(newOrderEvents);

                    if (allTriggerEvents.length > 0 && hasLoadedTablesOnce) {
                        playNotificationSound();
                        allTriggerEvents.forEach(a => showToast(a));
                    }
                    previousAlertKeys = currentAlertKeys;
                    hasLoadedTablesOnce = true;

                    document.getElementById("bellCount").innerText = currentAlerts.length;
                    if (document.getElementById("notifDrawer").classList.contains("open")) renderNotifPanel();

                    if (currentTableId) openTableModal(currentTableId, true);
                });
            });
        }

        function openMovePicker(fromTableId, fromLabel) {
            moveFromTableId = fromTableId;
            const content = document.getElementById("moveModalContent");
            content.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
            document.getElementById("moveOverlay").style.display = "flex";

            const tables = window._tablesCache || [];
            const emptyTables = tables.filter(t => !t.active_session_id && t.table_id !== fromTableId);

            const listHtml = emptyTables.length
                ? emptyTables.map(t => {
                    const label = escapeHtml(t.display_label || t.table_id);
                    return `<button class="move-target-btn" onclick="confirmMove('${t.table_id}')">${label} <span>→</span></button>`;
                }).join("")
                : `<p class="move-empty-msg">${t("move_no_empty")}</p>`;

            content.innerHTML = `
                <h2>${t("move_title", fromLabel)}</h2>
                <div style="margin-top:16px;">${listHtml}</div>
                <p id="moveModalResult" style="margin-top:10px; font-size:13px; font-weight:600; color:#c0392b;"></p>
            `;
        }

        function closeMoveModal() {
            document.getElementById("moveOverlay").style.display = "none";
            moveFromTableId = null;
        }

        function confirmMove(toTableId) {
            const tables = window._tablesCache || [];
            const fromTable = tables.find(t => t.table_id === moveFromTableId);
            if (!fromTable || !fromTable.active_session_id) return;

            authFetch(`${BASE}/sessions/${fromTable.active_session_id}/move?to_table_id=${encodeURIComponent(toTableId)}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("moveModalResult").innerText = data.error;
                        return;
                    }
                    closeMoveModal();
                    loadTables();
                });
        }

        function openTableModal(tableId, silent) {
            currentTableId = tableId;
            const content = document.getElementById("modalContent");

            if (!silent) {
                content.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
                document.getElementById("overlay").style.display = "flex";
            }

            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === tableId);
                    const label = table ? (table.display_label || table.table_id) : tableId;
                    const safeLabel = escapeHtml(label);
                    const renameIcon = `<span onclick="renameTable('${tableId}', '${safeLabel}')" style="cursor:pointer; font-size:16px; color:#ff6b35; margin-left:8px;">✏️</span>`;

                    if (!table || !table.active_session_id) {
                        content.innerHTML = `
                            <h2>${safeLabel}${renameIcon}</h2>
                            <p style="color:#1d7d72; font-weight:600; margin:12px 0;">${t("table_empty_msg")}</p>
                            <div style="margin-top:12px;">
                                <button class="success" onclick="openSessionForCurrentTable()">${t("open_session")}</button>
                            </div>
                            <p id="modalResult"></p>
                        `;
                        return;
                    }

                    fetch(`${BASE}/sessions/${table.active_session_id}`)
                        .then(r => r.json())
                        .then(session => {
                            if (session.error || session.status !== "OPEN") {
                                content.innerHTML = `
                                    <h2>${safeLabel}${renameIcon}</h2>
                                    <p style="color:#777; font-weight:600; margin:12px 0;">${t("session_ended_msg", session.status || "unknown")}</p>
                                    <button class="secondary" onclick="releaseTable('${tableId}')">${t("release_table")}</button>
                                    <p id="modalResult"></p>
                                `;
                                return;
                            }

                            fetch(`${BASE}/sessions/${session.session_id}/orders`)
                                .then(r => r.json())
                                .then(orders => {
                                    const statusEmoji = { PENDING_REVIEW: "⏳", APPROVED: "✅", REJECTED: "🚫", CANCELLED: "❌", VOIDED: "⛔" };

                                    const billTotal = orders
                                        .filter(o => o.status === "APPROVED")
                                        .reduce((sum, o) => sum + (o.price * o.qty), 0);

                                    const pendingCount = orders.filter(o => o.status === "PENDING_REVIEW").length;
                                    const readyCount = orders.filter(o => o.status === "APPROVED" && o.ready).length;

                                    let ordersHtml = orders.length
                                        ? orders.map(o => {
                                            const extrasList = (o.extras || []).map(e => escapeHtml(e.name)).join(", ");

                                            let actionsHtml;
                                            if (o.status === "PENDING_REVIEW") {
                                                actionsHtml = `
                                                    <button class="success" onclick="approveOrder('${o.order_id}')">${t("accept")}</button>
                                                    <button class="danger" onclick="rejectOrder('${o.order_id}')">${t("reject")}</button>
                                                `;
                                            } else if (o.status === "APPROVED" && o.ready) {
                                                actionsHtml = `<button class="success" onclick="pickedUp('${o.order_id}')">${t("picked_up")}</button>`;
                                            } else {
                                                actionsHtml = `<span style="font-size:12px;color:#999;">${t("status_labels")[o.status] || o.status}${o.handled_by ? ' ' + t("by", escapeHtml(o.handled_by)) : ''}</span>`;
                                            }

                                            const readyTag = (o.status === "APPROVED" && o.ready)
                                                ? `<div style="font-size:11.5px; color:#1d7d72; font-weight:700; margin-top:2px;">${t("ready_tag")}</div>`
                                                : "";

                                            return `
                                            <div class="order-line">
                                                <div class="info">
                                                    ${statusEmoji[o.status] || ""} ${o.qty}x ${escapeHtml(o.item)} — €${(o.price * o.qty).toFixed(2)}
                                                    ${readyTag}
                                                    ${extrasList ? `<div style="font-size:11.5px; color:#1d5fd7; margin-top:2px; white-space:normal;">+ ${extrasList}</div>` : ""}
                                                    ${o.note ? `<div style="font-size:14px; color:#e74c3c; font-weight:700; font-style:italic; margin-top:4px; white-space:normal;">💬 ${escapeHtml(o.note)}</div>` : ""}
                                                </div>
                                                <div class="actions">${actionsHtml}</div>
                                            </div>
                                        `;
                                        }).join("")
                                        : `<p style='color:#999; padding:10px 0;'>${t("no_orders")}</p>`;

                                    let alerts = "";
                                    if (session.waiter_called) {
                                        alerts += `<p style="color:#f39c12; font-weight:700; margin:10px 0;">${t("table_called_msg")}
                                            <button class="secondary" onclick="acknowledgeCall()" style="margin-left:8px;">${t("acknowledge")}</button></p>`;
                                    }
                                    if (session.payment_requested) {
                                        const methodLabel = paymentMethodLabel(session.payment_method);
                                        alerts += `<p style="color:#7c3aed; font-weight:700; margin:10px 0;">${t("table_requested_bill_msg", methodLabel)}</p>`;
                                    }

                                    const bulkButtons = `
                                        ${pendingCount > 0 ? `<button class="success" onclick="approveAll('${session.session_id}')">${t("accept_all")}</button>` : ""}
                                        ${readyCount > 0 ? `<button class="success" onclick="pickupAll('${session.session_id}')">${t("pickup_all")}</button>` : ""}
                                    `;

                                    const modalStatusStat = getStatusStat(session);

                                    content.innerHTML = `
                                        <h2>${safeLabel}${renameIcon}</h2>
                                        <p style="color:#777; margin:6px 0 12px;">
                                            ${t("people", session.party_size)}
                                            <span onclick="editPartySize('${session.session_id}', ${session.party_size})" style="cursor:pointer; color:#ff6b35; font-weight:700; margin-left:6px;">${t("edit_party_size")}</span>
                                            &nbsp;|&nbsp; ${modalStatusStat.label}
                                        </p>
                                        <p style="font-size:18px; font-weight:800; color:#ff6b35; margin:10px 0;">${t("bill_so_far", billTotal.toFixed(2))}</p>
                                        <p style="font-size:13px;"><a href="customer.html?table=${tableId}" target="_blank" style="color:#ff6b35; font-weight:700;">${t("customer_link")}</a></p>
                                        ${alerts}
                                        <h3 style="font-size:16px; margin:20px 0 10px;">${t("orders_heading")}</h3>
                                        ${ordersHtml}
                                        <div class="bulk-actions" style="margin-top:12px;">${bulkButtons}</div>
                                        <div class="action-row">
                                            <button class="success" onclick="markPaid('${session.session_id}')">${t("mark_paid")}</button>
                                            <button class="secondary" onclick="openMovePicker('${tableId}', '${safeLabel}')">⇄ ${t("move_table")}</button>
                                            <button class="danger" onclick="deleteSession('${session.session_id}')">${t("delete_session")}</button>
                                        </div>
                                        <p id="modalResult"></p>
                                    `;
                                });
                        });
                });
        }

        function renameTable(tableId, currentLabel) {
            const newLabel = prompt(t("rename_prompt"), currentLabel);
            if (newLabel === null || !newLabel.trim()) return;

            authFetch(`${BASE}/tables/${tableId}/rename?display_label=${encodeURIComponent(newLabel)}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function editPartySize(sessionId, currentSize) {
            const newSize = prompt(t("party_size_prompt"), currentSize);
            if (newSize === null) return;

            authFetch(`${BASE}/sessions/${sessionId}/update-party-size?party_size=${newSize}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function openSessionForCurrentTable() {
            const partySize = 2;

            authFetch(`${BASE}/sessions/open?table_id=${currentTableId}&party_size=${partySize}`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            currentTableId = null;
        }

        function acknowledgeCall() {
            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === currentTableId);
                    if (!table || !table.active_session_id) return;
                    authFetch(`${BASE}/sessions/${table.active_session_id}/acknowledge-call`, {
                        method: "POST"
                    })
                        .then(r => r ? r.json() : null)
                        .then(data => { if (data) { openTableModal(currentTableId); loadTables(); } });
                });
        }

        function approveOrder(orderId) {
            authFetch(`${BASE}/orders/${orderId}/approve`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function approveAll(sessionId) {
            authFetch(`${BASE}/sessions/${sessionId}/approve-all`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function rejectOrder(orderId) {
            authFetch(`${BASE}/orders/${orderId}/reject`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function pickedUp(orderId) {
            authFetch(`${BASE}/orders/${orderId}/picked-up`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function pickupAll(sessionId) {
            authFetch(`${BASE}/sessions/${sessionId}/pickup-all`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function markPaid(sessionId) {
            authFetch(`${BASE}/sessions/${sessionId}/mark-paid`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    closeModal();
                    loadTables();
                });
        }

        function deleteSession(sessionId) {
            if (!confirm(t("delete_session_confirm"))) return;
            authFetch(`${BASE}/sessions/${sessionId}`, {
                method: "DELETE"
            })
                .then(r => r ? r.json() : null)
                .then(data => { if (data) { openTableModal(currentTableId); loadTables(); } });
        }

        function releaseTable(tableId) {
            authFetch(`${BASE}/tables/${tableId}/release`, {
                method: "POST"
            })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    closeModal();
                    loadTables();
                });
        }

        applyStaticText();

        if (getToken()) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("whoamiLabel").innerText = t("logged_in_as", getWaiterName());
            loadTables();
        }
        setInterval(loadTables, 5000);
    </script>
</body>
</html>
