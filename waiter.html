<!DOCTYPE html>
<html>
<head>
    <title>Katina — Waiter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #f7f5f2;
            color: #1a1a1a;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 20px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(255,107,53,0.35);
        }
        header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }

        /* Notification bell — a real clickable button with a dropdown panel */
        .bell-wrap { position: relative; }
        .bell-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        .bell-btn.active { background: #ff6b35; }
        .bell-count {
            background: #ff6b35;
            color: white;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800;
        }
        .bell-btn.active .bell-count { background: rgba(255,255,255,0.3); }

        .notif-panel {
            display: none;
            position: absolute;
            top: 56px; right: 0;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.2);
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
            z-index: 30;
        }
        .notif-panel.open { display: block; }
        .notif-empty { padding: 30px 20px; text-align: center; color: #aaa; font-size: 14px; }
        .notif-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px; border-radius: 12px; cursor: pointer;
        }
        .notif-row:hover { background: #f7f5f2; }
        .notif-row .info { font-size: 14px; }
        .notif-row .table-name { font-weight: 800; }
        .notif-row .type { font-size: 12px; color: #777; margin-top: 2px; }
        .notif-row .go { font-size: 18px; color: #ff6b35; }

        .container { padding: 24px; max-width: 1000px; margin: 0 auto; }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 22px; font-weight: 800;
            margin: 8px 0 18px;
        }
        .section-title .bar {
            width: 5px; height: 22px; border-radius: 3px;
            background: #ff6b35;
        }
        .section-title .count-badge {
            background: #eee; color: #666;
            font-size: 13px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        /* Add-table tile — matches the card grid, dashed border */
        .add-tile {
            border: 2.5px dashed #ddd;
            border-radius: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 30px 18px;
            cursor: pointer;
            color: #999;
            transition: transform 0.15s, border-color 0.15s, color 0.15s;
            min-height: 140px;
        }
        .add-tile:hover { border-color: #ff6b35; color: #ff6b35; transform: translateY(-3px); }
        .add-tile .plus { font-size: 32px; font-weight: 300; line-height: 1; margin-bottom: 6px; }
        .add-tile .label { font-size: 14px; font-weight: 700; }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .card:hover { transform: translateY(-3px); }

        /* Alert banner — full-width colored strip at the top of the card, unmissable */
        .card-alert {
            padding: 10px 16px;
            font-size: 12.5px;
            font-weight: 800;
            color: white;
        }
        .card-alert.called { background: #f39c12; }
        .card-alert.pay { background: #7c3aed; }
        .card-alert.pending { background: #ff6b35; }
        .card-alert.release { background: #999; }

        .card-body { padding: 18px; border-top: 5px solid #eee; }
        .card.empty .card-body { border-top-color: #1d7d72; }
        .card.has-alert .card-body { border-top: none; padding-top: 14px; }

        .card h3 { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
        .card-stats { display: flex; flex-wrap: wrap; gap: 8px; }
        .stat {
            font-size: 13px; font-weight: 700;
            background: #f7f5f2; color: #555;
            padding: 6px 12px; border-radius: 10px;
            display: flex; align-items: center; gap: 5px;
        }
        .stat.paid { background: #e6f5f3; color: #1d7d72; }
        .stat.unpaid { background: #fce8e6; color: #c0392b; }
        .stat.empty-stat { background: #e6f5f3; color: #1d7d72; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 28px;
            width: 92%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .modal h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .modal input {
            padding: 12px 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            margin-top: 10px;
            margin-right: 8px;
            font-size: 14px;
            width: 100%;
            max-width: 220px;
        }
        button {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }
        button.danger { background: #e74c3c; }
        button.success { background: #1d7d72; }
        button.secondary { background: #f0f0f0; color: #555; }
        button.primary { background: linear-gradient(135deg, #ff6b35, #f7931e); }

        .order-line {
            border-bottom: 1px solid #f2f2f2;
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-line .info { font-size: 14px; font-weight: 600; }
        .order-line .actions button { margin-left: 6px; font-size: 12px; padding: 8px 12px; }
        .action-row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .close-modal {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 24px; color: #bbb;
        }
        #modalResult { margin-top: 14px; font-size: 13px; font-weight: 600; color: #555; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo">🍽️</div>
            <h1>Katina — Waiter</h1>
        </div>
        <div class="bell-wrap">
            <button class="bell-btn" id="bellBtn" onclick="toggleNotifPanel()">
                🔔 <span class="bell-count" id="bellCount">0</span>
            </button>
            <div class="notif-panel" id="notifPanel"></div>
        </div>
    </header>

    <div class="container">

        <div class="section-title">
            <span class="bar"></span>Tables
            <span class="count-badge" id="tableCount">0</span>
        </div>
        <div class="grid" id="tableGrid"></div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        let currentTableId = null;
        let currentAlerts = [];

        // ---------- Add Table (now a modal, triggered by the dashed tile) ----------

        function openAddTableModal() {
            currentTableId = null;
            document.getElementById("modalContent").innerHTML = `
                <h2>Register a New Table</h2>
                <p style="color:#777; margin:8px 0 16px; font-size:14px;">One-time setup — this table stays forever, sessions come and go on top of it.</p>
                <input type="text" id="newTableId" placeholder="table id (e.g. T-1)">
                <input type="text" id="newTableLabel" placeholder="display name (optional)">
                <div style="margin-top:16px;">
                    <button class="primary" onclick="registerTable()">Register Table</button>
                </div>
                <p id="modalResult"></p>
            `;
            document.getElementById("overlay").style.display = "flex";
        }

        function registerTable() {
            const tableId = document.getElementById("newTableId").value;
            const label = document.getElementById("newTableLabel").value;
            if (!tableId) return alert("Enter a table id");

            fetch(`${BASE}/tables?table_id=${tableId}&display_label=${label || tableId}`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    closeModal();
                    loadTables();
                });
        }

        // ---------- Notification panel ----------

        function toggleNotifPanel() {
            const panel = document.getElementById("notifPanel");
            const btn = document.getElementById("bellBtn");
            const isOpen = panel.classList.contains("open");
            panel.classList.toggle("open", !isOpen);
            btn.classList.toggle("active", !isOpen);
            if (!isOpen) renderNotifPanel();
        }

        function renderNotifPanel() {
            const panel = document.getElementById("notifPanel");
            if (currentAlerts.length === 0) {
                panel.innerHTML = `<div class="notif-empty">No active alerts 🎉</div>`;
                return;
            }
            panel.innerHTML = currentAlerts.map(a => `
                <div class="notif-row" onclick="jumpToTable('${a.tableId}')">
                    <div class="info">
                        <div class="table-name">${a.label}</div>
                        <div class="type">${a.text}</div>
                    </div>
                    <div class="go">→</div>
                </div>
            `).join("");
        }

        function jumpToTable(tableId) {
            document.getElementById("notifPanel").classList.remove("open");
            document.getElementById("bellBtn").classList.remove("active");
            openTableModal(tableId);
        }

        // ---------- Tables grid ----------

        function loadTables() {
            Promise.all([
                fetch(`${BASE}/tables`).then(r => r.json()),
                fetch(`${BASE}/orders/pending`).then(r => r.json()),
            ]).then(([tables, pendingOrders]) => {

                document.getElementById("tableCount").innerText = tables.length;

                const pendingCountBySession = {};
                pendingOrders.forEach(o => {
                    pendingCountBySession[o.session_id] = (pendingCountBySession[o.session_id] || 0) + 1;
                });

                const sessionFetches = tables
                    .filter(t => t.active_session_id)
                    .map(t =>
                        fetch(`${BASE}/sessions/${t.active_session_id}`)
                            .then(r => r.json())
                            .then(session => ({ table_id: t.table_id, session }))
                    );

                Promise.all(sessionFetches).then(results => {
                    const sessionByTableId = {};
                    results.forEach(r => {
                        if (!r.session.error) sessionByTableId[r.table_id] = r.session;
                    });

                    currentAlerts = [];
                    const grid = document.getElementById("tableGrid");
                    grid.innerHTML = `
                        <div class="add-tile" onclick="openAddTableModal()">
                            <div class="plus">+</div>
                            <div class="label">Register Table</div>
                        </div>
                    `;

                    tables.forEach(t => {
                        const label = t.display_label || t.table_id;
                        const session = sessionByTableId[t.table_id];

                        if (!session) {
                            grid.innerHTML += `
                                <div class="card empty" onclick="openTableModal('${t.table_id}')">
                                    <div class="card-body">
                                        <h3>${label}</h3>
                                        <div class="card-stats"><span class="stat empty-stat">🟢 Empty</span></div>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        if (session.status !== "OPEN") {
                            currentAlerts.push({ tableId: t.table_id, label, text: "Needs release" });
                            grid.innerHTML += `
                                <div class="card has-alert" onclick="openTableModal('${t.table_id}')">
                                    <div class="card-alert release">⏹️ NEEDS RELEASE</div>
                                    <div class="card-body">
                                        <h3>${label}</h3>
                                        <div class="card-stats"><span class="stat">Session ${session.status.toLowerCase()}</span></div>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        const pending = pendingCountBySession[session.session_id] || 0;

                        // Priority order for the banner: called > wants pay > pending
                        let bannerClass = "";
                        let bannerText = "";
                        if (session.waiter_called) {
                            bannerClass = "called"; bannerText = "🔔 CALLING WAITER";
                            currentAlerts.push({ tableId: t.table_id, label, text: "Called for a waiter" });
                        } else if (session.payment_requested) {
                            bannerClass = "pay"; bannerText = "💳 WANTS TO PAY";
                            currentAlerts.push({ tableId: t.table_id, label, text: "Requested the bill" });
                        } else if (pending > 0) {
                            bannerClass = "pending"; bannerText = `🧾 ${pending} NEW ORDER${pending > 1 ? "S" : ""}`;
                        }
                        if (pending > 0 && bannerClass !== "pending") {
                            currentAlerts.push({ tableId: t.table_id, label, text: `${pending} order(s) awaiting review` });
                        }

                        const bannerHtml = bannerClass
                            ? `<div class="card-alert ${bannerClass}">${bannerText}</div>`
                            : "";

                        grid.innerHTML += `
                            <div class="card ${bannerClass ? 'has-alert' : ''}" onclick="openTableModal('${t.table_id}')">
                                ${bannerHtml}
                                <div class="card-body">
                                    <h3>${label}</h3>
                                    <div class="card-stats">
                                        <span class="stat">👥 ${session.party_size}</span>
                                        <span class="stat ${session.is_paid ? 'paid' : 'unpaid'}">${session.is_paid ? "💰 Paid" : "❌ Unpaid"}</span>
                                        ${pending > 0 && bannerClass !== "pending" ? `<span class="stat">🧾 ${pending} pending</span>` : ""}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById("bellCount").innerText = currentAlerts.length;
                    if (document.getElementById("notifPanel").classList.contains("open")) renderNotifPanel();

                    if (currentTableId) openTableModal(currentTableId, true);
                });
            });
        }

        function openTableModal(tableId, silent) {
            currentTableId = tableId;
            const content = document.getElementById("modalContent");

            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === tableId);
                    const label = table ? (table.display_label || table.table_id) : tableId;

                    if (!table || !table.active_session_id) {
                        content.innerHTML = `
                            <h2>${label}</h2>
                            <p style="color:#1d7d72; font-weight:600; margin:12px 0;">🟢 This table is currently empty.</p>
                            <input type="number" id="quickPartySize" placeholder="party size" value="2" style="width:120px;">
                            <div style="margin-top:12px;"><button class="success" onclick="openSessionForCurrentTable()">Open Session</button></div>
                            <p id="modalResult"></p>
                        `;
                        if (!silent) document.getElementById("overlay").style.display = "flex";
                        return;
                    }

                    fetch(`${BASE}/sessions/${table.active_session_id}`)
                        .then(r => r.json())
                        .then(session => {
                            if (session.error || session.status !== "OPEN") {
                                content.innerHTML = `
                                    <h2>${label}</h2>
                                    <p style="color:#777; font-weight:600; margin:12px 0;">⏹️ This session has ended (${session.status || "unknown"}), but the table hasn't been released yet.</p>
                                    <button class="secondary" onclick="releaseTable('${tableId}')">Release Table</button>
                                    <p id="modalResult"></p>
                                `;
                                if (!silent) document.getElementById("overlay").style.display = "flex";
                                return;
                            }

                            fetch(`${BASE}/sessions/${session.session_id}/orders`)
                                .then(r => r.json())
                                .then(orders => {
                                    const statusEmoji = { PENDING_REVIEW: "⏳", APPROVED: "✅", REJECTED: "🚫", CANCELLED: "❌" };

                                    let ordersHtml = orders.length
                                        ? orders.map(o => `
                                            <div class="order-line">
                                                <div class="info">${statusEmoji[o.status] || ""} ${o.qty}x ${o.item} — €${(o.price * o.qty).toFixed(2)}</div>
                                                <div class="actions">
                                                    ${o.status === "PENDING_REVIEW" ? `
                                                        <button class="success" onclick="approveOrder('${o.order_id}')">Accept</button>
                                                        <button class="danger" onclick="rejectOrder('${o.order_id}')">Reject</button>
                                                    ` : `<span style="font-size:12px;color:#999;">${o.status}</span>`}
                                                </div>
                                            </div>
                                        `).join("")
                                        : "<p style='color:#999; padding:10px 0;'>No orders yet.</p>";

                                    let alerts = "";
                                    if (session.waiter_called) {
                                        alerts += `<p style="color:#f39c12; font-weight:700; margin:10px 0;">🔔 This table called for a waiter.
                                            <button class="secondary" onclick="acknowledgeCall()" style="margin-left:8px;">Acknowledge</button></p>`;
                                    }
                                    if (session.payment_requested) {
                                        alerts += `<p style="color:#7c3aed; font-weight:700; margin:10px 0;">💳 This table requested the bill.</p>`;
                                    }

                                    content.innerHTML = `
                                        <h2>${label}</h2>
                                        <p style="color:#777; margin:6px 0 12px;">👥 ${session.party_size} people &nbsp;|&nbsp; ${session.is_paid ? "💰 Paid" : "❌ Unpaid"}</p>
                                        <p style="font-size:13px;"><a href="customer.html?table=${tableId}" target="_blank" style="color:#ff6b35; font-weight:700;">Customer link ↗</a></p>
                                        ${alerts}
                                        <h3 style="font-size:16px; margin:20px 0 10px;">Orders</h3>
                                        ${ordersHtml}
                                        <div class="action-row">
                                            <button class="secondary" onclick="calculateSplit('${session.session_id}')">Calculate Split</button>
                                            <button class="success" onclick="markPaid('${session.session_id}')">Mark Paid</button>
                                            <button onclick="closeSession('${session.session_id}')">Close Session</button>
                                            <button class="danger" onclick="deleteSession('${session.session_id}')">Delete Session</button>
                                        </div>
                                        <p id="modalResult"></p>
                                    `;

                                    if (!silent) document.getElementById("overlay").style.display = "flex";
                                });
                        });
                });
        }

        function openSessionForCurrentTable() {
            const partySize = document.getElementById("quickPartySize").value;

            fetch(`${BASE}/sessions/open?table_id=${currentTableId}&party_size=${partySize}`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            currentTableId = null;
        }

        function acknowledgeCall() {
            fetch(`${BASE}/tables`)
                .then(r => r.json())
                .then(tables => {
                    const table = tables.find(t => t.table_id === currentTableId);
                    if (!table || !table.active_session_id) return;
                    fetch(`${BASE}/sessions/${table.active_session_id}/acknowledge-call`, { method: "POST" })
                        .then(() => { openTableModal(currentTableId); loadTables(); });
                });
        }

        function approveOrder(orderId) {
            fetch(`${BASE}/orders/${orderId}/approve`, { method: "POST" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function rejectOrder(orderId) {
            fetch(`${BASE}/orders/${orderId}/reject`, { method: "POST" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function calculateSplit(sessionId) {
            fetch(`${BASE}/sessions/${sessionId}/split`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    document.getElementById("modalResult").innerText =
                        `Total: €${data.total} — €${data.per_person} per person (${data.party_size} people)`;
                });
        }

        function markPaid(sessionId) {
            fetch(`${BASE}/sessions/${sessionId}/mark-paid`, { method: "POST" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function closeSession(sessionId) {
            fetch(`${BASE}/sessions/${sessionId}/close`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    document.getElementById("modalResult").innerText = data.error || "Session closed. You can release the table now.";
                    openTableModal(currentTableId);
                    loadTables();
                });
        }

        function deleteSession(sessionId) {
            if (!confirm("Delete this session? This cancels all its orders.")) return;
            fetch(`${BASE}/sessions/${sessionId}`, { method: "DELETE" })
                .then(r => r.json())
                .then(() => { openTableModal(currentTableId); loadTables(); });
        }

        function releaseTable(tableId) {
            fetch(`${BASE}/tables/${tableId}/release`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("modalResult").innerText = data.error;
                        return;
                    }
                    closeModal();
                    loadTables();
                });
        }

        loadTables();
        setInterval(loadTables, 5000);
    </script>
</body>
</html>
