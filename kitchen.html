<!DOCTYPE html>
<html>
<head>
    <title>Katina — Kitchen</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        h1 { text-align: center; font-size: 36px; margin-bottom: 30px; }

        .stock-panel {
            background: #2c2c2c;
            border-radius: 10px;
            padding: 18px 22px;
            margin-bottom: 30px;
        }
        .stock-panel-title {
            font-size: 18px;
            font-weight: 800;
            color: #ccc;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stock-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .stock-item-btn {
            background: #3a3a3a;
            color: white;
            border: 2px solid #4a4a4a;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s;
        }
        .stock-item-btn:active { transform: scale(0.96); }
        .stock-item-btn.out {
            background: #4d1f1f;
            border-color: #e74c3c;
            color: #ff9d9d;
        }
        .stock-item-btn .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #27ae60;
        }
        .stock-item-btn.out .dot {
            background: #e74c3c;
        }

        .category-section { margin-bottom: 36px; }
        .category-heading {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 3px solid #ff6b35;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-count {
            background: #ff6b35;
            color: white;
            font-size: 16px;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;
        }

        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ticket {
            background: #2c2c2c;
            border-left: 8px solid #e67e22;
            border-radius: 10px;
            padding: 24px;
        }
        .ticket .table-name { margin: 0 0 6px 0; font-size: 22px; font-weight: 700; color: #f5b878; }
        .ticket h2 { margin: 0 0 10px 0; font-size: 36px; }
        .ticket p { margin: 6px 0; color: #ccc; font-size: 18px; }
        .ticket .extras {
            margin-top: 12px;
            background: #1a2e4d;
            border-left: 4px solid #4a90e2;
            border-radius: 6px;
            padding: 12px 14px;
            color: #a8c8f0;
            font-size: 20px;
            font-weight: 600;
        }
        .ticket .note {
            margin-top: 12px;
            background: #3d2e17;
            border-left: 4px solid #f39c12;
            border-radius: 6px;
            padding: 12px 14px;
            color: #ffd699;
            font-size: 20px;
            font-style: italic;
            font-weight: 600;
        }
        button {
            margin-top: 16px;
            background: #27ae60;
            border: none;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
        }
        button:disabled {
            background: #555;
            cursor: default;
        }
        .empty-msg { color: #888; font-size: 20px; text-align: center; padding: 40px 0; }
    </style>
</head>
<body>
    <h1>🔥 Kitchen Display</h1>

    <div class="stock-panel" id="stockPanel" style="display:none;">
        <div class="stock-panel-title">📦 Stock Status — tap an item if it runs out</div>
        <div class="stock-items" id="stockItems"></div>
    </div>

    <div id="categorySections"></div>

    <script>
       const PDA = "https://katina-bot-1.onrender.com";
       const BASE = "https://katina-bot.onrender.com";
       let previousTicketCount = 0;

       const CATEGORY_LABELS = {
           drinks: "🥤 Drinks",
           salads: "🥗 Salads",
           burgers: "🍔 Burgers",
           other: "🍽️ Other"
       };
       const CATEGORY_ORDER = ["drinks", "salads", "burgers"];

       function categoryLabel(cat) {
           return CATEGORY_LABELS[cat] || ("🍽️ " + cat.charAt(0).toUpperCase() + cat.slice(1));
       }

       function playNotificationSound() {
           try {
               const ctx = new (window.AudioContext || window.webkitAudioContext)();
               const oscillator = ctx.createOscillator();
               const gain = ctx.createGain();
               oscillator.connect(gain);
               gain.connect(ctx.destination);
               oscillator.frequency.value = 880;
               gain.gain.setValueAtTime(0.3, ctx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
               oscillator.start();
               oscillator.stop(ctx.currentTime + 0.3);
           } catch (e) {
               console.log("Could not play notification sound", e);
           }
       }

       function escapeHtml(str) {
           if (str === null || str === undefined) return "";
           return String(str)
               .replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;")
               .replace(/'/g, "&#39;");
       }

       function buildTicketHtml(t) {
           return `
               <div class="ticket">
                   <p class="table-name">${escapeHtml(t.table_label || 'Table')}</p>
                   <h2>${t.qty}x ${escapeHtml(t.item)}</h2>
                   ${t.extras ? `<div class="extras">+ ${escapeHtml(t.extras)}</div>` : ""}
                   ${t.note ? `<div class="note">💬 ${escapeHtml(t.note)}</div>` : ""}
                   <button onclick="markDone('${t.order_id}', this)">✅ Ready</button>
               </div>
           `;
       }

       function loadTickets() {
           fetch(`${PDA}/kitchen-tickets`)
               .then(r => r.json())
               .then(tickets => {
                   if (tickets.length > previousTicketCount) {
                       playNotificationSound();
                   }
                   previousTicketCount = tickets.length;

                   const container = document.getElementById("categorySections");

                   if (tickets.length === 0) {
                       container.innerHTML = "<p class='empty-msg'>No active tickets.</p>";
                       return;
                   }

                   const byCategory = {};
                   tickets.forEach(t => {
                       const cat = t.category || "other";
                       if (!byCategory[cat]) byCategory[cat] = [];
                       byCategory[cat].push(t);
                   });

                   const allCategories = [
                       ...CATEGORY_ORDER.filter(c => byCategory[c]),
                       ...Object.keys(byCategory).filter(c => !CATEGORY_ORDER.includes(c))
                   ];

                   container.innerHTML = allCategories.map(cat => `
                       <div class="category-section">
                           <div class="category-heading">
                               ${categoryLabel(cat)}
                               <span class="category-count">${byCategory[cat].length}</span>
                           </div>
                           <div class="ticket-list">
                               ${byCategory[cat].map(buildTicketHtml).join("")}
                           </div>
                       </div>
                   `).join("");
               });
       }

        function markDone(orderId, btn) {
            btn.disabled = true;
            btn.innerText = "...";
            fetch(`${PDA}/kitchen-tickets/${orderId}/done`, { method: "POST" })
                .then(() => fetch(`${BASE}/orders/${orderId}/ready`, { method: "POST" }))
                .then(() => loadTickets())
                .catch(() => loadTickets());
        }

        function loadStockPanel() {
            fetch(`${BASE}/menu-items`)
                .then(r => r.json())
                .then(items => {
                    const assigned = (items || []).filter(i => i.kitchen_assigned);
                    const panel = document.getElementById("stockPanel");
                    const list = document.getElementById("stockItems");

                    if (!assigned.length) {
                        panel.style.display = "none";
                        return;
                    }

                    panel.style.display = "block";
                    list.innerHTML = assigned.map(item => {
                        const isOut = !!item.kitchen_out;
                        return `
                            <button class="stock-item-btn ${isOut ? 'out' : ''}" onclick="toggleKitchenOut('${item.item_id}', ${isOut ? 0 : 1}, this)">
                                <span class="dot"></span>
                                ${escapeHtml(item.name)} ${isOut ? '— OUT' : ''}
                            </button>
                        `;
                    }).join("");
                });
        }

        function toggleKitchenOut(itemId, out, btn) {
            btn.disabled = true;
            fetch(`${BASE}/menu-items/${itemId}/kitchen-out?out=${out}`, { method: "POST" })
                .then(r => r.json())
                .then(() => {
                    loadStockPanel();
                })
                .catch(() => {
                    btn.disabled = false;
                });
        }

        loadTickets();
        loadStockPanel();
        setInterval(loadTickets, 3000);
        setInterval(loadStockPanel, 5000);

        </script>
</body>
</html>
