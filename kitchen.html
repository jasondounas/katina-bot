<!DOCTYPE html>
<html>
<head>
    <title>Katina — Kitchen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Commissioner:wght@300..700&family=GFS+Didot&display=swap');

        :root {
            --stage: #100e0c;
            --screen: #17130f;
            --surface: #1e1915;
            --surface-2: #262019;
            --surface-3: #2f2820;
            --text: #efe9e0;
            --text-2: #cdc4b6;
            --text-3: #9c9082;
            --text-4: #6b6156;
            --accent: #d9a75b;
            --accent-hover: #e5b568;
            --on-accent: #1b1409;
            --accent-soft: rgba(217, 167, 91, 0.14);
            --accent-line: rgba(217, 167, 91, 0.34);
            --live: #7ab5a9;
            --live-soft: rgba(122, 181, 169, 0.14);
            --warn: #cd6f4f;
            --warn-soft: rgba(205, 111, 79, 0.14);
            --warn-line: rgba(205, 111, 79, 0.30);
            --line: rgba(239, 233, 224, 0.09);
            --line-mid: rgba(239, 233, 224, 0.15);
            --line-strong: rgba(239, 233, 224, 0.26);
            --hover: rgba(239, 233, 224, 0.04);
            --display: 'GFS Didot', 'Didot', 'Iowan Old Style', Georgia, serif;
            --ui: 'Commissioner', 'Helvetica Neue', Arial, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 14px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--ui);
            background: var(--screen);
            color: var(--text);
            margin: 0;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-family: var(--display);
            font-weight: 400;
            text-align: center;
            font-size: 34px;
            margin-bottom: 4px;
            letter-spacing: 0.01em;
        }

        .station-subtitle {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 28px;
        }
        .station-subtitle a { color: var(--text-3); text-decoration: none; margin-left: 10px; }

        .stock-panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 20px 22px;
            margin-bottom: 32px;
        }
        .stock-panel-title {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 16px;
        }
        .stock-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .stock-item-btn {
            background: var(--surface-2);
            color: var(--text-2);
            border: 1px solid var(--line-mid);
            border-radius: 100px;
            padding: 11px 18px;
            font-family: var(--ui);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: transform 0.15s var(--ease, ease), border-color 0.15s;
        }
        .stock-item-btn:active { transform: scale(0.96); }
        .stock-item-btn.out {
            background: var(--warn-soft);
            border-color: var(--warn-line);
            color: #f0b39d;
        }
        .stock-item-btn .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--live);
        }
        .stock-item-btn.out .dot { background: var(--warn); }

        .category-section { margin-bottom: 40px; }
        .category-heading {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-count {
            background: var(--accent-soft);
            color: var(--accent);
            font-family: var(--ui);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 100px;
        }

        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .ticket {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            border-radius: var(--r-lg);
            padding: 22px;
        }
        .ticket .table-name {
            margin: 0 0 8px 0;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .ticket h2 {
            font-family: var(--ui);
            font-weight: 700;
            margin: 0 0 8px 0;
            font-size: 30px;
            color: var(--text);
        }
        .ticket p { margin: 6px 0; color: var(--text-3); font-size: 16px; }
        .ticket .extras {
            margin-top: 14px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-line);
            border-radius: var(--r-md);
            padding: 12px 14px;
            color: var(--accent);
            font-size: 17px;
            font-weight: 600;
        }
        .ticket .note {
            margin-top: 14px;
            background: var(--warn-soft);
            border: 1px solid var(--warn-line);
            border-radius: var(--r-md);
            padding: 12px 14px;
            color: #f0b39d;
            font-size: 17px;
            font-style: italic;
            font-weight: 600;
        }

        button {
            font-family: var(--ui);
            margin-top: 18px;
            background: var(--live);
            border: none;
            color: var(--on-accent);
            padding: 14px 22px;
            border-radius: var(--r-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }
        button:disabled {
            background: var(--surface-3);
            color: var(--text-4);
            cursor: default;
        }

        .empty-msg {
            color: var(--text-4);
            font-family: var(--ui);
            font-size: 18px;
            text-align: center;
            padding: 48px 0;
        }
    </style>
</head>
<body>
    <h1>Kitchen Display</h1>
    <div class="station-subtitle" id="stationSubtitle" style="display:none;"></div>

    <div class="stock-panel" id="stockPanel" style="display:none;">
        <div class="stock-panel-title">Stock Status — tap an item if it runs out</div>
        <div class="stock-items" id="stockItems"></div>
    </div>

    <div id="categorySections"></div>

    <script>
       const PDA = "https://katina-bot-1.onrender.com";
       const BASE = "https://katina-bot.onrender.com";
       let previousTicketCount = 0;

       const CATEGORY_LABELS = {
           drinks: "Drinks",
           salads: "Salads",
           burgers: "Burgers",
           other: "Other"
       };
       const CATEGORY_ORDER = ["drinks", "salads", "burgers"];

       const urlParams = new URLSearchParams(window.location.search);
       const stationParam = urlParams.get("station");
       const stationFilter = stationParam
           ? stationParam.split(",").map(s => s.trim().toLowerCase()).filter(Boolean)
           : null;

       function categoryLabel(cat) {
           return CATEGORY_LABELS[cat] || (cat.charAt(0).toUpperCase() + cat.slice(1));
       }

       if (stationFilter) {
           const subtitle = document.getElementById("stationSubtitle");
           subtitle.style.display = "block";
           subtitle.innerHTML = `Station: ${stationParam} <a href="kitchen.html">(view all)</a>`;
       }

       function matchesStation(itemStation) {
           if (!stationFilter) return true;
           return stationFilter.includes((itemStation || "").trim().toLowerCase());
       }

       function playNotificationSound() {
           try {
               const ctx = new (window.AudioContext || window.webkitAudioContext)();
               const oscillator = ctx.createOscillator();
               const gain = ctx.createGain();
               oscillator.connect(gain);
               gain.connect(ctx.destination);
               oscillator.frequency.value = 880;
               gain.gain.setValueAtTime(0.3, ctx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
               oscillator.start();
               oscillator.stop(ctx.currentTime + 0.3);
           } catch (e) {
               console.log("Could not play notification sound", e);
           }
       }

       function escapeHtml(str) {
           if (str === null || str === undefined) return "";
           return String(str)
               .replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;")
               .replace(/'/g, "&#39;");
       }

       function buildTicketHtml(t) {
           return `
               <div class="ticket">
                   <p class="table-name">${escapeHtml(t.table_label || 'Table')}</p>
                   <h2>${t.qty}x ${escapeHtml(t.item)}</h2>
                   ${t.extras ? `<div class="extras">+ ${escapeHtml(t.extras)}</div>` : ""}
                   ${t.note ? `<div class="note">${escapeHtml(t.note)}</div>` : ""}
                   <button onclick="markDone('${t.order_id}', this)">Ready</button>
               </div>
           `;
       }

       function loadTickets() {
           fetch(`${PDA}/kitchen-tickets`)
               .then(r => r.json())
               .then(tickets => {
                   if (stationFilter) {
                       tickets = tickets.filter(t => matchesStation(t.station));
                   }

                   if (tickets.length > previousTicketCount) {
                       playNotificationSound();
                   }
                   previousTicketCount = tickets.length;

                   const container = document.getElementById("categorySections");

                   if (tickets.length === 0) {
                       container.innerHTML = "<p class='empty-msg'>No active tickets.</p>";
                       return;
                   }

                   const byCategory = {};
                   tickets.forEach(t => {
                       const cat = t.category || "other";
                       if (!byCategory[cat]) byCategory[cat] = [];
                       byCategory[cat].push(t);
                   });

                   const allCategories = [
                       ...CATEGORY_ORDER.filter(c => byCategory[c]),
                       ...Object.keys(byCategory).filter(c => !CATEGORY_ORDER.includes(c))
                   ];

                   container.innerHTML = allCategories.map(cat => `
                       <div class="category-section">
                           <div class="category-heading">
                               ${categoryLabel(cat)}
                               <span class="category-count">${byCategory[cat].length}</span>
                           </div>
                           <div class="ticket-list">
                               ${byCategory[cat].map(buildTicketHtml).join("")}
                           </div>
                       </div>
                   `).join("");
               });
       }

        function markDone(orderId, btn) {
            btn.disabled = true;
            btn.innerText = "...";
            fetch(`${PDA}/kitchen-tickets/${orderId}/done`, { method: "POST" })
                .then(() => fetch(`${BASE}/orders/${orderId}/ready`, { method: "POST" }))
                .then(() => loadTickets())
                .catch(() => loadTickets());
        }

        function loadStockPanel() {
            fetch(`${BASE}/menu-items`)
                .then(r => r.json())
                .then(items => {
                    let assigned = (items || []).filter(i => i.kitchen_assigned);
                    if (stationFilter) {
                        assigned = assigned.filter(i => matchesStation(i.kitchen_station));
                    }

                    const panel = document.getElementById("stockPanel");
                    const list = document.getElementById("stockItems");

                    if (!assigned.length) {
                        panel.style.display = "none";
                        return;
                    }

                    panel.style.display = "block";
                    list.innerHTML = assigned.map(item => {
                        const isOut = !!item.kitchen_out;
                        return `
                            <button class="stock-item-btn ${isOut ? 'out' : ''}" onclick="toggleKitchenOut('${item.item_id}', ${isOut ? 0 : 1}, this)">
                                <span class="dot"></span>
                                ${escapeHtml(item.name)} ${isOut ? '— OUT' : ''}
                            </button>
                        `;
                    }).join("");
                });
        }

        function toggleKitchenOut(itemId, out, btn) {
            btn.disabled = true;
            fetch(`${BASE}/menu-items/${itemId}/kitchen-out?out=${out}`, { method: "POST" })
                .then(r => r.json())
                .then(() => {
                    loadStockPanel();
                })
                .catch(() => {
                    btn.disabled = false;
                });
        }

        loadTickets();
        loadStockPanel();
        setInterval(loadTickets, 3000);
        setInterval(loadStockPanel, 5000);

        </script>
</body>
</html>
