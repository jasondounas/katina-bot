<!DOCTYPE html>
<html>
<head>
    <title>Katina — Kitchen</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .ticket {
            background: #2c2c2c;
            border-left: 6px solid #e67e22;
            border-radius: 8px;
            padding: 16px;
        }
        .ticket h2 { margin: 0 0 8px 0; font-size: 28px; }
        .ticket p { margin: 4px 0; color: #ccc; }
        .ticket .extras {
            margin-top: 8px;
            background: #1a2e4d;
            border-left: 3px solid #4a90e2;
            border-radius: 4px;
            padding: 8px 10px;
            color: #a8c8f0;
            font-size: 14px;
        }
        .ticket .note {
            margin-top: 8px;
            background: #3d2e17;
            border-left: 3px solid #f39c12;
            border-radius: 4px;
            padding: 8px 10px;
            color: #ffd699;
            font-size: 14px;
            font-style: italic;
        }
        button {
            margin-top: 10px;
            background: #27ae60;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🔥 Kitchen Display</h1>
    <div class="grid" id="ticketGrid"></div>

    <script>
       const PDA = "https://katina-bot-1.onrender.com";
       let previousTicketCount = 0;

       function playNotificationSound() {
           try {
               const ctx = new (window.AudioContext || window.webkitAudioContext)();
               const oscillator = ctx.createOscillator();
               const gain = ctx.createGain();
               oscillator.connect(gain);
               gain.connect(ctx.destination);
               oscillator.frequency.value = 880;
               gain.gain.setValueAtTime(0.3, ctx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
               oscillator.start();
               oscillator.stop(ctx.currentTime + 0.3);
           } catch (e) {
               console.log("Could not play notification sound", e);
           }
       }

       function escapeHtml(str) {
           if (str === null || str === undefined) return "";
           return String(str)
               .replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;")
               .replace(/'/g, "&#39;");
       }

       function loadTickets() {
    fetch(`${PDA}/kitchen-tickets`)
        .then(r => r.json())
        .then(tickets => {
            if (tickets.length > previousTicketCount) {
                playNotificationSound();
            }
            previousTicketCount = tickets.length;

            const grid = document.getElementById("ticketGrid");
                    grid.innerHTML = tickets.length
                        ? tickets.map(t => `
                            <div class="ticket">
                                <h2>${t.qty}x ${escapeHtml(t.item)}</h2>
                                <p>Order #${t.order_id}</p>
                                ${t.extras ? `<div class="extras">+ ${escapeHtml(t.extras)}</div>` : ""}
                                ${t.note ? `<div class="note">💬 ${escapeHtml(t.note)}</div>` : ""}
                                <button onclick="markDone('${t.order_id}')">✅ Ready</button>
                            </div>
                        `).join("")
                        : "<p style='color:#888;'>No active tickets.</p>";
                });
        }

        function markDone(orderId) {
            fetch(`${PDA}/kitchen-tickets/${orderId}/done`, { method: "POST" })
                .then(() => loadTickets());
        }

        loadTickets();
        setInterval(loadTickets, 3000);  // auto-refresh, same idea as the waiter page

        </script>
</body>
</html>
