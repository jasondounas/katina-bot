<!DOCTYPE html>
<html>
<head>
    <title>Katina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #fff0e0 0%, #f7f5f2 340px, #f7f5f2 100%);
            padding-bottom: 200px;
            color: #1a1a1a;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 28px 24px 20px;
            color: white;
        }
        header .top-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            max-width: 900px; margin: 0 auto;
        }
        header .brand { display: flex; align-items: center; gap: 14px; }
        header .logo {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(255,107,53,0.35);
        }
        header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        header .sub { font-size: 14px; color: #ffb088; margin-top: 3px; font-weight: 600; }
        .lang-toggle {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .hero {
            background: linear-gradient(135deg, #2a9d8f, #1d7d72);
            background-image:
                radial-gradient(circle at 15% 30%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 75% 60%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 45% 80%, rgba(255,255,255,0.06) 2px, transparent 2px),
                linear-gradient(135deg, #2a9d8f, #1d7d72);
            background-size: 40px 40px, 60px 60px, 50px 50px, cover;
            padding: 22px 24px;
            border-radius: 0 0 28px 28px;
            color: white;
            box-shadow: 0 4px 20px rgba(29,125,114,0.25);
        }
        .hero-inner { max-width: 900px; margin: 0 auto; }
        .hero .tagline { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .hero .tagline-sub { font-size: 13px; color: #b8e8e2; font-weight: 500; }

        .container { padding: 24px; max-width: 540px; margin: 0 auto; }

        .missing-session {
            background: white; color: #b9770e;
            padding: 28px 20px; border-radius: 20px; text-align: center;
            font-size: 15px; line-height: 1.6;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            margin-top: 20px;
        }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 24px; font-weight: 800;
            margin: 32px 0 18px;
            letter-spacing: -0.5px;
        }
        .container > .section-title:first-child { margin-top: 4px; }
        .section-title .bar {
            width: 5px; height: 24px; border-radius: 3px;
            background: #ff6b35;
        }
        .section-title.orders .bar { background: #2a9d8f; }

        .menu-grid { display: block; }

        .menu-item {
            background: white;
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .menu-item:active { transform: scale(0.98); }

        .photo-wrap { position: relative; margin-right: 16px; flex-shrink: 0; }
        .item-photo, .item-photo-fallback {
            width: 76px; height: 76px;
            border-radius: 18px;
            object-fit: cover;
        }
        .item-photo-fallback {
            background: linear-gradient(135deg, #fff4e6, #ffe4cc);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        .item-qty-badge {
            position: absolute;
            top: -8px; right: -8px;
            background: #ff6b35;
            color: white;
            font-size: 13px;
            font-weight: 800;
            width: 26px; height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(255,107,53,0.4);
            border: 2px solid white;
        }

        .item-info { flex: 1; min-width: 0; }
        .menu-item .name { font-weight: 700; font-size: 17px; margin-bottom: 3px; }
        .menu-item .description {
            font-size: 12.5px; color: #999; line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .menu-item .price { color: #ff6b35; font-weight: 800; font-size: 16px; }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .qty-row .add-btn {
            background: #1a1a1a; color: white; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.12s, background 0.12s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .qty-row .add-btn:active { transform: scale(0.88); background: #ff6b35; }
        .qty-row .minus-btn {
            background: #f5f5f5; color: #1a1a1a; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: transform 0.12s;
        }
        .qty-row .minus-btn:active { transform: scale(0.88); }
        .qty-row .qty-display {
            display: none;
            font-weight: 800; font-size: 16px;
            min-width: 20px; text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 32px 0;
        }
        .action-buttons button {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .action-buttons button:active { transform: scale(0.96); }
        .call-btn { background: #fff4e6; color: #b9770e; }
        .pay-btn { background: #e6f5f3; color: #1d7d72; }
        .action-buttons button:disabled { background: #f0f0f0; color: #aaa; transform: none; }

        .order-status {
            background: white; border-radius: 18px; padding: 16px 18px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }
        .order-status .item-name { font-weight: 700; font-size: 15px; }
        .pill { font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 20px; }
        .pill.PENDING_REVIEW { background: #fff4e6; color: #b9770e; }
        .pill.APPROVED { background: #e6f5f3; color: #1d7d72; }
        .pill.REJECTED { background: #fce8e6; color: #c0392b; }
        .pill.CANCELLED { background: #f0f0f0; color: #888; }

        .empty-orders { color: #bbb; font-size: 15px; text-align: center; padding: 24px; }

        .cart-bar {
            position: fixed;
            bottom: 20px; left: 16px; right: 16px;
            max-width: 508px; margin: 0 auto;
            background: #1a1a1a;
            color: white;
            padding: 20px 26px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(0,0,0,0.28);
            transition: transform 0.15s;
        }
        .cart-bar:active { transform: scale(0.97); }
        .cart-bar.empty { display: none; }
        .cart-bar .count {
            background: #ff6b35;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800;
            margin-right: 12px;
        }
        .cart-bar .left { display: flex; align-items: center; font-size: 16px; font-weight: 700; }
        .cart-bar .arrow { font-size: 20px; }

        .overlay {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            align-items: flex-end;
            justify-content: center;
            z-index: 20;
        }
        .sheet {
            background: white;
            border-radius: 28px 28px 0 0;
            padding: 28px;
            width: 100%;
            max-width: 540px;
            max-height: 82vh;
            overflow-y: auto;
        }
        .sheet-handle {
            width: 44px; height: 5px;
            background: #ddd;
            border-radius: 4px;
            margin: 0 auto 20px;
        }
        .sheet h2 { font-size: 24px; margin-bottom: 20px; font-weight: 800; }
        .cart-line {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid #f2f2f2;
        }
        .cart-line .item-name { font-weight: 700; font-size: 16px; }
        .qty-controls { display: flex; align-items: center; gap: 14px; }
        .qty-controls button {
            background: #f5f5f5; border: none; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; font-size: 18px; font-weight: 800;
        }
        .qty-controls .qty-num { font-weight: 800; min-width: 20px; text-align: center; font-size: 16px; }
        .submit-btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white; border: none;
            padding: 20px; border-radius: 18px; width: 100%;
            font-size: 17px; font-weight: 800; margin-top: 24px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255,107,53,0.35);
        }
        .submit-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
        .close-sheet {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 26px; color: #bbb;
        }
        .sheet-content { position: relative; }

        @media (min-width: 700px) {
            .container { max-width: 900px; }
            .cart-bar { max-width: 500px; left: auto; right: 40px; }

            .menu-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 18px;
            }
            .menu-item {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                padding: 16px;
            }
            .photo-wrap { width: 100%; margin-right: 0; margin-bottom: 14px; }
            .item-photo, .item-photo-fallback {
                width: 100%;
                height: 150px;
                border-radius: 16px;
            }
            .item-photo-fallback { font-size: 44px; }
            .item-info { width: 100%; margin-bottom: 12px; }
            .menu-item .description { -webkit-line-clamp: 3; }
            .qty-row { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div class="brand">
                <div class="logo">🍽️</div>
                <div>
                    <h1>Katina</h1>
                    <div class="sub" id="tableLabel">...</div>
                </div>
            </div>
            <button class="lang-toggle" onclick="toggleLang()" id="langToggle">🇬🇷 EN</button>
        </div>
    </header>

    <div class="hero">
        <div class="hero-inner">
            <div class="tagline" id="heroTagline"></div>
            <div class="tagline-sub" id="heroSub"></div>
        </div>
    </div>

    <div class="container" id="app">
        <p style="text-align:center; color:#999; margin-top:40px;" id="loadingText">Loading...</p>
    </div>

    <div class="cart-bar empty" id="cartBar" onclick="openCartSheet()">
        <div class="left">
            <div class="count" id="cartCount">0</div>
            <span id="cartSummary"></span>
        </div>
        <span class="arrow">→</span>
    </div>

    <div class="overlay" id="overlay">
        <div class="sheet">
            <div class="sheet-content">
                <span class="close-sheet" onclick="closeCartSheet()">✕</span>
                <div class="sheet-handle"></div>
                <h2 id="cartTitle"></h2>
                <div id="cartLines"></div>
                <button class="submit-btn" id="submitBtnMain" onclick="submitCart()"></button>
            </div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        const params = new URLSearchParams(window.location.search);
        const tableId = params.get("table");

        let sessionId = null;
        let menu = {};
        let cart = {};

        // ---------- Language ----------
        const T = {
            en: {
                loading: "Loading...",
                noTable: "No table found in the link.<br>Please scan the QR code on your table.",
                noTableLinked: "No table linked",
                table: "Table",
                welcomeStaff: "👋 Welcome! A member of staff will be with you shortly to get you started.",
                menuLoadError: "Couldn't load the menu right now. Please try refreshing.",
                menuEmpty: "The menu is empty right now.",
                menuTitle: "Menu",
                callWaiter: "🔔 Call Waiter",
                waiterNotified: "🔔 Waiter notified",
                requestBill: "💳 Request the Bill",
                billRequested: "💳 Bill requested",
                yourOrders: "Your Orders",
                noOrdersYet: "No orders yet.",
                viewCart: "View cart",
                yourCart: "Your Cart",
                cartEmpty: "Your cart is empty.",
                sendOrder: "Send Order to Waiter",
                sending: "Sending...",
                somethingWrong: "Something went wrong — please try again.",
                heroTitle: "What are you craving today?",
                heroSub: "Fresh picks, made to order, straight to your table",
                pillStatus: { PENDING_REVIEW: "PENDING REVIEW", APPROVED: "APPROVED", REJECTED: "REJECTED", CANCELLED: "CANCELLED" }
            },
            gr: {
                loading: "Φόρτωση...",
                noTable: "Δεν βρέθηκε τραπέζι στον σύνδεσμο.<br>Παρακαλώ σκανάρετε το QR στο τραπέζι σας.",
                noTableLinked: "Δεν έχει συνδεθεί τραπέζι",
                table: "Τραπέζι",
                welcomeStaff: "👋 Καλωσήρθατε! Ένας υπάλληλος θα έρθει σύντομα να σας εξυπηρετήσει.",
                menuLoadError: "Δεν ήταν δυνατή η φόρτωση του μενού. Δοκιμάστε ξανά.",
                menuEmpty: "Το μενού είναι άδειο αυτή τη στιγμή.",
                menuTitle: "Μενού",
                callWaiter: "🔔 Κάλεσε Σερβιτόρο",
                waiterNotified: "🔔 Ο σερβιτόρος ειδοποιήθηκε",
                requestBill: "💳 Ζήτα τον Λογαριασμό",
                billRequested: "💳 Ζητήθηκε ο λογαριασμός",
                yourOrders: "Οι Παραγγελίες σας",
                noOrdersYet: "Δεν υπάρχουν παραγγελίες ακόμα.",
                viewCart: "Δες το καλάθι",
                yourCart: "Το Καλάθι σας",
                cartEmpty: "Το καλάθι σας είναι άδειο.",
                sendOrder: "Στείλε Παραγγελία",
                sending: "Αποστολή...",
                somethingWrong: "Κάτι πήγε στραβά — δοκιμάστε ξανά.",
                heroTitle: "Τι λαχταράτε σήμερα;",
                heroSub: "Φρέσκες επιλογές, φτιαγμένες κατόπιν παραγγελίας",
                pillStatus: { PENDING_REVIEW: "ΣΕ ΑΝΑΜΟΝΗ", APPROVED: "ΕΓΚΡΙΘΗΚΕ", REJECTED: "ΑΠΟΡΡΙΦΘΗΚΕ", CANCELLED: "ΑΚΥΡΩΘΗΚΕ" }
            }
        };

        function getLang() {
            return localStorage.getItem("katinaLang") || "gr";
        }

        function toggleLang() {
            const newLang = getLang() === "gr" ? "en" : "gr";
            localStorage.setItem("katinaLang", newLang);
            applyStaticText();
            if (menu && Object.keys(menu).length) renderMenu();
            if (sessionId) loadMyOrders();
        }

        function t(key) {
            return T[getLang()][key];
        }

        function applyStaticText() {
            const lang = getLang();
            document.getElementById("langToggle").innerText = lang === "gr" ? "🇬🇧 EN" : "🇬🇷 GR";
            document.getElementById("heroTagline").innerText = t("heroTitle");
            document.getElementById("heroSub").innerText = t("heroSub");
            document.getElementById("cartTitle").innerText = t("yourCart");
            document.getElementById("submitBtnMain").innerText = t("sendOrder");
            document.getElementById("cartSummary").innerText = t("viewCart");
            document.getElementById("loadingText").innerText = t("loading");
        }

        function getPrice(item) {
            const data = menu[item];
            return typeof data === "object" ? data.price : data;
        }
        function getImage(item) {
            const data = menu[item];
            return typeof data === "object" ? data.image : null;
        }
        function getDescription(item) {
            const data = menu[item];
            return typeof data === "object" ? data.description : null;
        }

        function generateIdempotencyKey() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return "key_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function init() {
            applyStaticText();
            if (!tableId) {
                document.getElementById("app").innerHTML = `<div class="missing-session">${t("noTable")}</div>`;
                document.getElementById("tableLabel").innerText = t("noTableLinked");
                return;
            }
            document.getElementById("tableLabel").innerText = t("table") + " " + tableId;
            checkForSession();
        }

        function checkForSession() {
            fetch(`${BASE}/tables/${tableId}/active-session`)
                .then(r => r.json())
                .then(data => {
                    if (!data.active) {
                        document.getElementById("app").innerHTML = `<div class="missing-session">${t("welcomeStaff")}</div>`;
                        setTimeout(checkForSession, 4000);
                        return;
                    }

                    sessionId = data.session_id;
                    loadMenu();
                    loadMyOrders();
                    setInterval(loadMyOrders, 5000);
                });
        }

        function loadMenu() {
            fetch(`${BASE}/menu`)
                .then(r => r.json())
                .then(data => {
                    menu = data;
                    renderMenu();
                })
                .catch(() => {
                    document.getElementById("app").innerHTML = `<div class="missing-session">${t("menuLoadError")}</div>`;
                });
        }

        function renderMenu() {
            const app = document.getElementById("app");
            const items = Object.keys(menu);

            if (items.length === 0) {
                app.innerHTML = `<div class="missing-session">${t("menuEmpty")}</div>`;
                return;
            }

            let itemsHtml = "";
            items.forEach(item => {
                const price = getPrice(item);
                const image = getImage(item);
                const description = getDescription(item);
                const imageHtml = image
                    ? `<img src="${escapeHtml(image)}" class="item-photo" onerror="this.outerHTML='<div class=\\'item-photo-fallback\\'>🍽️</div>'">`
                    : `<div class="item-photo-fallback">🍽️</div>`;
                const descriptionHtml = description
                    ? `<div class="description">${escapeHtml(description)}</div>`
                    : "";
                itemsHtml += `
                    <div class="menu-item">
                        <div class="photo-wrap">
                            ${imageHtml}
                            <span class="item-qty-badge" id="badge-${item}"></span>
                        </div>
                        <div class="item-info">
                            <div class="name">${escapeHtml(capitalize(item))}</div>
                            ${descriptionHtml}
                            <div class="price">€${Number(price).toFixed(2)}</div>
                        </div>
                        <div class="qty-row" id="qtyrow-${item}">
                            <button class="minus-btn" id="minus-${item}" onclick="changeQty('${item}', -1)">−</button>
                            <span class="qty-display" id="qtydisplay-${item}"></span>
                            <button class="add-btn" onclick="addToCart('${item}')">+</button>
                        </div>
                    </div>
                `;
            });

            app.innerHTML = `
                <div class="section-title"><span class="bar"></span>${t("menuTitle")}</div>
                <div class="menu-grid">${itemsHtml}</div>
                <div class="action-buttons">
                    <button class="call-btn" id="callBtn" onclick="callWaiter()">${t("callWaiter")}</button>
                    <button class="pay-btn" id="payBtn" onclick="requestPayment()">${t("requestBill")}</button>
                </div>
                <div class="section-title orders"><span class="bar"></span>${t("yourOrders")}</div>
                <div id="ordersList"><p class="empty-orders">${t("noOrdersYet")}</p></div>
            `;
            updateItemBadges();
        }

        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function callWaiter() {
            const btn = document.getElementById("callBtn");
            btn.disabled = true;
            btn.innerText = t("waiterNotified");
            fetch(`${BASE}/sessions/${sessionId}/call-waiter`, { method: "POST" });
        }

        function requestPayment() {
            const btn = document.getElementById("payBtn");
            btn.disabled = true;
            btn.innerText = t("billRequested");
            fetch(`${BASE}/sessions/${sessionId}/request-payment`, { method: "POST" });
        }

        function addToCart(item) {
            cart[item] = (cart[item] || 0) + 1;
            updateCartBar();
            updateItemBadges();
        }

        function changeQty(item, delta) {
            cart[item] = (cart[item] || 0) + delta;
            if (cart[item] <= 0) delete cart[item];
            updateCartBar();
            updateItemBadges();
            renderCartSheet();
        }

        function updateItemBadges() {
            Object.keys(menu).forEach(item => {
                const qty = cart[item] || 0;

                const badge = document.getElementById(`badge-${item}`);
                if (badge) {
                    if (qty > 0) {
                        badge.innerText = qty;
                        badge.style.display = "flex";
                    } else {
                        badge.style.display = "none";
                    }
                }

                const minusBtn = document.getElementById(`minus-${item}`);
                const qtyDisplay = document.getElementById(`qtydisplay-${item}`);
                if (minusBtn && qtyDisplay) {
                    if (qty > 0) {
                        minusBtn.style.display = "flex";
                        qtyDisplay.style.display = "block";
                        qtyDisplay.innerText = qty;
                    } else {
                        minusBtn.style.display = "none";
                        qtyDisplay.style.display = "none";
                    }
                }
            });
        }

        function updateCartBar() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            const bar = document.getElementById("cartBar");
            if (totalItems === 0) {
                bar.classList.add("empty");
            } else {
                bar.classList.remove("empty");
                document.getElementById("cartCount").innerText = totalItems;
                document.getElementById("cartSummary").innerText = t("viewCart");
            }
        }

        function openCartSheet() {
            renderCartSheet();
            document.getElementById("overlay").style.display = "flex";
        }
        function closeCartSheet() {
            document.getElementById("overlay").style.display = "none";
        }

        function renderCartSheet() {
            const div = document.getElementById("cartLines");
            const items = Object.keys(cart);
            div.innerHTML = items.length
                ? items.map(item => `
                    <div class="cart-line">
                        <span class="item-name">${escapeHtml(capitalize(item))}</span>
                        <span class="qty-controls">
                            <button onclick="changeQty('${item}', -1)">−</button>
                            <span class="qty-num">${cart[item]}</span>
                            <button onclick="changeQty('${item}', 1)">+</button>
                        </span>
                    </div>
                `).join("")
                : `<p style='color:#999; padding:24px 0;'>${t("cartEmpty")}</p>`;
        }

        function submitCart() {
            const items = Object.keys(cart);
            if (items.length === 0) return alert(t("cartEmpty"));

            const submitBtn = document.getElementById("submitBtnMain");
            submitBtn.disabled = true;
            submitBtn.innerText = t("sending");

            const requests = items.map(item => {
                const key = generateIdempotencyKey();
                return fetch(`${BASE}/orders?session_id=${sessionId}&item=${item}&qty=${cart[item]}&idempotency_key=${key}`, { method: "POST" })
                    .then(r => r.json());
            });

            Promise.all(requests).then(() => {
                cart = {};
                updateCartBar();
                updateItemBadges();
                closeCartSheet();
                loadMyOrders();
                submitBtn.disabled = false;
                submitBtn.innerText = t("sendOrder");
            }).catch(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = t("sendOrder");
                alert(t("somethingWrong"));
            });
        }

        function loadMyOrders() {
            if (!sessionId) return;
            fetch(`${BASE}/sessions/${sessionId}/orders`)
                .then(r => r.json())
                .then(orders => {
                    const div = document.getElementById("ordersList");
                    if (!div) return;
                    const statusMap = t("pillStatus");
                    div.innerHTML = orders.length
                        ? orders.map(o => `
                            <div class="order-status">
                                <span class="item-name">${o.qty}x ${escapeHtml(capitalize(o.item))}</span>
                                <span class="pill ${o.status}">${statusMap[o.status] || o.status}</span>
                            </div>
                        `).join("")
                        : `<p class='empty-orders'>${t("noOrdersYet")}</p>`;
                });
        }

        init();
    </script>
</body>
</html>
