<!DOCTYPE html>
<html>
<head>
    <title>Katina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Commissioner:wght@300..700&family=GFS+Didot&display=swap');

        :root {
            --screen: #f7f6f2;
            --surface: #fdfcfa;
            --surface-2: #f1efe9;
            --text: #1a1714;
            --text-2: #453d33;
            --text-3: #6e6558;
            --text-4: #8a8071;
            --accent: #8f6210;
            --accent-hover: #7a5309;
            --on-accent: #ffffff;
            --accent-soft: rgba(143, 98, 16, 0.10);
            --accent-line: rgba(143, 98, 16, 0.34);
            --live: #1f6f63;
            --live-soft: rgba(31, 111, 99, 0.11);
            --warn: #9e3f1f;
            --warn-soft: rgba(158, 63, 31, 0.10);
            --warn-line: rgba(158, 63, 31, 0.32);
            --line: rgba(26, 23, 20, 0.13);
            --line-mid: rgba(26, 23, 20, 0.16);
            --hover: rgba(26, 23, 20, 0.04);
            --card-shadow: 0 1px 2px rgba(26, 23, 20, 0.04), 0 8px 22px rgba(26, 23, 20, 0.06);
            --screen-wash: radial-gradient(140% 55% at 50% 0%, rgba(143, 98, 16, 0.06), transparent 60%);

            --d-bg: #221e19;
            --d-bg-2: #2d2620;
            --d-text: #f6f3ed;
            --d-text-3: #9c9082;
            --d-accent: #d9a75b;
            --d-hover: rgba(239, 233, 224, 0.07);

            --display: 'GFS Didot', 'Didot', 'Iowan Old Style', Georgia, serif;
            --ui: 'Commissioner', 'Helvetica Neue', Arial, sans-serif;

            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 14px;
            --r-sheet: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--ui);
            background: var(--screen-wash), var(--screen);
            padding-bottom: 200px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .spinner {
            width: 22px; height: 22px;
            border: 3px solid rgba(26,23,20,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        .spinner.light { border-color: rgba(255,255,255,0.25); border-top-color: white; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-block {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 60px 20px; color: var(--text-4); font-size: 14px;
        }

        header {
            background: linear-gradient(135deg, var(--d-bg), var(--d-bg-2));
            padding: 28px 24px 20px;
            color: var(--d-text);
        }
        header .brand {
            display: flex; align-items: center; gap: 14px;
            max-width: 900px; margin: 0 auto;
            justify-content: space-between;
        }
        header .brand-left { display: flex; align-items: center; gap: 14px; }
        header .logo {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, var(--d-accent), #e5b568);
            border-radius: var(--r-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(217,167,91,0.3);
        }
        header h1 { font-family: var(--display); font-weight: 400; font-size: 26px; }
        header .sub { font-size: 13px; color: var(--d-accent); margin-top: 3px; font-weight: 600; font-family: var(--ui); }
        .lang-btn {
            background: var(--d-hover);
            border: none;
            color: var(--d-text);
            padding: 10px 16px;
            border-radius: var(--r-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            font-family: var(--ui);
        }

        .hero {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            padding: 22px 24px;
            border-radius: 0 0 var(--r-sheet) var(--r-sheet);
            color: white;
            box-shadow: 0 4px 20px rgba(143,98,16,0.2);
        }
        .hero-inner { max-width: 900px; margin: 0 auto; }
        .hero .tagline { font-family: var(--display); font-weight: 400; font-size: 21px; margin-bottom: 4px; }
        .hero .tagline-sub { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 500; }

        .menu-toolbar {
            position: sticky;
            top: 0;
            z-index: 15;
            background: var(--screen);
            padding: 14px 24px 0;
        }
        .search-bar {
            position: relative;
            margin-bottom: 12px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            font-size: 14px;
            font-family: var(--ui);
            box-shadow: var(--card-shadow);
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent-line);
        }
        .search-bar .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: 0.5;
            pointer-events: none;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 14px;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-tab {
            flex-shrink: 0;
            background: var(--surface);
            color: var(--text-3);
            border: 1px solid var(--line);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: background 0.15s, color 0.15s;
            font-family: var(--ui);
        }
        .category-tab.active {
            background: var(--text);
            color: var(--on-accent);
            border-color: var(--text);
        }

        .quick-call-btn {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 16;
            background: var(--text);
            color: white;
            border: none;
            width: 56px; height: 56px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(26,23,20,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quick-call-btn:active { transform: translateY(-50%) scale(0.92); }

        .container { padding: 24px; max-width: 540px; margin: 0 auto; }

        .missing-session {
            background: var(--surface); color: var(--accent);
            padding: 28px 20px; border-radius: var(--r-sheet); text-align: center;
            font-size: 15px; line-height: 1.6;
            box-shadow: var(--card-shadow);
            margin-top: 20px;
        }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--display);
            font-weight: 400;
            font-size: 24px;
            margin: 32px 0 18px;
            scroll-margin-top: 100px;
        }
        .container > .section-title:first-child {
            margin-top: 4px;
        }
        .section-title .bar {
            width: 4px; height: 22px; border-radius: 3px;
            background: var(--accent);
        }
        .section-title.orders .bar { background: var(--live); }
        .section-title.category .bar { background: var(--accent); }

        .bill-total {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
        }
        .bill-total .label { font-size: 14px; color: var(--text-3); font-weight: 600; }
        .bill-total .amount { font-size: 22px; font-weight: 700; color: var(--accent); }

        .menu-grid { display: block; margin-bottom: 8px; }

        .menu-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-sheet);
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            box-shadow: var(--card-shadow);
            transition: transform 0.15s;
        }
        .menu-item:active { transform: scale(0.98); }

        .photo-wrap { position: relative; margin-right: 16px; flex-shrink: 0; }
        .item-photo, .item-photo-fallback {
            width: 76px; height: 76px;
            border-radius: var(--r-lg);
            object-fit: cover;
        }
        .item-photo-fallback {
            background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        .item-qty-badge {
            position: absolute;
            top: -8px; right: -8px;
            background: var(--accent);
            color: white;
            font-size: 13px;
            font-weight: 700;
            width: 26px; height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(143,98,16,0.4);
            border: 2px solid white;
        }

        .item-info { flex: 1; min-width: 0; }
        .menu-item .name { font-weight: 700; font-size: 17px; margin-bottom: 3px; color: var(--text); }
        .menu-item .description {
            font-size: 12.5px; color: var(--text-4); line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .menu-item .price { color: var(--accent); font-weight: 700; font-size: 16px; }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .qty-row .add-btn {
            background: var(--text); color: white; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.12s, background 0.12s;
            box-shadow: 0 4px 10px rgba(26,23,20,0.15);
        }
        .qty-row .add-btn:active { transform: scale(0.88); background: var(--accent); }
        .qty-row .minus-btn {
            background: var(--surface-2); color: var(--text); border: none;
            width: 42px; height: 42px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: transform 0.12s;
        }
        .qty-row .minus-btn:active { transform: scale(0.88); }
        .qty-row .qty-display {
            display: none;
            font-weight: 700; font-size: 16px;
            min-width: 20px; text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 32px 0;
        }
        .action-buttons button {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: var(--r-lg);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
            font-family: var(--ui);
        }
        .action-buttons button:active { transform: scale(0.96); }
        .call-btn { background: var(--accent-soft); color: var(--accent); }
        .pay-btn { background: var(--live-soft); color: var(--live); }
        .action-buttons button:disabled { background: var(--surface-2); color: var(--text-4); transform: none; }

        .order-status {
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--card-shadow);
        }
        .order-status .item-name { font-weight: 700; font-size: 15px; color: var(--text); }
        .order-status .item-note { font-size: 12px; color: var(--text-4); font-style: italic; margin-top: 2px; }
        .order-status .item-extras { font-size: 12px; color: var(--accent); margin-top: 2px; }
        .order-status .item-ready { font-size: 12.5px; color: var(--live); font-weight: 700; margin-top: 3px; }
        .pill { font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; flex-shrink: 0; margin-left: 10px; }
        .pill.PENDING_REVIEW { background: var(--surface-2); color: var(--text-3); }
        .pill.APPROVED { background: var(--accent-soft); color: var(--accent); }
        .pill.READY { background: var(--live-soft); color: var(--live); }
        .pill.REJECTED { background: var(--warn-soft); color: var(--warn); }
        .pill.CANCELLED { background: var(--surface-2); color: var(--text-4); }

        .empty-orders { color: var(--text-4); font-size: 15px; text-align: center; padding: 24px; }

        .cart-bar {
            position: fixed;
            bottom: 20px; left: 16px; right: 16px;
            max-width: 508px; margin: 0 auto;
            background: var(--text);
            color: white;
            padding: 20px 26px;
            border-radius: var(--r-sheet);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(26,23,20,0.28);
            transition: transform 0.15s;
        }
        .cart-bar:active { transform: scale(0.97); }
        .cart-bar.empty { display: none; }
        .cart-bar .count {
            background: var(--accent);
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700;
            margin-right: 12px;
        }
        .cart-bar .left { display: flex; align-items: center; font-size: 16px; font-weight: 700; }
        .cart-bar .right { display: flex; align-items: center; gap: 10px; }
        .cart-bar .total { font-size: 17px; font-weight: 700; }
        .cart-bar .arrow { font-size: 20px; }

        .overlay {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20,17,14,0.5);
            align-items: flex-end;
            justify-content: center;
            z-index: 20;
        }
        .sheet {
            background: var(--surface);
            border-radius: var(--r-sheet) var(--r-sheet) 0 0;
            padding: 28px;
            width: 100%;
            max-width: 540px;
            max-height: 82vh;
            overflow-y: auto;
            box-shadow: 0 -22px 60px rgba(26,23,20,0.18);
        }
        .sheet-handle {
            width: 44px; height: 5px;
            background: var(--line-mid);
            border-radius: 4px;
            margin: 0 auto 20px;
        }
        .sheet h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin-bottom: 20px; color: var(--text); }
        .cart-line {
            padding: 14px 0; border-bottom: 1px solid var(--line);
        }
        .cart-line-top {
            display: flex; justify-content: space-between; align-items: center;
        }
        .cart-line .item-name { font-weight: 700; font-size: 16px; color: var(--text); }
        .qty-controls { display: flex; align-items: center; gap: 14px; }
        .qty-controls button {
            background: var(--surface-2); border: none; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; font-size: 18px; font-weight: 700; color: var(--text);
        }
        .qty-controls .qty-num { font-weight: 700; min-width: 20px; text-align: center; font-size: 16px; }
        .note-input {
            width: 100%;
            margin-top: 10px;
            padding: 10px 12px;
            border: 1.5px solid var(--line);
            border-radius: var(--r-md);
            font-size: 13px;
            font-family: var(--ui);
        }
        .note-input:focus {
            outline: none;
            border-color: var(--accent-line);
        }
        .extras-picker {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .extra-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-3);
            cursor: pointer;
        }
        .extra-option input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }
        .cart-total-row {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 0;
        }
        .cart-total-row .label { color: var(--text-3); font-weight: 600; font-size: 14px; }
        .cart-total-row .amount { color: var(--accent); font-weight: 700; font-size: 18px; }
        .submit-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white; border: none;
            padding: 20px; border-radius: var(--r-lg); width: 100%;
            font-size: 17px; font-weight: 700; margin-top: 24px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(143,98,16,0.3);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: var(--ui);
        }
        .submit-btn:disabled { background: var(--surface-2); color: var(--text-4); box-shadow: none; cursor: default; }
        .close-sheet {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 26px; color: var(--text-4);
        }
        .sheet-content { position: relative; }

        @media (min-width: 700px) {
            .container { max-width: 900px; }
            .cart-bar { max-width: 500px; left: auto; right: 40px; }

            .menu-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 18px;
            }
            .menu-item {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                padding: 16px;
            }
            .photo-wrap { width: 100%; margin-right: 0; margin-bottom: 14px; }
            .item-photo, .item-photo-fallback {
                width: 100%;
                height: 150px;
                border-radius: var(--r-lg);
            }
            .item-photo-fallback { font-size: 44px; }
            .item-info { width: 100%; margin-bottom: 12px; }
            .menu-item .description { -webkit-line-clamp: 3; }
            .qty-row { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-left">
                <div class="logo">🍽️</div>
                <div>
                    <h1>Katina</h1>
                    <div class="sub" id="tableLabel">Loading table...</div>
                </div>
            </div>
            <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
        </div>
    </header>

    <div class="hero">
        <div class="hero-inner">
            <div class="tagline" id="taglineText">What are you craving today?</div>
            <div class="tagline-sub" id="taglineSubText">Fresh picks, made to order, straight to your table</div>
        </div>
    </div>

    <div class="menu-toolbar">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search menu..." oninput="handleSearchInput(this.value)">
        </div>
        <div class="category-tabs" id="categoryTabs"></div>
    </div>

    <button class="quick-call-btn" onclick="scrollToActions()">🔔</button>

    <div class="container" id="app">
        <div class="loading-block"><div class="spinner"></div></div>
    </div>

    <div class="cart-bar empty" id="cartBar" onclick="openCartSheet()">
        <div class="left">
            <div class="count" id="cartCount">0</div>
            <span id="cartSummary">View cart</span>
        </div>
        <div class="right">
            <span class="total" id="cartBarTotal"></span>
            <span class="arrow">→</span>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="sheet">
            <div class="sheet-content">
                <span class="close-sheet" onclick="closeCartSheet()">✕</span>
                <div class="sheet-handle"></div>
                <h2 id="cartTitle">Your Cart</h2>
                <div id="cartLines"></div>
                <div class="cart-total-row" id="cartTotalRow">
                    <span class="label" id="cartTotalLabel">Total</span>
                    <span class="amount" id="cartTotalAmount">€0.00</span>
                </div>
                <button class="submit-btn" id="submitBtn" onclick="submitCart()">Send Order to Waiter</button>
            </div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        const params = new URLSearchParams(window.location.search);
        const tableId = params.get("table");

        let sessionId = null;
        let menu = {};
        let cart = {};
        let cartNotes = {};
        let cartExtras = {};
        let searchTerm = "";

        let currentLang = localStorage.getItem("katinaLang") || "gr";

        const T = {
            gr: {
                loading_table: "Φόρτωση τραπεζιού...",
                no_table_linked: "Δεν βρέθηκε τραπέζι",
                table_label: (id) => `Τραπέζι ${id}`,
                no_table_msg: "Δεν βρέθηκε τραπέζι στον σύνδεσμο.<br>Παρακαλώ σαρώστε τον κωδικό QR στο τραπέζι σας.",
                welcome_msg: "👋 Καλωσήρθατε! Ένα μέλος του προσωπικού θα έρθει σύντομα να σας εξυπηρετήσει.",
                menu_load_error: "Δεν ήταν δυνατή η φόρτωση του μενού αυτή τη στιγμή. Παρακαλώ δοκιμάστε ξανά.",
                empty_menu: "Το μενού είναι άδειο αυτή τη στιγμή.",
                tagline: "Τι λαχταράτε σήμερα;",
                tagline_sub: "Φρέσκες επιλογές, φτιαγμένες κατά παραγγελία, στο τραπέζι σας",
                search_placeholder: "Αναζήτηση στο μενού...",
                search_results_heading: "Αποτελέσματα Αναζήτησης",
                no_search_results: "Δεν βρέθηκαν προϊόντα.",
                call_waiter_btn: "🔔 Κλήση Σερβιτόρου",
                waiter_notified: "🔔 Ο σερβιτόρος ειδοποιήθηκε",
                request_bill_btn: "💳 Πληρωμή",
                bill_requested: "💳 Ζητήθηκε ο λογαριασμός",
                your_orders: "Οι Παραγγελίες σας",
                bill_so_far: "Λογαριασμός μέχρι τώρα",
                no_orders: "Δεν υπάρχουν παραγγελίες ακόμα.",
                your_cart: "Το Καλάθι σας",
                cart_empty: "Το καλάθι σας είναι άδειο.",
                cart_total_label: "Σύνολο",
                note_placeholder: "Σχόλιο",
                send_order: "Αποστολή Παραγγελίας στον Σερβιτόρο",
                sending: "Αποστολή...",
                send_error: "Κάτι πήγε στραβά — παρακαλώ δοκιμάστε ξανά.",
                add_cart_first: "Προσθέστε κάτι στο καλάθι σας πρώτα.",
                view_cart: "Προβολή καλαθιού",
                ready_now: "✅ Έτοιμο!",
                status_labels: { PENDING_REVIEW: "ΕΚΚΡΕΜΕΙ", APPROVED: "ΕΓΚΡΙΘΗΚΕ", READY: "ΕΤΟΙΜΟ", REJECTED: "ΑΠΟΡΡΙΦΘΗΚΕ", CANCELLED: "ΑΚΥΡΩΘΗΚΕ" },
                category_labels: { drinks: "🥤 Ποτά", salads: "🥗 Σαλάτες", burgers: "🍔 Μπέργκερ", other: "🍽️ Άλλα" }
            },
            en: {
                loading_table: "Loading table...",
                no_table_linked: "No table linked",
                table_label: (id) => `Table ${id}`,
                no_table_msg: "No table found in the link.<br>Please scan the QR code on your table.",
                welcome_msg: "👋 Welcome! A member of staff will be with you shortly to get you started.",
                menu_load_error: "Couldn't load the menu right now. Please try refreshing.",
                empty_menu: "The menu is empty right now.",
                tagline: "What are you craving today?",
                tagline_sub: "Fresh picks, made to order, straight to your table",
                search_placeholder: "Search menu...",
                search_results_heading: "Search Results",
                no_search_results: "No items found.",
                call_waiter_btn: "🔔 Call Waiter",
                waiter_notified: "🔔 Waiter notified",
                request_bill_btn: "💳 Request the Bill",
                bill_requested: "💳 Bill requested",
                your_orders: "Your Orders",
                bill_so_far: "Bill so far",
                no_orders: "No orders yet.",
                your_cart: "Your Cart",
                cart_empty: "Your cart is empty.",
                cart_total_label: "Total",
                note_placeholder: "Add a note",
                send_order: "Send Order to Waiter",
                sending: "Sending...",
                send_error: "Something went wrong — please try again.",
                add_cart_first: "Add something to your cart first.",
                view_cart: "View cart",
                ready_now: "✅ Ready!",
                status_labels: { PENDING_REVIEW: "PENDING REVIEW", APPROVED: "APPROVED", READY: "READY", REJECTED: "REJECTED", CANCELLED: "CANCELLED" },
                category_labels: { drinks: "🥤 Drinks", salads: "🥗 Salads", burgers: "🍔 Burgers", other: "🍽️ More" }
            }
        };

        function t(key, ...args) {
            const val = T[currentLang][key];
            return typeof val === "function" ? val(...args) : val;
        }

        function toggleLang() {
            currentLang = currentLang === "gr" ? "en" : "gr";
            localStorage.setItem("katinaLang", currentLang);
            applyStaticText();
            if (Object.keys(menu).length > 0) renderMenu();
            loadMyOrders();
        }

        function applyStaticText() {
            document.getElementById("langBtn").innerText = currentLang === "gr" ? "EN" : "GR";
            document.getElementById("taglineText").innerText = t("tagline");
            document.getElementById("taglineSubText").innerText = t("tagline_sub");
            document.getElementById("cartTitle").innerText = t("your_cart");
            document.getElementById("submitBtn").innerText = t("send_order");
            document.getElementById("cartTotalLabel").innerText = t("cart_total_label");
            document.getElementById("searchInput").placeholder = t("search_placeholder");
            if (!tableId) {
                document.getElementById("tableLabel").innerText = t("no_table_linked");
            } else if (document.getElementById("tableLabel").dataset.hasTable) {
                document.getElementById("tableLabel").innerText = t("table_label", tableId);
            }
        }

        function categoryLabel(cat) {
            return t("category_labels")[cat] || capitalize(cat);
        }

        function getPrice(item) {
            const data = menu[item];
            return typeof data === "object" ? data.price : data;
        }
        function getImage(item) {
            const data = menu[item];
            return typeof data === "object" ? data.image : null;
        }
        function getDescription(item) {
            const data = menu[item];
            return typeof data === "object" ? data.description : null;
        }
        function getCategory(item) {
            const data = menu[item];
            return (typeof data === "object" && data.category) ? data.category : "other";
        }
        function getExtras(item) {
            const data = menu[item];
            return (typeof data === "object" && Array.isArray(data.extras)) ? data.extras : [];
        }
        function getExtraPrice(item, extraName) {
            const found = getExtras(item).find(e => e.name === extraName);
            return found ? Number(found.price) : 0;
        }

        function calcItemUnitPrice(item) {
            const base = Number(getPrice(item));
            const selected = cartExtras[item] || [];
            const extrasTotal = selected.reduce((sum, name) => sum + getExtraPrice(item, name), 0);
            return base + extrasTotal;
        }

        function calcCartTotal() {
            return Object.keys(cart).reduce((sum, item) => sum + calcItemUnitPrice(item) * cart[item], 0);
        }

        function generateIdempotencyKey() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return "key_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function init() {
            applyStaticText();
            if (!tableId) {
                document.getElementById("app").innerHTML = `<div class="missing-session">${t("no_table_msg")}</div>`;
                document.getElementById("tableLabel").innerText = t("no_table_linked");
                return;
            }
            document.getElementById("tableLabel").dataset.hasTable = "1";
            document.getElementById("tableLabel").innerText = t("table_label", tableId);
            checkForSession();
        }

        function checkForSession() {
            fetch(`${BASE}/tables/${tableId}/active-session`)
                .then(r => r.json())
                .then(data => {
                    if (!data.active) {
                        document.getElementById("app").innerHTML = `<div class="missing-session">${t("welcome_msg")}</div>`;
                        setTimeout(checkForSession, 4000);
                        return;
                    }

                    sessionId = data.session_id;
                    loadMenu();
                    loadMyOrders();
                    setInterval(loadMyOrders, 5000);
                });
        }

        function loadMenu() {
            document.getElementById("app").innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
            fetch(`${BASE}/menu`)
                .then(r => r.json())
                .then(data => {
                    menu = data;
                    renderMenu();
                })
                .catch(() => {
                    document.getElementById("app").innerHTML = `<div class="missing-session">${t("menu_load_error")}</div>`;
                });
        }

        function buildItemHtml(item) {
            const price = getPrice(item);
            const image = getImage(item);
            const description = getDescription(item);
            const imageHtml = image
                ? `<img src="${escapeHtml(image)}" class="item-photo" onerror="this.outerHTML='<div class=\\'item-photo-fallback\\'>🍽️</div>'">`
                : `<div class="item-photo-fallback">🍽️</div>`;
            const descriptionHtml = description
                ? `<div class="description">${escapeHtml(description)}</div>`
                : "";
            return `
                <div class="menu-item">
                    <div class="photo-wrap">
                        ${imageHtml}
                        <span class="item-qty-badge" id="badge-${item}"></span>
                    </div>
                    <div class="item-info">
                        <div class="name">${escapeHtml(capitalize(item))}</div>
                        ${descriptionHtml}
                        <div class="price">€${Number(price).toFixed(2)}</div>
                    </div>
                    <div class="qty-row" id="qtyrow-${item}">
                        <button class="minus-btn" id="minus-${item}" onclick="changeQty('${item}', -1)">−</button>
                        <span class="qty-display" id="qtydisplay-${item}"></span>
                        <button class="add-btn" onclick="addToCart('${item}')">+</button>
                    </div>
                </div>
            `;
        }

        function scrollToCategory(cat) {
            document.querySelectorAll(".category-tab").forEach(el => el.classList.remove("active"));
            document.getElementById(`tab-${cat}`).classList.add("active");
            document.getElementById(`cat-${cat}`).scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function scrollToActions() {
            document.getElementById("actionButtonsSection").scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function handleSearchInput(value) {
            searchTerm = value.trim().toLowerCase();
            renderMenu();
        }

        function buildActionsAndOrdersHtml() {
            return `
                <div class="action-buttons" id="actionButtonsSection">
                    <button class="call-btn" id="callBtn" onclick="callWaiter()">${t("call_waiter_btn")}</button>
                    <button class="pay-btn" id="payBtn" onclick="requestPayment()">${t("request_bill_btn")}</button>
                </div>
                <div class="section-title orders"><span class="bar"></span>${t("your_orders")}</div>
                <div class="bill-total" id="billTotalBox" style="display:none;">
                    <span class="label">${t("bill_so_far")}</span>
                    <span class="amount" id="billTotalAmount">€0.00</span>
                </div>
                <div id="ordersList"><p class="empty-orders">${t("no_orders")}</p></div>
            `;
        }

        function renderMenu() {
            const app = document.getElementById("app");
            const items = Object.keys(menu);

            if (items.length === 0) {
                app.innerHTML = `<div class="missing-session">${t("empty_menu")}</div>`;
                document.getElementById("categoryTabs").innerHTML = "";
                return;
            }

            if (searchTerm) {
                document.getElementById("categoryTabs").innerHTML = "";

                const filtered = items.filter(item => {
                    const name = capitalize(item).toLowerCase();
                    const desc = (getDescription(item) || "").toLowerCase();
                    return name.includes(searchTerm) || desc.includes(searchTerm);
                });

                const itemsHtml = filtered.length
                    ? filtered.map(buildItemHtml).join("")
                    : `<p class="empty-orders">${t("no_search_results")}</p>`;

                app.innerHTML = `
                    <div class="section-title category"><span class="bar"></span>${t("search_results_heading")}</div>
                    <div class="menu-grid">${itemsHtml}</div>
                    ${buildActionsAndOrdersHtml()}
                `;
                updateItemBadges();
                loadMyOrders();
                return;
            }

            const byCategory = {};
            items.forEach(item => {
                const cat = getCategory(item);
                if (!byCategory[cat]) byCategory[cat] = [];
                byCategory[cat].push(item);
            });

            const categoryOrder = ["drinks", "salads", "burgers"];
            const allCategories = [
                ...categoryOrder.filter(c => byCategory[c]),
                ...Object.keys(byCategory).filter(c => !categoryOrder.includes(c))
            ];

            const tabsHtml = allCategories.map((cat, i) => `
                <button class="category-tab ${i === 0 ? 'active' : ''}" id="tab-${cat}" onclick="scrollToCategory('${cat}')">${categoryLabel(cat)}</button>
            `).join("");

            let categoriesHtml = "";
            allCategories.forEach(cat => {
                const itemsHtml = byCategory[cat].map(buildItemHtml).join("");
                categoriesHtml += `
                    <div class="section-title category" id="cat-${cat}"><span class="bar"></span>${categoryLabel(cat)}</div>
                    <div class="menu-grid">${itemsHtml}</div>
                `;
            });

            document.getElementById("categoryTabs").innerHTML = tabsHtml;

            app.innerHTML = `
                ${categoriesHtml}
                ${buildActionsAndOrdersHtml()}
            `;
            updateItemBadges();
        }

        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function callWaiter() {
            const btn = document.getElementById("callBtn");
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>`;
            fetch(`${BASE}/sessions/${sessionId}/call-waiter`, { method: "POST" })
                .then(() => { btn.innerText = t("waiter_notified"); });
        }

        function requestPayment() {
            const btn = document.getElementById("payBtn");
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>`;
            fetch(`${BASE}/sessions/${sessionId}/request-payment`, { method: "POST" })
                .then(() => { btn.innerText = t("bill_requested"); });
        }

        function addToCart(item) {
            cart[item] = (cart[item] || 0) + 1;
            updateCartBar();
            updateItemBadges();
        }

        function changeQty(item, delta) {
            cart[item] = (cart[item] || 0) + delta;
            if (cart[item] <= 0) {
                delete cart[item];
                delete cartNotes[item];
                delete cartExtras[item];
            }
            updateCartBar();
            updateItemBadges();
            renderCartSheet();
        }

        function updateNote(item, value) {
            cartNotes[item] = value;
        }

        function toggleCartExtra(item, name, checked) {
            if (!cartExtras[item]) cartExtras[item] = [];
            if (checked) {
                if (!cartExtras[item].includes(name)) cartExtras[item].push(name);
            } else {
                cartExtras[item] = cartExtras[item].filter(n => n !== name);
            }
            updateCartBar();
            renderCartSheet();
        }

        function updateItemBadges() {
            Object.keys(menu).forEach(item => {
                const qty = cart[item] || 0;

                const badge = document.getElementById(`badge-${item}`);
                if (badge) {
                    if (qty > 0) {
                        badge.innerText = qty;
                        badge.style.display = "flex";
                    } else {
                        badge.style.display = "none";
                    }
                }

                const minusBtn = document.getElementById(`minus-${item}`);
                const qtyDisplay = document.getElementById(`qtydisplay-${item}`);
                if (minusBtn && qtyDisplay) {
                    if (qty > 0) {
                        minusBtn.style.display = "flex";
                        qtyDisplay.style.display = "block";
                        qtyDisplay.innerText = qty;
                    } else {
                        minusBtn.style.display = "none";
                        qtyDisplay.style.display = "none";
                    }
                }
            });
        }

        function updateCartBar() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            const bar = document.getElementById("cartBar");
            if (totalItems === 0) {
                bar.classList.add("empty");
            } else {
                bar.classList.remove("empty");
                document.getElementById("cartCount").innerText = totalItems;
                document.getElementById("cartSummary").innerText = t("view_cart");
                document.getElementById("cartBarTotal").innerText = `€${calcCartTotal().toFixed(2)}`;
            }
        }

        function openCartSheet() {
            renderCartSheet();
            document.getElementById("overlay").style.display = "flex";
        }
        function closeCartSheet() {
            document.getElementById("overlay").style.display = "none";
        }

        function renderCartSheet() {
            const div = document.getElementById("cartLines");
            const items = Object.keys(cart);
            div.innerHTML = items.length
                ? items.map(item => {
                    const availableExtras = getExtras(item);
                    const extrasHtml = availableExtras.length ? `
                        <div class="extras-picker">
                            ${availableExtras.map(e => {
                                const checked = (cartExtras[item] || []).includes(e.name) ? "checked" : "";
                                return `<label class="extra-option">
                                    <input type="checkbox" ${checked} onchange="toggleCartExtra('${item}', '${escapeHtml(e.name)}', this.checked)">
                                    ${escapeHtml(e.name)} (+€${Number(e.price).toFixed(2)})
                                </label>`;
                            }).join("")}
                        </div>
                    ` : "";
                    return `
                    <div class="cart-line">
                        <div class="cart-line-top">
                            <span class="item-name">${escapeHtml(capitalize(item))}</span>
                            <span class="qty-controls">
                                <button onclick="changeQty('${item}', -1)">−</button>
                                <span class="qty-num">${cart[item]}</span>
                                <button onclick="changeQty('${item}', 1)">+</button>
                            </span>
                        </div>
                        ${extrasHtml}
                        <input type="text" class="note-input" placeholder="${t("note_placeholder")}"
                               value="${escapeHtml(cartNotes[item] || '')}"
                               oninput="updateNote('${item}', this.value)">
                    </div>
                `;
                }).join("")
                : `<p style='color:var(--text-4); padding:24px 0;'>${t("cart_empty")}</p>`;

            const totalRow = document.getElementById("cartTotalRow");
            if (items.length) {
                totalRow.style.display = "flex";
                document.getElementById("cartTotalAmount").innerText = `€${calcCartTotal().toFixed(2)}`;
            } else {
                totalRow.style.display = "none";
            }
        }

        function submitCart() {
            const items = Object.keys(cart);
            if (items.length === 0) return alert(t("add_cart_first"));

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<div class="spinner light" style="width:18px;height:18px;border-width:2px;"></div>${t("sending")}`;

            const requests = items.map(item => {
                const key = generateIdempotencyKey();
                const note = encodeURIComponent(cartNotes[item] || "");
                const extras = encodeURIComponent(JSON.stringify(cartExtras[item] || []));
                return fetch(`${BASE}/orders?session_id=${sessionId}&item=${item}&qty=${cart[item]}&idempotency_key=${key}&note=${note}&extras=${extras}`, { method: "POST" })
                    .then(r => r.json());
            });

            Promise.all(requests).then(() => {
                cart = {};
                cartNotes = {};
                cartExtras = {};
                updateCartBar();
                updateItemBadges();
                closeCartSheet();
                loadMyOrders();
                submitBtn.disabled = false;
                submitBtn.innerText = t("send_order");
            }).catch(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = t("send_order");
                alert(t("send_error"));
            });
        }

        function loadMyOrders() {
            if (!sessionId) return;
            fetch(`${BASE}/sessions/${sessionId}/orders`)
                .then(r => r.json())
                .then(orders => {
                    const div = document.getElementById("ordersList");
                    if (!div) return;

                    const billTotal = orders
                        .filter(o => o.status === "APPROVED")
                        .reduce((sum, o) => sum + (o.price * o.qty), 0);

                    const billBox = document.getElementById("billTotalBox");
                    if (billBox) {
                        if (billTotal > 0) {
                            billBox.style.display = "flex";
                            document.getElementById("billTotalAmount").innerText = `€${billTotal.toFixed(2)}`;
                        } else {
                            billBox.style.display = "none";
                        }
                    }

                    div.innerHTML = orders.length
                        ? orders.map(o => {
                            const extrasList = (o.extras || []).map(e => escapeHtml(e.name)).join(", ");

                            let pillClass = o.status;
                            let pillLabel = t("status_labels")[o.status] || o.status;
                            let readyMsg = "";

                            if (o.status === "APPROVED" && o.ready) {
                                readyMsg = `<div class="item-ready">${t("ready_now")}</div>`;
                                pillClass = "READY";
                                pillLabel = t("status_labels").READY;
                            }

                            return `
                            <div class="order-status">
                                <div>
                                    <span class="item-name">${o.qty}x ${escapeHtml(capitalize(o.item))}</span>
                                    ${extrasList ? `<div class="item-extras">+ ${extrasList}</div>` : ""}
                                    ${o.note ? `<div class="item-note">💬 ${escapeHtml(o.note)}</div>` : ""}
                                    ${readyMsg}
                                </div>
                                <span class="pill ${pillClass}">${pillLabel}</span>
                            </div>
                        `;
                        }).join("")
                        : `<p class='empty-orders'>${t("no_orders")}</p>`;
                });
        }

        init();
    </script>
</body>
</html>
