<!DOCTYPE html>
<html>
<head>
    <title>Katina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #fff0e0 0%, #f7f5f2 340px, #f7f5f2 100%);
            padding-bottom: 200px;
            color: #1a1a1a;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 28px 24px 20px;
            color: white;
        }
        header .brand {
            display: flex; align-items: center; gap: 14px;
            max-width: 900px; margin: 0 auto;
        }
        header .logo {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(255,107,53,0.35);
        }
        header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        header .sub { font-size: 14px; color: #ffb088; margin-top: 3px; font-weight: 600; }

        .hero {
            background: linear-gradient(135deg, #2a9d8f, #1d7d72);
            background-image:
                radial-gradient(circle at 15% 30%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 75% 60%, rgba(255,255,255,0.08) 2px, transparent 2px),
                radial-gradient(circle at 45% 80%, rgba(255,255,255,0.06) 2px, transparent 2px),
                linear-gradient(135deg, #2a9d8f, #1d7d72);
            background-size: 40px 40px, 60px 60px, 50px 50px, cover;
            padding: 22px 24px;
            border-radius: 0 0 28px 28px;
            color: white;
            box-shadow: 0 4px 20px rgba(29,125,114,0.25);
        }
        .hero-inner { max-width: 900px; margin: 0 auto; }
        .hero .tagline { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .hero .tagline-sub { font-size: 13px; color: #b8e8e2; font-weight: 500; }

        .container { padding: 24px; max-width: 540px; margin: 0 auto; }

        .missing-session {
            background: white; color: #b9770e;
            padding: 28px 20px; border-radius: 20px; text-align: center;
            font-size: 15px; line-height: 1.6;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            margin-top: 20px;
        }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 24px; font-weight: 800;
            margin: 32px 0 18px;
            letter-spacing: -0.5px;
        }
        .container > .section-title:first-child,
        .category-section:first-child .section-title { margin-top: 4px; }
        .section-title .bar {
            width: 5px; height: 24px; border-radius: 3px;
            background: #ff6b35;
        }
        .section-title.orders .bar { background: #2a9d8f; }
        .section-title.category .bar { background: #7c3aed; }

        .bill-total {
            background: white;
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
        }
        .bill-total .label { font-size: 14px; color: #777; font-weight: 600; }
        .bill-total .amount { font-size: 22px; font-weight: 800; color: #ff6b35; }

        .menu-grid { display: block; margin-bottom: 8px; }

        .menu-item {
            background: white;
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 14px rgba(0,0,0,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .menu-item:active { transform: scale(0.98); }

        .photo-wrap { position: relative; margin-right: 16px; flex-shrink: 0; }
        .item-photo, .item-photo-fallback {
            width: 76px; height: 76px;
            border-radius: 18px;
            object-fit: cover;
        }
        .item-photo-fallback {
            background: linear-gradient(135deg, #fff4e6, #ffe4cc);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        .item-qty-badge {
            position: absolute;
            top: -8px; right: -8px;
            background: #ff6b35;
            color: white;
            font-size: 13px;
            font-weight: 800;
            width: 26px; height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(255,107,53,0.4);
            border: 2px solid white;
        }

        .item-info { flex: 1; min-width: 0; }
        .menu-item .name { font-weight: 700; font-size: 17px; margin-bottom: 3px; }
        .menu-item .description {
            font-size: 12.5px; color: #999; line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .menu-item .price { color: #ff6b35; font-weight: 800; font-size: 16px; }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .qty-row .add-btn {
            background: #1a1a1a; color: white; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.12s, background 0.12s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .qty-row .add-btn:active { transform: scale(0.88); background: #ff6b35; }
        .qty-row .minus-btn {
            background: #f5f5f5; color: #1a1a1a; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            font-size: 22px; cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: transform 0.12s;
        }
        .qty-row .minus-btn:active { transform: scale(0.88); }
        .qty-row .qty-display {
            display: none;
            font-weight: 800; font-size: 16px;
            min-width: 20px; text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 32px 0;
        }
        .action-buttons button {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .action-buttons button:active { transform: scale(0.96); }
        .call-btn { background: #fff4e6; color: #b9770e; }
        .pay-btn { background: #e6f5f3; color: #1d7d72; }
        .action-buttons button:disabled { background: #f0f0f0; color: #aaa; transform: none; }

        .order-status {
            background: white; border-radius: 18px; padding: 16px 18px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }
        .order-status .item-name { font-weight: 700; font-size: 15px; }
        .pill { font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 20px; }
        .pill.PENDING_REVIEW { background: #fff4e6; color: #b9770e; }
        .pill.APPROVED { background: #e6f5f3; color: #1d7d72; }
        .pill.REJECTED { background: #fce8e6; color: #c0392b; }
        .pill.CANCELLED { background: #f0f0f0; color: #888; }

        .empty-orders { color: #bbb; font-size: 15px; text-align: center; padding: 24px; }

        .cart-bar {
            position: fixed;
            bottom: 20px; left: 16px; right: 16px;
            max-width: 508px; margin: 0 auto;
            background: #1a1a1a;
            color: white;
            padding: 20px 26px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(0,0,0,0.28);
            transition: transform 0.15s;
        }
        .cart-bar:active { transform: scale(0.97); }
        .cart-bar.empty { display: none; }
        .cart-bar .count {
            background: #ff6b35;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800;
            margin-right: 12px;
        }
        .cart-bar .left { display: flex; align-items: center; font-size: 16px; font-weight: 700; }
        .cart-bar .arrow { font-size: 20px; }

        .overlay {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            align-items: flex-end;
            justify-content: center;
            z-index: 20;
        }
        .sheet {
            background: white;
            border-radius: 28px 28px 0 0;
            padding: 28px;
            width: 100%;
            max-width: 540px;
            max-height: 82vh;
            overflow-y: auto;
        }
        .sheet-handle {
            width: 44px; height: 5px;
            background: #ddd;
            border-radius: 4px;
            margin: 0 auto 20px;
        }
        .sheet h2 { font-size: 24px; margin-bottom: 20px; font-weight: 800; }
        .cart-line {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid #f2f2f2;
        }
        .cart-line .item-name { font-weight: 700; font-size: 16px; }
        .qty-controls { display: flex; align-items: center; gap: 14px; }
        .qty-controls button {
            background: #f5f5f5; border: none; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; font-size: 18px; font-weight: 800;
        }
        .qty-controls .qty-num { font-weight: 800; min-width: 20px; text-align: center; font-size: 16px; }
        .submit-btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white; border: none;
            padding: 20px; border-radius: 18px; width: 100%;
            font-size: 17px; font-weight: 800; margin-top: 24px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255,107,53,0.35);
        }
        .submit-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
        .close-sheet {
            position: absolute; top: 24px; right: 24px;
            cursor: pointer; font-size: 26px; color: #bbb;
        }
        .sheet-content { position: relative; }

        @media (min-width: 700px) {
            .container { max-width: 900px; }
            .cart-bar { max-width: 500px; left: auto; right: 40px; }

            .menu-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 18px;
            }
            .menu-item {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                padding: 16px;
            }
            .photo-wrap { width: 100%; margin-right: 0; margin-bottom: 14px; }
            .item-photo, .item-photo-fallback {
                width: 100%;
                height: 150px;
                border-radius: 16px;
            }
            .item-photo-fallback { font-size: 44px; }
            .item-info { width: 100%; margin-bottom: 12px; }
            .menu-item .description { -webkit-line-clamp: 3; }
            .qty-row { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo">🍽️</div>
            <div>
                <h1>Katina</h1>
                <div class="sub" id="tableLabel">Loading table...</div>
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="hero-inner">
            <div class="tagline">What are you craving today?</div>
            <div class="tagline-sub">Fresh picks, made to order, straight to your table</div>
        </div>
    </div>

    <div class="container" id="app">
        <p style="text-align:center; color:#999; margin-top:40px;">Loading...</p>
    </div>

    <div class="cart-bar empty" id="cartBar" onclick="openCartSheet()">
        <div class="left">
            <div class="count" id="cartCount">0</div>
            <span id="cartSummary">View cart</span>
        </div>
        <span class="arrow">→</span>
    </div>

    <div class="overlay" id="overlay">
        <div class="sheet">
            <div class="sheet-content">
                <span class="close-sheet" onclick="closeCartSheet()">✕</span>
                <div class="sheet-handle"></div>
                <h2>Your Cart</h2>
                <div id="cartLines"></div>
                <button class="submit-btn" onclick="submitCart()">Send Order to Waiter</button>
            </div>
        </div>
    </div>

    <script>
        const BASE = "https://katina-bot.onrender.com";
        const params = new URLSearchParams(window.location.search);
        const tableId = params.get("table");

        let sessionId = null;
        let menu = {};
        let cart = {};

        const CATEGORY_LABELS = {
            drinks: "🥤 Drinks",
            salads: "🥗 Salads",
            burgers: "🍔 Burgers",
            other: "🍽️ More"
        };

        function categoryLabel(cat) {
            return CATEGORY_LABELS[cat] || capitalize(cat);
        }

        function getPrice(item) {
            const data = menu[item];
            return typeof data === "object" ? data.price : data;
        }
        function getImage(item) {
            const data = menu[item];
            return typeof data === "object" ? data.image : null;
        }
        function getDescription(item) {
            const data = menu[item];
            return typeof data === "object" ? data.description : null;
        }
        function getCategory(item) {
            const data = menu[item];
            return (typeof data === "object" && data.category) ? data.category : "other";
        }

        function generateIdempotencyKey() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return "key_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function init() {
            if (!tableId) {
                document.getElementById("app").innerHTML = `
                    <div class="missing-session">
                        No table found in the link.<br>Please scan the QR code on your table.
                    </div>`;
                document.getElementById("tableLabel").innerText = "No table linked";
                return;
            }
            document.getElementById("tableLabel").innerText = "Table " + tableId;
            checkForSession();
        }

        function checkForSession() {
            fetch(`${BASE}/tables/${tableId}/active-session`)
                .then(r => r.json())
                .then(data => {
                    if (!data.active) {
                        document.getElementById("app").innerHTML = `
                            <div class="missing-session">
                                👋 Welcome! A member of staff will be with you shortly
                                to get you started.
                            </div>`;
                        setTimeout(checkForSession, 4000);
                        return;
                    }

                    sessionId = data.session_id;
                    loadMenu();
                    loadMyOrders();
                    setInterval(loadMyOrders, 5000);
                });
        }

        function loadMenu() {
            fetch(`${BASE}/menu`)
                .then(r => r.json())
                .then(data => {
                    menu = data;
                    renderMenu();
                })
                .catch(() => {
                    document.getElementById("app").innerHTML = `
                        <div class="missing-session">
                            Couldn't load the menu right now. Please try refreshing.
                        </div>`;
                });
        }

        function buildItemHtml(item) {
            const price = getPrice(item);
            const image = getImage(item);
            const description = getDescription(item);
            const imageHtml = image
                ? `<img src="${escapeHtml(image)}" class="item-photo" onerror="this.outerHTML='<div class=\\'item-photo-fallback\\'>🍽️</div>'">`
                : `<div class="item-photo-fallback">🍽️</div>`;
            const descriptionHtml = description
                ? `<div class="description">${escapeHtml(description)}</div>`
                : "";
            return `
                <div class="menu-item">
                    <div class="photo-wrap">
                        ${imageHtml}
                        <span class="item-qty-badge" id="badge-${item}"></span>
                    </div>
                    <div class="item-info">
                        <div class="name">${escapeHtml(capitalize(item))}</div>
                        ${descriptionHtml}
                        <div class="price">€${Number(price).toFixed(2)}</div>
                    </div>
                    <div class="qty-row" id="qtyrow-${item}">
                        <button class="minus-btn" id="minus-${item}" onclick="changeQty('${item}', -1)">−</button>
                        <span class="qty-display" id="qtydisplay-${item}"></span>
                        <button class="add-btn" onclick="addToCart('${item}')">+</button>
                    </div>
                </div>
            `;
        }

        function renderMenu() {
            const app = document.getElementById("app");
            const items = Object.keys(menu);

            if (items.length === 0) {
                app.innerHTML = `<div class="missing-session">The menu is empty right now.</div>`;
                return;
            }

            const byCategory = {};
            items.forEach(item => {
                const cat = getCategory(item);
                if (!byCategory[cat]) byCategory[cat] = [];
                byCategory[cat].push(item);
            });

            const categoryOrder = ["drinks", "salads", "burgers"];
            const allCategories = [
                ...categoryOrder.filter(c => byCategory[c]),
                ...Object.keys(byCategory).filter(c => !categoryOrder.includes(c))
            ];

            let categoriesHtml = "";
            allCategories.forEach(cat => {
                const itemsHtml = byCategory[cat].map(buildItemHtml).join("");
                categoriesHtml += `
                    <div class="section-title category"><span class="bar"></span>${categoryLabel(cat)}</div>
                    <div class="menu-grid">${itemsHtml}</div>
                `;
            });

            app.innerHTML = `
                ${categoriesHtml}
                <div class="action-buttons">
                    <button class="call-btn" id="callBtn" onclick="callWaiter()">🔔 Call Waiter</button>
                    <button class="pay-btn" id="payBtn" onclick="requestPayment()">💳 Request the Bill</button>
                </div>
                <div class="section-title orders"><span class="bar"></span>Your Orders</div>
                <div class="bill-total" id="billTotalBox" style="display:none;">
                    <span class="label">Bill so far</span>
                    <span class="amount" id="billTotalAmount">€0.00</span>
                </div>
                <div id="ordersList"><p class="empty-orders">No orders yet.</p></div>
            `;
            updateItemBadges();
        }

        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function callWaiter() {
            const btn = document.getElementById("callBtn");
            btn.disabled = true;
            btn.innerText = "🔔 Waiter notified";
            fetch(`${BASE}/sessions/${sessionId}/call-waiter`, { method: "POST" });
        }

        function requestPayment() {
            const btn = document.getElementById("payBtn");
            btn.disabled = true;
            btn.innerText = "💳 Bill requested";
            fetch(`${BASE}/sessions/${sessionId}/request-payment`, { method: "POST" });
        }

        function addToCart(item) {
            cart[item] = (cart[item] || 0) + 1;
            updateCartBar();
            updateItemBadges();
        }

        function changeQty(item, delta) {
            cart[item] = (cart[item] || 0) + delta;
            if (cart[item] <= 0) delete cart[item];
            updateCartBar();
            updateItemBadges();
            renderCartSheet();
        }

        function updateItemBadges() {
            Object.keys(menu).forEach(item => {
                const qty = cart[item] || 0;

                const badge = document.getElementById(`badge-${item}`);
                if (badge) {
                    if (qty > 0) {
                        badge.innerText = qty;
                        badge.style.display = "flex";
                    } else {
                        badge.style.display = "none";
                    }
                }

                const minusBtn = document.getElementById(`minus-${item}`);
                const qtyDisplay = document.getElementById(`qtydisplay-${item}`);
                if (minusBtn && qtyDisplay) {
                    if (qty > 0) {
                        minusBtn.style.display = "flex";
                        qtyDisplay.style.display = "block";
                        qtyDisplay.innerText = qty;
                    } else {
                        minusBtn.style.display = "none";
                        qtyDisplay.style.display = "none";
                    }
                }
            });
        }

        function updateCartBar() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            const bar = document.getElementById("cartBar");
            if (totalItems === 0) {
                bar.classList.add("empty");
            } else {
                bar.classList.remove("empty");
                document.getElementById("cartCount").innerText = totalItems;
                document.getElementById("cartSummary").innerText = "View cart";
            }
        }

        function openCartSheet() {
            renderCartSheet();
            document.getElementById("overlay").style.display = "flex";
        }
        function closeCartSheet() {
            document.getElementById("overlay").style.display = "none";
        }

        function renderCartSheet() {
            const div = document.getElementById("cartLines");
            const items = Object.keys(cart);
            div.innerHTML = items.length
                ? items.map(item => `
                    <div class="cart-line">
                        <span class="item-name">${escapeHtml(capitalize(item))}</span>
                        <span class="qty-controls">
                            <button onclick="changeQty('${item}', -1)">−</button>
                            <span class="qty-num">${cart[item]}</span>
                            <button onclick="changeQty('${item}', 1)">+</button>
                        </span>
                    </div>
                `).join("")
                : "<p style='color:#999; padding:24px 0;'>Your cart is empty.</p>";
        }

        function submitCart() {
            const items = Object.keys(cart);
            if (items.length === 0) return alert("Add something to your cart first.");

            const submitBtn = document.querySelector(".submit-btn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            const requests = items.map(item => {
                const key = generateIdempotencyKey();
                return fetch(`${BASE}/orders?session_id=${sessionId}&item=${item}&qty=${cart[item]}&idempotency_key=${key}`, { method: "POST" })
                    .then(r => r.json());
            });

            Promise.all(requests).then(() => {
                cart = {};
                updateCartBar();
                updateItemBadges();
                closeCartSheet();
                loadMyOrders();
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Order to Waiter";
            }).catch(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Order to Waiter";
                alert("Something went wrong — please try again.");
            });
        }

        function loadMyOrders() {
            if (!sessionId) return;
            fetch(`${BASE}/sessions/${sessionId}/orders`)
                .then(r => r.json())
                .then(orders => {
                    const div = document.getElementById("ordersList");
                    if (!div) return;

                    const billTotal = orders
                        .filter(o => o.status === "APPROVED")
                        .reduce((sum, o) => sum + (o.price * o.qty), 0);

                    const billBox = document.getElementById("billTotalBox");
                    if (billBox) {
                        if (billTotal > 0) {
                            billBox.style.display = "flex";
                            document.getElementById("billTotalAmount").innerText = `€${billTotal.toFixed(2)}`;
                        } else {
                            billBox.style.display = "none";
                        }
                    }

                    div.innerHTML = orders.length
                        ? orders.map(o => `
                            <div class="order-status">
                                <span class="item-name">${o.qty}x ${escapeHtml(capitalize(o.item))}</span>
                                <span class="pill ${o.status}">${o.status.replace("_", " ")}</span>
                            </div>
                        `).join("")
                        : "<p class='empty-orders'>No orders yet.</p>";
                });
        }

        init();
    </script>
